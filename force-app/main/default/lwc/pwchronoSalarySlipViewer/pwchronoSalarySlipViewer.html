<template lwc:render-mode="light">
  <template lwc:if={accessLoaded}>
    <template lwc:if={hasAccess}>
      <main class="page-wrapper no-print">
        <div class="content payroll-shell">
          <header class="page-heading">
            <div>
              <p class="eyebrow">Employee finance</p>
              <h1>Payroll</h1>
              <p class="page-subtitle">
                Prepare monthly payroll and review published salary slips.
              </p>
            </div>
            <div class="secure-badge">
              <span class="secure-badge__icon" aria-hidden="true">✓</span>
              Session protected
            </div>
          </header>

          <template lwc:if={hasAdminAccess}>
            <nav class="payroll-tabs" aria-label="Payroll sections">
              <button
                type="button"
                class={runTabClass}
                aria-current={isRunView}
                onclick={handleRunTab}
              >
                Payroll run
              </button>
              <button
                type="button"
                class={slipsTabClass}
                aria-current={isSlipsView}
                onclick={handleSlipsTab}
              >
                My salary slips
              </button>
            </nav>
          </template>

          <template lwc:if={isRunView}>
            <section class="run-toolbar" aria-label="Payroll run controls">
              <div class="field-group">
                <label for="payrollMonth">Payroll period</label>
                <input
                  id="payrollMonth"
                  class="native-control"
                  type="month"
                  value={payrollMonth}
                  onchange={handlePayrollMonthChange}
                  disabled={isPayrollBusy}
                />
              </div>
              <div class="field-group">
                <label for="paymentDate">Payment date</label>
                <input
                  id="paymentDate"
                  class="native-control"
                  type="date"
                  value={paymentDate}
                  onchange={handlePaymentDateChange}
                  disabled={isPayrollBusy}
                />
              </div>
              <div class="field-group">
                <label for="paymentMethod">Payment method</label>
                <select
                  id="paymentMethod"
                  class="native-control"
                  value={paymentMethod}
                  onchange={handlePaymentMethodChange}
                  disabled={isPayrollBusy}
                >
                  <template for:each={paymentMethodOptions} for:item="method">
                    <option key={method} value={method}>{method}</option>
                  </template>
                </select>
              </div>
              <div class="toolbar-actions">
                <button
                  type="button"
                  class="btn btn-secondary"
                  onclick={handleGenerateDrafts}
                  disabled={generateDisabled}
                >
                  Generate drafts
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  onclick={handleSubmitPayroll}
                  disabled={submitDisabled}
                >
                  Finalize payroll
                </button>
                <button
                  type="button"
                  class="btn btn-success"
                  onclick={handleMarkPaid}
                  disabled={payDisabled}
                >
                  Mark paid
                </button>
              </div>
            </section>

            <template lwc:if={payrollError}>
              <div class="notice notice_error" role="alert">
                <lightning-icon
                  icon-name="utility:error"
                  size="x-small"
                ></lightning-icon>
                <div>
                  <strong>Payroll could not load</strong>
                  <p>{payrollError}</p>
                </div>
                <button
                  type="button"
                  class="text-button"
                  onclick={loadPayrollWorkspace}
                >
                  Retry
                </button>
              </div>
            </template>

            <template lwc:if={isPayrollLoading}>
              <section class="loading-card" aria-live="polite">
                <lightning-spinner
                  alternative-text="Loading payroll"
                  size="medium"
                ></lightning-spinner>
                <p>Loading payroll readiness and calculations...</p>
              </section>
            </template>

            <template lwc:elseif={payrollWorkspace}>
              <template lwc:if={isPayrollBusy}>
                <div class="busy-banner" aria-live="assertive">
                  <lightning-spinner
                    alternative-text={payrollBusyLabel}
                    size="small"
                  ></lightning-spinner>
                  <span>{payrollBusyLabel}</span>
                </div>
              </template>

              <template lwc:if={configurationComplete}>
                <div class="notice notice_success" role="status">
                  <lightning-icon
                    icon-name="utility:success"
                    size="x-small"
                  ></lightning-icon>
                  <div>
                    <strong>Salary setup is complete</strong>
                    <p>
                      All {activeEmployeeCount} active employees can be included
                      in this payroll run.
                    </p>
                  </div>
                </div>
              </template>
              <template lwc:else>
                <div class="notice notice_warning" role="status">
                  <lightning-icon
                    icon-name="utility:warning"
                    size="x-small"
                  ></lightning-icon>
                  <div>
                    <strong>Payroll setup needs attention</strong>
                    <p>
                      Enter an effective base salary for
                      {missingAssignmentCount} employee(s). Payroll cannot be
                      finalized until every active employee is configured.
                    </p>
                  </div>
                </div>
              </template>

              <section class="process-card" aria-label="Payroll process">
                <div class={setupStepClass}>
                  <span class="process-step__number">1</span>
                  <div>
                    <strong>Salary setup</strong>
                    <span
                      >{readyEmployeeCount} of {activeEmployeeCount} ready</span
                    >
                  </div>
                </div>
                <div class={draftStepClass}>
                  <span class="process-step__number">2</span>
                  <div>
                    <strong>Calculate drafts</strong>
                    <span>{draftCount} draft payslips</span>
                  </div>
                </div>
                <div class={submitStepClass}>
                  <span class="process-step__number">3</span>
                  <div>
                    <strong>Finalize</strong>
                    <span>{submittedCount} published payslips</span>
                  </div>
                </div>
                <div class={paidStepClass}>
                  <span class="process-step__number">4</span>
                  <div>
                    <strong>Record payment</strong>
                    <span>{paidCount} paid payslips</span>
                  </div>
                </div>
              </section>

              <section class="metrics-grid" aria-label="Payroll totals">
                <article class="metric-card metric-card_people">
                  <div class="metric-icon" aria-hidden="true">👥</div>
                  <div>
                    <span>Employees</span>
                    <strong>{activeEmployeeCount}</strong>
                    <small>{readyEmployeeCount} configured</small>
                  </div>
                </article>
                <article class="metric-card metric-card_gross">
                  <div class="metric-icon" aria-hidden="true">↗</div>
                  <div>
                    <span>Gross payroll</span>
                    <strong>
                      <lightning-formatted-number
                        value={totalGross}
                        format-style="currency"
                        currency-code={currencyCode}
                        maximum-fraction-digits="0"
                      ></lightning-formatted-number>
                    </strong>
                    <small>Configured estimate or saved slip</small>
                  </div>
                </article>
                <article class="metric-card metric-card_deductions">
                  <div class="metric-icon" aria-hidden="true">−</div>
                  <div>
                    <span>Deductions</span>
                    <strong>
                      <lightning-formatted-number
                        value={totalDeductions}
                        format-style="currency"
                        currency-code={currencyCode}
                        maximum-fraction-digits="0"
                      ></lightning-formatted-number>
                    </strong>
                    <small>Components and unpaid leave</small>
                  </div>
                </article>
                <article class="metric-card metric-card_net">
                  <div class="metric-icon" aria-hidden="true">✓</div>
                  <div>
                    <span>Net payroll</span>
                    <strong>
                      <lightning-formatted-number
                        value={totalNet}
                        format-style="currency"
                        currency-code={currencyCode}
                        maximum-fraction-digits="0"
                      ></lightning-formatted-number>
                    </strong>
                    <small>{payrollPeriodLabel}</small>
                  </div>
                </article>
              </section>

              <section class="table-card">
                <div class="table-card__heading">
                  <div>
                    <p class="eyebrow">Payroll register</p>
                    <h2>{payrollPeriodLabel}</h2>
                    <p>
                      Base salary is effective from the first day of the
                      selected period. Finalized salaries are locked for that
                      period.
                    </p>
                  </div>
                  <span class="record-count"
                    >{activeEmployeeCount} employees</span
                  >
                </div>

                <template lwc:if={hasPayrollRows}>
                  <div class="table-scroll">
                    <table class="payroll-table">
                      <thead>
                        <tr>
                          <th scope="col">Employee</th>
                          <th scope="col">Status</th>
                          <th scope="col">Base salary</th>
                          <th scope="col">Gross</th>
                          <th scope="col">Deductions</th>
                          <th scope="col">Net pay</th>
                          <th scope="col">Leave</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={payrollRows} for:item="row">
                          <tr key={row.contactId}>
                            <td>
                              <div class="employee-cell">
                                <span class="employee-avatar" aria-hidden="true"
                                  >{row.initials}</span
                                >
                                <div>
                                  <strong>{row.employeeName}</strong>
                                  <span
                                    >{row.employeeCode} ·
                                    {row.designation}</span
                                  >
                                  <small>{row.department}</small>
                                </div>
                              </div>
                            </td>
                            <td>
                              <span class={row.statusClass}>{row.status}</span>
                              <small class="cell-help"
                                >{row.readinessMessage}</small
                              >
                            </td>
                            <td>
                              <div class="salary-editor">
                                <input
                                  class="salary-input"
                                  type="number"
                                  min="0.01"
                                  step="0.01"
                                  value={row.baseSalaryInput}
                                  data-contact-id={row.contactId}
                                  aria-label="Base salary"
                                  onchange={handleBaseSalaryChange}
                                  disabled={row.salaryLocked}
                                />
                                <button
                                  type="button"
                                  class="save-salary-button"
                                  data-contact-id={row.contactId}
                                  onclick={handleSaveSalary}
                                  disabled={row.salaryLocked}
                                >
                                  Save
                                </button>
                              </div>
                              <small class="cell-help"
                                >{row.componentSummary}</small
                              >
                            </td>
                            <td class="money-cell">
                              <lightning-formatted-number
                                value={row.grossPay}
                                format-style="currency"
                                currency-code={currencyCode}
                              ></lightning-formatted-number>
                            </td>
                            <td class="money-cell money-cell_deduction">
                              <lightning-formatted-number
                                value={row.totalDeductions}
                                format-style="currency"
                                currency-code={currencyCode}
                              ></lightning-formatted-number>
                            </td>
                            <td class="money-cell money-cell_net">
                              <lightning-formatted-number
                                value={row.netPay}
                                format-style="currency"
                                currency-code={currencyCode}
                              ></lightning-formatted-number>
                            </td>
                            <td>
                              <span class="leave-line"
                                >{row.paidLeaveDays} paid</span
                              >
                              <span class="leave-line leave-line_unpaid"
                                >{row.unpaidLeaveDays} unpaid</span
                              >
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template lwc:else>
                  <div class="empty-state">
                    <lightning-icon
                      icon-name="utility:groups"
                      size="large"
                    ></lightning-icon>
                    <h3>No active employees</h3>
                    <p>
                      Active portal employees with a linked Contact will appear
                      here.
                    </p>
                  </div>
                </template>
              </section>

              <div class="payment-note">
                <lightning-icon
                  icon-name="utility:info"
                  size="x-small"
                ></lightning-icon>
                <p>
                  <strong>Payment boundary:</strong> Mark paid records an
                  internal payroll status and payment date. It does not connect
                  to a bank or transfer funds.
                </p>
              </div>
            </template>
          </template>

          <template lwc:if={isSlipsView}>
            <section class="slips-view">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">Employee self service</p>
                  <h2>My salary slips</h2>
                  <p>View finalized payroll statements and their breakdown.</p>
                </div>
                <span class="record-count">{slipCount} records</span>
              </div>

              <div class="filter-card">
                <lightning-combobox
                  label="Employee"
                  value={selectedContactId}
                  options={employeeOptions}
                  onchange={handleEmployeeChange}
                  disabled={isEmployeeDropdownReadOnly}
                ></lightning-combobox>
                <lightning-combobox
                  label="Year"
                  value={selectedYear}
                  options={yearOptions}
                  onchange={handleYearChange}
                ></lightning-combobox>
                <lightning-combobox
                  label="Month"
                  value={selectedMonth}
                  options={monthOptions}
                  onchange={handleMonthChange}
                ></lightning-combobox>
              </div>

              <template lwc:if={error}>
                <div class="notice notice_error" role="alert">
                  <lightning-icon
                    icon-name="utility:error"
                    size="x-small"
                  ></lightning-icon>
                  <p>{error}</p>
                </div>
              </template>

              <template lwc:if={isLoading}>
                <section class="loading-card" aria-live="polite">
                  <lightning-spinner
                    alternative-text="Loading salary slips"
                    size="medium"
                  ></lightning-spinner>
                  <p>Loading salary slips...</p>
                </section>
              </template>
              <template lwc:elseif={hasSalarySlips}>
                <section class="table-card salary-records">
                  <lightning-datatable
                    key-field="Id"
                    data={salarySlips}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}
                  ></lightning-datatable>
                  <footer class="pagination-bar">
                    <lightning-combobox
                      value={pageSize}
                      options={pageSizeOptions}
                      onchange={handlePageSizeChange}
                      variant="label-hidden"
                      aria-label="Rows per page"
                    ></lightning-combobox>
                    <div>
                      <span>{pageInfo}</span>
                      <button
                        type="button"
                        class="pagination-button"
                        onclick={handlePrevPage}
                        disabled={isPrevDisabled}
                      >
                        Previous
                      </button>
                      <button
                        type="button"
                        class="pagination-button"
                        onclick={handleNextPage}
                        disabled={isNextDisabled}
                      >
                        Next
                      </button>
                    </div>
                  </footer>
                </section>
              </template>
              <template lwc:else>
                <section class="empty-state empty-state_card">
                  <span class="empty-icon" aria-hidden="true">$</span>
                  <h3>No finalized salary slips</h3>
                  <p>
                    Submitted and paid payroll statements for the selected
                    period will appear here.
                  </p>
                </section>
              </template>
            </section>
          </template>
        </div>
      </main>
    </template>

    <template lwc:elseif={accessDenied}>
      <section class="access-state">
        <lightning-icon icon-name="utility:lock" size="large"></lightning-icon>
        <h1>Payroll access required</h1>
        <p>
          Your profile does not include the Payroll feature. Contact an
          administrator if you believe this is incorrect.
        </p>
      </section>
    </template>
  </template>

  <template lwc:else>
    <section class="loading-card loading-card_page" aria-live="polite">
      <lightning-spinner
        alternative-text="Checking payroll access"
        size="medium"
      ></lightning-spinner>
      <p>Checking payroll access...</p>
    </section>
  </template>

  <template lwc:if={showConfirmationModal}>
    <section
      class="modal-layer no-print"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmationTitle"
    >
      <button
        type="button"
        class="modal-backdrop"
        aria-label="Close confirmation"
        onclick={closeConfirmation}
      ></button>
      <div class="modal-card modal-card_small">
        <div class="confirmation-icon" aria-hidden="true">!</div>
        <h2 id="confirmationTitle">{confirmationTitle}</h2>
        <p>{confirmationMessage}</p>
        <div class="modal-actions">
          <button
            type="button"
            class="btn btn-secondary"
            onclick={closeConfirmation}
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-primary"
            onclick={handleConfirmAction}
          >
            {confirmationButtonLabel}
          </button>
        </div>
      </div>
    </section>
  </template>

  <template lwc:if={showDetailModal}>
    <section
      class="modal-layer no-print"
      role="dialog"
      aria-modal="true"
      aria-labelledby="salarySlipDialogTitle"
    >
      <button
        type="button"
        class="modal-backdrop"
        aria-label="Close salary slip"
        onclick={closeModal}
      ></button>
      <div class="modal-card modal-card_large">
        <header class="modal-header">
          <div>
            <p class="eyebrow">Payroll statement</p>
            <h2 id="salarySlipDialogTitle">{selectedSlipName}</h2>
          </div>
          <div class="modal-header__actions">
            <template lwc:if={canSendPayslips}>
              <button
                type="button"
                class="btn btn-secondary"
                onclick={handleOpenEmailModal}
              >
                Email
              </button>
            </template>
            <button type="button" class="btn btn-primary" onclick={handlePrint}>
              Print / PDF
            </button>
            <button
              type="button"
              class="icon-button"
              aria-label="Close salary slip"
              onclick={closeModal}
            >
              ×
            </button>
          </div>
        </header>

        <div class="modal-body">
          <template lwc:if={isLoadingDetails}>
            <div class="loading-card">
              <lightning-spinner
                alternative-text="Loading salary slip"
                size="medium"
              ></lightning-spinner>
              <p>Loading statement details...</p>
            </div>
          </template>
          <template lwc:elseif={slipDetails}>
            <section class="slip-summary">
              <div>
                <span>Employee</span>
                <strong>{employeeName}</strong>
                <small>{employeeCode}</small>
              </div>
              <div>
                <span>Pay period</span>
                <strong>{formattedPeriod}</strong>
                <small>{slipDetails.salarySlip.Status__c}</small>
              </div>
              <div class="slip-summary__net">
                <span>Net pay</span>
                <strong>
                  <lightning-formatted-number
                    value={slipDetails.salarySlip.Net_Pay__c}
                    format-style="currency"
                    currency-code={currencyCode}
                  ></lightning-formatted-number>
                </strong>
              </div>
            </section>

            <div class="breakdown-grid">
              <section class="breakdown-card">
                <header>
                  <span class="breakdown-dot breakdown-dot_earning"></span>
                  <h3>Earnings</h3>
                </header>
                <template for:each={slipDetails.earnings} for:item="earning">
                  <div key={earning.name} class="breakdown-line">
                    <span>{earning.name}</span>
                    <strong>
                      <lightning-formatted-number
                        value={earning.amount}
                        format-style="currency"
                        currency-code={currencyCode}
                      ></lightning-formatted-number>
                    </strong>
                  </div>
                </template>
                <footer>
                  <span>Total earnings</span>
                  <strong>
                    <lightning-formatted-number
                      value={slipDetails.salarySlip.Gross_Pay__c}
                      format-style="currency"
                      currency-code={currencyCode}
                    ></lightning-formatted-number>
                  </strong>
                </footer>
              </section>

              <section class="breakdown-card">
                <header>
                  <span class="breakdown-dot breakdown-dot_deduction"></span>
                  <h3>Deductions</h3>
                </header>
                <template
                  for:each={slipDetails.deductions}
                  for:item="deduction"
                >
                  <div key={deduction.name} class="breakdown-line">
                    <span>{deduction.name}</span>
                    <strong>
                      <lightning-formatted-number
                        value={deduction.amount}
                        format-style="currency"
                        currency-code={currencyCode}
                      ></lightning-formatted-number>
                    </strong>
                  </div>
                </template>
                <footer>
                  <span>Total deductions</span>
                  <strong>
                    <lightning-formatted-number
                      value={slipDetails.salarySlip.Total_Deductions__c}
                      format-style="currency"
                      currency-code={currencyCode}
                    ></lightning-formatted-number>
                  </strong>
                </footer>
              </section>
            </div>
          </template>
        </div>
      </div>
    </section>
  </template>

  <template lwc:if={showEmailModal}>
    <section
      class="modal-layer no-print"
      role="dialog"
      aria-modal="true"
      aria-labelledby="emailDialogTitle"
    >
      <button
        type="button"
        class="modal-backdrop"
        aria-label="Close email dialog"
        onclick={handleCloseEmailModal}
      ></button>
      <div class="modal-card modal-card_medium">
        <header class="modal-header">
          <h2 id="emailDialogTitle">Send salary slip</h2>
          <button
            type="button"
            class="icon-button"
            aria-label="Close email dialog"
            onclick={handleCloseEmailModal}
          >
            ×
          </button>
        </header>
        <div class="modal-body form-stack">
          <lightning-input
            label="To"
            value={emailTo}
            disabled
          ></lightning-input>
          <lightning-input
            label="CC"
            value={emailCc}
            disabled
          ></lightning-input>
          <lightning-input
            label="Subject"
            name="emailSubject"
            value={emailSubject}
            onchange={handleEmailFieldChange}
          ></lightning-input>
          <lightning-input-rich-text
            label="Body"
            name="emailBody"
            value={emailBody}
            onchange={handleEmailFieldChange}
          ></lightning-input-rich-text>
        </div>
        <footer class="modal-actions modal-actions_footer">
          <button
            type="button"
            class="btn btn-secondary"
            onclick={handleCloseEmailModal}
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-primary"
            onclick={handleSendEmail}
            disabled={isSendDisabled}
          >
            {sendButtonLabel}
          </button>
        </footer>
      </div>
    </section>
  </template>

  <template lwc:if={slipDetails}>
    <article class="printable-view">
      <header class="print-header">
        <p>The Lodestone Group</p>
        <h1>Salary slip</h1>
        <span>{formattedPeriod}</span>
      </header>
      <section class="print-employee">
        <div><span>Employee</span><strong>{employeeName}</strong></div>
        <div><span>Employee ID</span><strong>{employeeCode}</strong></div>
      </section>
      <table>
        <thead>
          <tr>
            <th>Description</th>
            <th>Type</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <template for:each={slipDetails.earnings} for:item="earning">
            <tr key={earning.name}>
              <td>{earning.name}</td>
              <td>Earning</td>
              <td>
                <lightning-formatted-number
                  value={earning.amount}
                  format-style="currency"
                  currency-code={currencyCode}
                ></lightning-formatted-number>
              </td>
            </tr>
          </template>
          <template for:each={slipDetails.deductions} for:item="deduction">
            <tr key={deduction.name}>
              <td>{deduction.name}</td>
              <td>Deduction</td>
              <td>
                <lightning-formatted-number
                  value={deduction.amount}
                  format-style="currency"
                  currency-code={currencyCode}
                ></lightning-formatted-number>
              </td>
            </tr>
          </template>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2">Net pay</td>
            <td>
              <lightning-formatted-number
                value={slipDetails.salarySlip.Net_Pay__c}
                format-style="currency"
                currency-code={currencyCode}
              ></lightning-formatted-number>
            </td>
          </tr>
        </tfoot>
      </table>
      <p class="print-generated">
        Generated on
        <lightning-formatted-date-time
          value={today}
          year="numeric"
          month="long"
          day="numeric"
        ></lightning-formatted-date-time>
      </p>
    </article>
  </template>
</template>
