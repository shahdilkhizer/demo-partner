<template>
  <div class="mb-4">
    <lightning-button
      label={panelButtonLabel}
      variant="brand"
      onclick={handleTogglePanel}
      class="fixed bottom-5 right-5 z-[1000]"
    >
    </lightning-button>
  </div>

  <template if:true={showPanel}>
    <div
      class="debug-panel fixed bottom-20 right-5 w-[600px] max-h-[80vh] overflow-y-auto z-[999] bg-white rounded-2xl shadow-2xl border-2 border-red-500"
    >
      <!-- Header -->
      <div
        class="flex items-center justify-between px-5 py-4 border-b border-gray-200 bg-gradient-to-r from-orange-500 to-red-500 rounded-t-2xl"
      >
        <h2 class="text-lg font-semibold text-white">🔧 Debug Panel</h2>
        <lightning-button-icon
          icon-name="utility:close"
          onclick={handleTogglePanel}
          alternative-text="Close"
          class="text-white"
        ></lightning-button-icon>
      </div>

      <div class="p-5 space-y-4">
        <template if:true={isLoading}>
          <div class="flex justify-center items-center p-8">
            <div
              class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-500"
            ></div>
          </div>
        </template>

        <!-- System Info Section -->
        <div class="bg-yellow-50 rounded-xl p-4 border border-yellow-200">
          <h3 class="text-sm font-semibold text-yellow-800 mb-3">
            📊 System Info
          </h3>
          <lightning-button
            label="Load Debug Info"
            onclick={handleLoadDebugInfo}
            variant="brand"
            size="small"
            class="mr-2"
          ></lightning-button>
          <template if:true={debugInfo}>
            <div class="mt-3">
              <pre
                class="bg-white p-3 rounded-lg overflow-x-auto text-xs border border-yellow-100"
              >
{debugInfoJson}</pre
              >
            </div>
          </template>
        </div>

        <!-- OTP Test Section -->
        <div class="bg-blue-50 rounded-xl p-4 border border-blue-200">
          <h3 class="text-sm font-semibold text-blue-800 mb-3">📧 OTP Test</h3>
          <div class="mb-3">
            <lightning-input
              type="email"
              label="Test Email"
              value={testEmail}
              placeholder="Enter email to test OTP"
              onchange={handleEmailChange}
            >
            </lightning-input>
          </div>
          <lightning-button
            label="Send Test OTP"
            onclick={handleTestOTP}
            variant="brand"
            size="small"
          ></lightning-button>
        </div>

        <!-- Feature Assignment Test -->
        <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-200">
          <h3 class="text-sm font-semibold text-indigo-800 mb-3">
            🔐 Feature Assignment Test
          </h3>

          <div class="mb-3">
            <lightning-button
              label="Load Test Users"
              onclick={handleLoadTestUsers}
              variant="neutral"
              size="small"
            ></lightning-button>
          </div>

          <div class="mb-3">
            <lightning-combobox
              label="Select User"
              value={selectedUserId}
              options={userOptions}
              onchange={handleUserChange}
              placeholder="Choose a user"
            >
            </lightning-combobox>
          </div>

          <div class="mb-3">
            <lightning-combobox
              label="Select Feature"
              value={selectedFeature}
              options={featureOptions}
              onchange={handleFeatureChange}
              placeholder="Choose a feature"
            >
            </lightning-combobox>
          </div>

          <lightning-button
            label="Assign Feature"
            onclick={handleTestFeatureAssignment}
            variant="brand"
            size="small"
          ></lightning-button>
        </div>

        <!-- Debug Logs Section -->
        <div class="bg-gray-100 rounded-xl p-4 border border-gray-200">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-gray-800">📝 Debug Logs</h3>
            <div class="flex gap-2">
              <lightning-button
                label="Clear"
                onclick={handleClearLogs}
                variant="neutral"
                size="small"
              ></lightning-button>
              <lightning-button
                label="Download"
                onclick={handleDownloadLogs}
                variant="neutral"
                size="small"
              ></lightning-button>
            </div>
          </div>
          <div
            class="bg-gray-900 text-green-400 p-3 rounded-lg font-mono text-xs max-h-[300px] overflow-y-auto"
          >
            <template for:each={debugLogs} for:item="log">
              <div key={log} class="whitespace-pre-wrap break-words mb-1">
                {log}
              </div>
            </template>
            <template if:false={debugLogs}>
              <div class="text-gray-500">No logs yet...</div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
