<template>
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1">{pageTitle}</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item">{breadcrumbParent}</li>
              <li class="breadcrumb-item active">{breadcrumbActive}</li>
            </ol>
          </nav>
        </div>
      </div>

      <section class="card border-0 mb-4">
        <div class="card-header border border-bottom-0 text-center">
          <h3 class="mb-2">{basicInfoTitle}</h3>
        </div>
        <div class="card-body border">
          <div class="row">
            <template for:each={basicInfoFields} for:item="field">
              <div key={field.label} class="col-md-4 mb-3">
                <label class="form-label">{field.label}</label>
                <input
                  type="text"
                  class="form-control"
                  name={field.name}
                  value={field.value}
                />
              </div>
            </template>
          </div>
        </div>
      </section>

      <section class="card border-0 mb-4">
        <div class="card-header border border-bottom-0 text-center">
          <h3 class="mb-2">{profExcellenceTitle}</h3>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered mb-0">
            <thead>
              <tr class="bg-light">
                <th>#</th>
                <th>KRA</th>
                <th>KPI</th>
                <th>Weightage</th>
                <th>Self Score</th>
                <th>Self Points</th>
                <th>RO Score</th>
                <th>RO Points</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={profExcellenceRows} for:item="row">
                <tr key={row.id}>
                  <td>{row.id}</td>
                  <template lwc:if={row.isParent}>
                    <td rowspan={row.rowSpan}>{row.kra}</td>
                  </template>
                  <td>{row.kpi}</td>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      value={row.weight}
                      readonly
                    />
                  </td>
                  <td><input type="text" class="form-control" /></td>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      value="0"
                      readonly
                    />
                  </td>
                  <td><input type="text" class="form-control" /></td>
                  <td>
                    <input
                      type="text"
                      class="form-control"
                      value="0"
                      readonly
                    />
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card border-0 mb-4">
        <div class="card-header border border-bottom-0 text-center">
          <h3 class="mb-2">{achievementsTitle}</h3>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered mb-0">
            <thead>
              <tr class="bg-light">
                <th style="width: 50px">#</th>
                <th>By Self</th>
                <th>RO's Comment</th>
                <th>HOD's Comment</th>
                <th style="width: 50px">
                  <button
                    class="btn btn-primary btn-sm"
                    data-id="achievements"
                    onclick={handleAddRow}
                  >
                    <i class="ti ti-plus"></i>
                  </button>
                </th>
              </tr>
            </thead>
            <tbody>
              <template
                for:each={achievementRows}
                for:item="row"
                for:index="index"
              >
                <tr key={row.id}>
                  <td>{row.id}</td>
                  <td>
                    <input type="text" class="form-control" value={row.self} />
                  </td>
                  <td>
                    <input type="text" class="form-control" value={row.ro} />
                  </td>
                  <td>
                    <input type="text" class="form-control" value={row.hod} />
                  </td>
                  <td></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card border-0 mb-4">
        <div class="table-responsive">
          <table class="table table-bordered mb-0">
            <thead class="bg-light">
              <tr>
                <th>Role</th>
                <th>Name</th>
                <th>Signature</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={signatureRows} for:item="sig">
                <tr key={sig.role}>
                  <td class="fw-bold">{sig.role}</td>
                  <td>
                    <input type="text" class="form-control" value={sig.name} />
                  </td>
                  <td>
                    <input type="text" class="form-control" value={sig.sig} />
                  </td>
                  <td>
                    <input type="text" class="form-control" value={sig.date} />
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</template>
