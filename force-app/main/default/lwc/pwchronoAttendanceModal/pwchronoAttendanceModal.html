<template>
  <template if:true={isOpen}>
    <dialog
      class="modal fade show attendance-modal"
      open
      aria-modal="true"
      aria-labelledby="attendance-modal-title"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="attendance-modal-title">
              {modalTitle}
            </h4>
            <button
              type="button"
              class="btn-close custom-btn-close"
              onclick={closeModal}
              aria-label="Close"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <div class="modal-body pb-0">
            <div class="row">
              <div class="col-md-12">
                <div class="mb-3">
                  <label class="form-label" for="attendance-employee"
                    >Employee <span class="text-danger">*</span></label
                  >
                  <select
                    id="attendance-employee"
                    class="form-select"
                    value={selectedEmployeeId}
                    disabled={isEmployeeLocked}
                    required
                    onchange={handleEmployeeChange}
                  >
                    <option value="">Select employee</option>
                    <template for:each={employeeOptions} for:item="employee">
                      <option key={employee.value} value={employee.value}>
                        {employee.label}
                      </option>
                    </template>
                  </select>
                </div>
              </div>
              <div class="col-md-12">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Date
                    <div class="input-icon position-relative w-100 me-2 mt-1">
                      <input
                        type="date"
                        class="form-control ps-3"
                        value={attendanceDate}
                        required
                        onchange={handleDateChange}
                      />
                      <span class="input-icon-addon">
                        <i
                          class="fa-solid fa-calendar-days"
                          aria-hidden="true"
                        ></i>
                      </span>
                    </div>
                  </label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Check In
                    <div class="input-icon position-relative w-100 mt-1">
                      <input
                        type="time"
                        class="form-control ps-3"
                        value={fromTime}
                        required
                        onchange={handleFromTimeChange}
                      />
                      <span class="input-icon-addon">
                        <i class="fa-solid fa-clock" aria-hidden="true"></i>
                      </span>
                    </div>
                  </label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Check Out
                    <div class="input-icon position-relative w-100 mt-1">
                      <input
                        type="time"
                        class="form-control ps-3"
                        value={toTime}
                        required
                        onchange={handleToTimeChange}
                      />
                      <span class="input-icon-addon">
                        <i class="fa-solid fa-clock" aria-hidden="true"></i>
                      </span>
                    </div>
                  </label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Break (Mins)
                    <input
                      type="number"
                      class="form-control mt-1"
                      value="60"
                      disabled
                    />
                  </label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Overtime
                    <input
                      type="text"
                      class="form-control mt-1"
                      value="0h"
                      disabled
                    />
                  </label>
                </div>
              </div>
              <div class="col-md-12">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Production Hours
                    <div class="input-icon position-relative w-100 mt-1">
                      <input
                        type="text"
                        class="form-control ps-3"
                        value={productionHours}
                        disabled
                      />
                      <span class="input-icon-addon">
                        <i class="fa-solid fa-clock" aria-hidden="true"></i>
                      </span>
                    </div>
                  </label>
                </div>
              </div>
              <div class="col-md-12">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Request status
                    <select
                      class="form-select mt-1"
                      value={status}
                      required
                      onchange={handleStatusChange}
                    >
                      <option value="Draft" selected={isDraft}>Draft</option>
                      <option value="Submitted" selected={isSubmitted}>
                        Submitted
                      </option>
                      <option value="Approved" selected={isApproved}>
                        Approved
                      </option>
                      <option value="Rejected" selected={isRejected}>
                        Rejected
                      </option>
                      <option value="Cancelled" selected={isCancelled}>
                        Cancelled
                      </option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Adjustment type
                    <select
                      class="form-select mt-1"
                      value={correctionType}
                      required
                      onchange={handleCorrectionTypeChange}
                    >
                      <option value="Check-In Missing">Check-in missing</option>
                      <option value="Check-Out Missing">
                        Check-out missing
                      </option>
                      <option value="Both Missing">Both missing</option>
                      <option value="Wrong Time">Wrong time</option>
                      <option value="Incorrect">Incorrect</option>
                      <option value="Other">Other</option>
                    </select>
                  </label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label w-100"
                    >Reason
                    <textarea
                      class="form-control mt-1"
                      rows="2"
                      maxlength="1000"
                      value={reason}
                      required
                      onchange={handleReasonChange}
                    ></textarea>
                  </label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light me-2"
              onclick={closeModal}
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-primary"
              disabled={isSaving}
              onclick={handleSave}
            >
              {saveButtonLabel}
            </button>
          </div>
        </div>
      </div>
    </dialog>
    <div class="modal-backdrop fade show"></div>
  </template>
</template>
