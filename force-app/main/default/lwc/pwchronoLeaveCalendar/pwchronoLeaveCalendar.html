<template>
  <div class="card overflow-hidden">
    <div class="card-header bg-primary text-white">
      <h5 class="card-title mb-0">Leave Calendar</h5>
      <p class="mb-0 small opacity-75 mt-1">View scheduled leaves and holidays</p>
    </div>

    <div class="card-body">
      <template if:true={isLoading}>
        <div class="d-flex align-items-center justify-content-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <span class="ms-2 text-muted">Loading calendar...</span>
        </div>
      </template>

      <template if:false={isLoading}>
        <div class="d-flex align-items-center justify-content-between mb-4">
          <lightning-button-icon
            icon-name="utility:chevronleft"
            onclick={handlePrevMonth}
            alternative-text="Previous Month"
            variant="border-filled"
          ></lightning-button-icon>
          <h6 class="mb-0 fw-bold">{currentMonthName} {currentYear}</h6>
          <lightning-button-icon
            icon-name="utility:chevronright"
            onclick={handleNextMonth}
            alternative-text="Next Month"
            variant="border-filled"
          ></lightning-button-icon>
        </div>

        <template if:true={hasLeaveOrHolidays}>
          <div class="calendar-grid">
            <div class="calendar-header">Sun</div>
            <div class="calendar-header">Mon</div>
            <div class="calendar-header">Tue</div>
            <div class="calendar-header">Wed</div>
            <div class="calendar-header">Thu</div>
            <div class="calendar-header">Fri</div>
            <div class="calendar-header">Sat</div>

            <template for:each={calendarDays} for:item="day">
              <div key={day.id} class={day.cssClass}>
                <div class="day-number">{day.number}</div>
                <div class="day-events">
                  <template for:each={day.events} for:item="event">
                    <div key={event.id} class={event.cssClass} title={event.title}>
                      {event.title}
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

        <template if:false={hasLeaveOrHolidays}>
          <div class="text-center py-5">
            <i class="ti ti-calendar-off fs-1 text-muted d-block mb-2"></i>
            <p class="text-muted mb-0">No leave scheduled for this period.</p>
          </div>
        </template>
      </template>
    </div>
  </div>
</template>
