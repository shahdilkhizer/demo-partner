<template lwc:render-mode="light">
  <div class="page-wrapper">
    <div class="content container-fluid">

      <!-- Page Header -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">Holidays</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item">HRM</li>
              <li class="breadcrumb-item active">Holidays</li>
            </ol>
          </nav>
        </div>
      </div>

      <!-- Loading -->
      <template if:true={isLoading}>
        <div class="d-flex align-items-center justify-content-center p-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </template>

      <!-- Error -->
      <template if:true={loadError}>
        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">
          <i class="ti ti-alert-circle fs-5 flex-shrink-0"></i>
          <span>{loadError}</span>
        </div>
      </template>

      <!-- Holidays Table -->
      <template if:false={isLoading}>
        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h5 class="card-title mb-0">
              <i class="ti ti-calendar-event me-2 text-primary"></i>Holidays List
            </h5>
            <span class="badge bg-soft-primary text-primary">{totalCount} holidays</span>
          </div>
          <div class="card-body p-0">

            <template if:true={hasHolidays}>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Holiday</th>
                      <th>Date</th>
                      <th>Day</th>
                      <th>Type</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={holidays} for:item="holiday">
                      <tr key={holiday.Id}>
                        <td>
                          <div class="d-flex align-items-center gap-2">
                            <span class="avatar avatar-sm bg-soft-primary">
                              <i class="ti ti-calendar text-primary"></i>
                            </span>
                            <span class="fw-medium">{holiday.Name}</span>
                          </div>
                        </td>
                        <td>
                          <span class="text-muted">{holiday.formattedDate}</span>
                        </td>
                        <td>
                          <span class="badge bg-soft-secondary text-secondary">{holiday.dayName}</span>
                        </td>
                        <td>
                          <template if:true={holiday.Is_Weekly_Off__c}>
                            <span class="badge bg-soft-info text-info">
                              <i class="ti ti-point-filled me-1"></i>Weekly Off
                            </span>
                          </template>
                          <template if:false={holiday.Is_Weekly_Off__c}>
                            <span class="badge bg-soft-success text-success">
                              <i class="ti ti-point-filled me-1"></i>Public Holiday
                            </span>
                          </template>
                        </td>
                        <td class="text-muted small">{holiday.Description__c}</td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <template if:false={hasHolidays}>
              <div class="text-center py-5">
                <i class="ti ti-calendar-off fs-1 text-muted d-block mb-2"></i>
                <h6 class="text-muted mb-1">No upcoming holidays</h6>
                <p class="text-muted small mb-0">No holidays are scheduled at this time</p>
              </div>
            </template>

          </div>
        </div>
      </template>

    </div>
  </div>
</template>
