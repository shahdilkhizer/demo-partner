<template lwc:render-mode="light">
  <div class="page-wrapper" style="min-height: 732px">
    <div class="content container-fluid pwchrono-dashboard-content">
      <!-- Page Header -->
      <div
        class="d-md-flex d-block align-items-center justify-content-between mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1">{dashboardTitle}</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <span aria-label="Home"
                  ><i class="fa-solid fa-house" aria-hidden="true"></i
                ></span>
              </li>
              <li class="breadcrumb-item">Dashboard</li>
              <li class="breadcrumb-item active" aria-current="page">
                {dashboardTitle}
              </li>
            </ol>
          </nav>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button
            type="button"
            class="btn btn-white"
            onclick={loadDashboard}
            disabled={isLoading}
          >
            Refresh
          </button>
          <button type="button" class="btn btn-white" onclick={handlePrint}>
            Print / Save PDF
          </button>
        </div>
      </div>
      <!-- /Page Header -->

      <template if:true={isLoading}>
        <div class="d-flex justify-content-center p-5">
          <div class="spinner-border text-primary">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </template>

      <template if:true={errorMessage}>
        <div class="alert alert-danger" role="alert">
          Dashboard could not be loaded: {errorMessage}
          <button
            type="button"
            class="btn btn-white ms-2"
            onclick={loadDashboard}
          >
            Retry
          </button>
        </div>
      </template>
      <template if:true={hasData}>
        <!-- Welcome Wrap -->
        <div class="card border-0">
          <div
            class="card-body d-flex align-items-center justify-content-between flex-wrap pb-1"
          >
            <div class="d-flex align-items-center mb-3">
              <c-pwchrono-avatar
                container-class="avatar avatar-xl flex-shrink-0 avatar-rounded"
                image-url={currentUserAvatarUrl}
                name={currentUserName}
                alt-text={currentUserName}
                image-class="rounded-circle"
                title-class="initial-wrap"
                fallback-bg-class="bg-secondary"
              ></c-pwchrono-avatar>
              <div class="ms-3">
                <h3 class="mb-2">Welcome Back, {currentUserName}</h3>
                <p>
                  You have
                  <span class="text-primary text-decoration-underline"
                    >{upcomingShiftCount}</span
                  >
                  Upcoming Shifts &amp;
                  <span class="text-primary text-decoration-underline"
                    >{activeGoalsCount}</span
                  >
                  Active Goals
                </p>
              </div>
            </div>
          </div>
        </div>
        <!-- /Welcome Wrap -->

        <div class="row">
          <!-- Widget Info -->
          <div class="col-xl-8 d-flex">
            <div class="row flex-fill">
              <div class="col-sm-6 col-lg-3 d-flex">
                <div class="card flex-fill">
                  <div class="card-body">
                    <span class="avatar rounded-circle bg-primary mb-2">
                      <i class="fa-solid fa-calendar-days fs-16"></i>
                    </span>
                    <h6 class="fs-13 fw-medium text-default mb-1">
                      Upcoming Shifts
                    </h6>
                    <h3 class="mb-3">{upcomingShiftCount}</h3>
                    <button
                      class="link-default btn-link border-0 bg-transparent p-0"
                      onclick={navigateToShifts}
                    >
                      View Details
                    </button>
                  </div>
                </div>
              </div>
              <div class="col-sm-6 col-lg-3 d-flex">
                <div class="card flex-fill">
                  <div class="card-body">
                    <span class="avatar rounded-circle bg-secondary mb-2">
                      <i class="fa-solid fa-bullseye fs-16"></i>
                    </span>
                    <h6 class="fs-13 fw-medium text-default mb-1">
                      Active Goals
                    </h6>
                    <h3 class="mb-3">{activeGoalsCount}</h3>
                    <button
                      class="link-default btn-link border-0 bg-transparent p-0"
                      onclick={navigateToGoals}
                    >
                      View All
                    </button>
                  </div>
                </div>
              </div>
              <div class="col-sm-6 col-lg-3 d-flex">
                <div class="card flex-fill">
                  <div class="card-body">
                    <span class="avatar rounded-circle bg-info mb-2">
                      <i class="fa-solid fa-clipboard-check fs-16"></i>
                    </span>
                    <h6 class="fs-13 fw-medium text-default mb-1">
                      Pending Appraisals
                    </h6>
                    <h3 class="mb-3">{pendingAppraisalsCount}</h3>
                    <button
                      class="link-default btn-link border-0 bg-transparent p-0"
                      onclick={navigateToAppraisals}
                    >
                      View All
                    </button>
                  </div>
                </div>
              </div>
              <div class="col-sm-6 col-lg-3 d-flex">
                <div class="card flex-fill">
                  <div class="card-body">
                    <span class="avatar rounded-circle bg-pink mb-2">
                      <i class="fa-solid fa-list-check fs-16"></i>
                    </span>
                    <h6 class="fs-13 fw-medium text-default mb-1">
                      Pending Approvals
                    </h6>
                    <h3 class="mb-3">{pendingApprovalsCount}</h3>
                    <button
                      class="link-default btn-link border-0 bg-transparent p-0"
                      onclick={navigateToApprovals}
                    >
                      View All
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- /Widget Info -->

          <!-- Clock-In/Out -->
          <div class="col-xl-4 d-flex">
            <div class="card flex-fill">
              <div
                class="card-header pb-2 d-flex align-items-center justify-content-between flex-wrap"
              >
                <h5 class="mb-2">Today's Attendance</h5>
                <button
                  type="button"
                  class="btn btn-white btn-sm"
                  onclick={navigateToShifts}
                >
                  View attendance
                </button>
              </div>
              <div class="card-body">
                <div
                  class="d-flex align-items-center justify-content-between mb-3 p-2 border border-dashed br-5"
                >
                  <div class="d-flex align-items-center">
                    <div class="ms-2">
                      <h6 class="fs-14 fw-medium text-truncate">Check In</h6>
                      <p class="fs-13 text-secondary">
                        <template if:true={todayAttendance.checkIn}>
                          <lightning-formatted-time
                            value={todayAttendance.checkIn}
                          ></lightning-formatted-time>
                        </template>
                        <template if:false={todayAttendance.checkIn}
                          >--:--</template
                        >
                      </p>
                    </div>
                  </div>
                  <div class="d-flex align-items-center">
                    <i class="fa-solid fa-clock text-success fs-20"></i>
                  </div>
                </div>
                <div
                  class="d-flex align-items-center justify-content-between mb-0 p-2 border border-dashed br-5"
                >
                  <div class="d-flex align-items-center">
                    <div class="ms-2">
                      <h6 class="fs-14 fw-medium text-truncate">Check Out</h6>
                      <p class="fs-13 text-secondary">
                        <template if:true={todayAttendance.checkOut}>
                          <lightning-formatted-time
                            value={todayAttendance.checkOut}
                          ></lightning-formatted-time>
                        </template>
                        <template if:false={todayAttendance.checkOut}
                          >--:--</template
                        >
                      </p>
                    </div>
                  </div>
                  <div class="d-flex align-items-center">
                    <i class="fa-solid fa-clock text-secondary fs-20"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- /Clock-In/Out -->
        </div>

        <div class="row">
          <!-- Upcoming Shifts -->
          <div class="col-xl-8 d-flex">
            <div class="card flex-fill">
              <div
                class="card-header pb-2 d-flex align-items-center justify-content-between flex-wrap"
              >
                <h5 class="mb-2">Upcoming Shifts (Next 7 Days)</h5>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-nowrap mb-0">
                    <thead>
                      <tr>
                        <th>Shift Name</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Date</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template for:each={upcomingShifts} for:item="shift">
                        <tr key={shift.Id}>
                          <td>
                            <h6 class="fs-13 fw-medium text-default mb-0">
                              {shift.Shift_Type__r.Name}
                            </h6>
                          </td>
                          <td>
                            <lightning-formatted-time
                              value={shift.Shift_Type__r.Start_Time__c}
                            ></lightning-formatted-time>
                          </td>
                          <td>
                            <lightning-formatted-time
                              value={shift.Shift_Type__r.End_Time__c}
                            ></lightning-formatted-time>
                          </td>
                          <td>
                            <lightning-formatted-date-time
                              value={shift.From_Date__c}
                            ></lightning-formatted-date-time>
                          </td>
                        </tr>
                      </template>
                      <template if:false={hasUpcomingShifts}>
                        <tr>
                          <td colspan="4" class="text-center p-3">
                            No upcoming shifts.
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <!-- /Upcoming Shifts -->

          <!-- Leave Balance -->
          <div class="col-xl-4 d-flex">
            <div class="card flex-fill">
              <div
                class="card-header pb-2 d-flex align-items-center justify-content-between flex-wrap"
              >
                <h5 class="mb-2">Leave Balance</h5>
                <button
                  type="button"
                  class="btn btn-white btn-sm"
                  onclick={navigateToLeave}
                >
                  My leave
                </button>
              </div>
              <div class="card-body">
                <template if:false={hasLeaveBalance}
                  ><p class="text-muted mb-0">
                    No current leave allocation. Contact HR to confirm your
                    entitlement.
                  </p></template
                >
                <template for:each={leaveBalance} for:item="leave">
                  <div
                    key={leave.leaveType}
                    class="d-flex align-items-center justify-content-between mb-3 p-2 border br-5"
                  >
                    <div>
                      <h6 class="fs-14 fw-medium mb-1">{leave.leaveType}</h6>
                      <p class="fs-12 text-gray-9">
                        Allocated: {leave.allocated}
                      </p>
                    </div>
                    <div class="text-end">
                      <h5 class="mb-1">{leave.available}</h5>
                      <p class="fs-12 text-success">Available</p>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <!-- /Leave Balance -->
        </div>

        <div class="row">
          <!-- Recent Payslips -->
          <div class="col-xxl-12 d-flex">
            <div class="card flex-fill">
              <div
                class="card-header pb-2 d-flex align-items-center justify-content-between flex-wrap"
              >
                <h5 class="mb-2">Recent Salary Slips</h5>
                <button
                  type="button"
                  class="btn btn-white btn-sm"
                  onclick={navigateToPayroll}
                >
                  View payslips
                </button>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-nowrap mb-0">
                    <thead>
                      <tr>
                        <th>Payroll Period</th>
                        <th>Gross Pay</th>
                        <th>Total Deductions</th>
                        <th>Net Pay</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template for:each={recentSalarySlips} for:item="slip">
                        <tr key={slip.Id}>
                          <td>
                            <h6 class="fs-13 fw-medium text-default mb-0">
                              {slip.Payroll_Period__c}
                            </h6>
                          </td>
                          <td>
                            <lightning-formatted-number
                              value={slip.Gross_Pay__c}
                              format-style="currency"
                              currency-code="USD"
                            ></lightning-formatted-number>
                          </td>
                          <td>
                            <lightning-formatted-number
                              value={slip.Total_Deductions__c}
                              format-style="currency"
                              currency-code="USD"
                            ></lightning-formatted-number>
                          </td>
                          <td>
                            <lightning-formatted-number
                              value={slip.Net_Pay__c}
                              format-style="currency"
                              currency-code="USD"
                            ></lightning-formatted-number>
                          </td>
                          <td>
                            <span class="badge bg-success-transparent"
                              >{slip.Status__c}</span
                            >
                          </td>
                        </tr>
                      </template>
                      <template if:false={hasSalarySlips}>
                        <tr>
                          <td colspan="5" class="text-center p-3">
                            No recent salary slips found.
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
