<template>
  <div class="page-wrapper">
    <div class="content">
      <!-- Breadcrumb & Header -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">Tax Declarations</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item">Payroll</li>
              <li class="breadcrumb-item active" aria-current="page">Tax Declarations</li>
            </ol>
          </nav>
        </div>
        <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
          <div class="mb-2">
            <button class="btn btn-primary d-flex align-items-center" onclick={handleNew}>
              <i class="ti ti-circle-plus me-2"></i>New Declaration
            </button>
          </div>
        </div>
      </div>

      <!-- Feedback Alert Notice Banner -->
      <template lwc:if={feedback}>
        <div class={feedbackClass} role="alert">
          <div>
            <strong>{feedback.title}: </strong> {feedback.message}
          </div>
          <button type="button" class="btn-close ms-2" onclick={clearFeedback} aria-label="Close"></button>
        </div>
      </template>

      <!-- Main Content Card -->
      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3">
          <h5 class="mb-0">Tax Declaration List</h5>
          <div class="d-flex my-xl-auto right-content align-items-center flex-wrap gap-2">
            <div class="filter-item">
              <input
                type="text"
                class="form-control form-control-sm"
                placeholder="Search Fiscal Year..."
                value={yearFilter}
                oninput={handleYearFilter}
              />
            </div>
            <div class="filter-item">
              <select class="form-select form-select-sm" onchange={handleStatusFilter}>
                <template for:each={statusOptions} for:item="opt">
                  <option key={opt.value} value={opt.value}>{opt.label}</option>
                </template>
              </select>
            </div>
            <div class="filter-item">
              <select class="form-select form-select-sm" onchange={handlePageSizeChange}>
                <template for:each={pageSizeOptions} for:item="opt">
                  <option key={opt.value} value={opt.value}>{opt.label} / page</option>
                </template>
              </select>
            </div>
          </div>
        </div>

        <div class="card-body p-0">
          <template lwc:if={isLoading}>
            <div class="p-5 text-center">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="text-muted mt-2 mb-0">Loading declarations...</p>
            </div>
          </template>

          <template lwc:elseif={hasDeclarations}>
            <div class="table-responsive">
              <table class="table datatable dataTable no-footer mb-0">
                <thead class="thead-light">
                  <tr>
                    <th class="sorting" data-field="Fiscal_Year__c" onclick={handleSort}>
                      <span class="d-flex align-items-center cursor-pointer">
                        Fiscal Year
                        <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                      </span>
                    </th>
                    <th class="sorting" data-field="Status__c" onclick={handleSort}>
                      <span class="d-flex align-items-center cursor-pointer">
                        Status
                        <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                      </span>
                    </th>
                    <th class="sorting text-end" data-field="Total_Declared_Amount__c" onclick={handleSort}>
                      <span class="d-flex align-items-center justify-content-end cursor-pointer">
                        Total Declared
                        <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                      </span>
                    </th>
                    <th class="sorting" data-field="CreatedDate" onclick={handleSort}>
                      <span class="d-flex align-items-center cursor-pointer">
                        Created Date
                        <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                      </span>
                    </th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={declarations} for:item="row">
                    <tr key={row.Id}>
                      <td>
                        <div class="d-flex align-items-center">
                          <i class="ti ti-calendar text-primary me-2 fs-16"></i>
                          <span class="fw-semibold text-dark">{row.Fiscal_Year__c}</span>
                        </div>
                      </td>
                      <td>
                        <span class={row.statusBadgeClass}>
                          <i class="ti ti-point-filled me-1"></i>{row.Status__c}
                        </span>
                      </td>
                      <td class="text-end">
                        <span class="fw-bold text-dark fs-14">{row.formattedTotal}</span>
                      </td>
                      <td>
                        <span class="text-muted fs-13">{row.formattedDate}</span>
                      </td>
                      <td class="text-end">
                        <div class="action-btn-group d-inline-flex gap-1">
                          <button
                            type="button"
                            class="btn btn-sm btn-white border"
                            data-id={row.Id}
                            onclick={handleEditRow}
                            disabled={row.isLocked}
                            title="Edit Declaration"
                          >
                            <i class="ti ti-edit me-1 text-secondary"></i>Edit
                          </button>
                          <button
                            type="button"
                            class="btn btn-sm btn-light border"
                            data-id={row.Id}
                            onclick={handleViewRow}
                            title="View Declaration"
                          >
                            <i class="ti ti-eye me-1 text-primary"></i>View
                          </button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- Table Pagination Footer -->
            <div class="d-flex align-items-center justify-content-between p-3 border-top bg-light flex-wrap gap-2">
              <span class="text-muted fs-13">{paginationInfo}</span>
              <div class="d-flex align-items-center gap-1">
                <button
                  type="button"
                  class="btn btn-sm btn-white border"
                  onclick={handlePrevPage}
                  disabled={isPrevDisabled}
                  aria-label="Previous page"
                >
                  <i class="ti ti-chevron-left"></i>
                </button>
                <span class="px-2 text-muted fs-13">Page {currentPage} of {totalPages}</span>
                <button
                  type="button"
                  class="btn btn-sm btn-white border"
                  onclick={handleNextPage}
                  disabled={isNextDisabled}
                  aria-label="Next page"
                >
                  <i class="ti ti-chevron-right"></i>
                </button>
              </div>
            </div>
          </template>

          <template lwc:else>
            <div class="p-5 text-center">
              <div class="empty-icon-circle mx-auto mb-3">
                <i class="ti ti-file-description fs-32 text-muted"></i>
              </div>
              <h5 class="fw-bold mb-1">No declarations found</h5>
              <p class="text-muted fs-13 mb-3">You have not submitted any tax declarations matching your filters.</p>
              <button type="button" class="btn btn-primary btn-sm" onclick={handleNew}>
                <i class="ti ti-circle-plus me-1"></i>Create First Declaration
              </button>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Floating Modal Dialog -->
    <template lwc:if={isModalOpen}>
      <section class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="taxModalTitle">
        <div class="modal-backdrop" aria-label="Close dialog" onclick={closeModal}></div>
        <div class="modal-card" onclick={handleModalCardClick}>
          <!-- Modal Header -->
          <div class="modal-header">
            <h4 id="taxModalTitle" class="modal-title mb-0 fw-bold">{modalTitle}</h4>
            <button type="button" class="btn-close" aria-label="Close" onclick={closeModal}></button>
          </div>

          <!-- Modal Body -->
          <div class="modal-body p-4">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="modalFiscalYear" class="form-label fw-semibold fs-13 mb-1">
                  Fiscal Year <span class="text-danger">*</span>
                </label>
                <select
                  id="modalFiscalYear"
                  name="Fiscal_Year__c"
                  class="form-select"
                  onchange={handleFieldChange}
                  disabled={isReadOnly}
                >
                  <template for:each={fiscalYearOptions} for:item="yr">
                    <option key={yr.value} value={yr.value}>{yr.label}</option>
                  </template>
                </select>
              </div>
              <div class="col-md-6">
                <label for="modalStatus" class="form-label fw-semibold fs-13 mb-1">Status</label>
                <input
                  id="modalStatus"
                  type="text"
                  class="form-control bg-light"
                  value={currentRecord.Status__c}
                  disabled
                  readonly
                />
              </div>
            </div>

            <div class="section-divider mb-3 mt-4">
              <h6 class="fs-14 fw-bold text-dark mb-0 pb-2 border-bottom">
                <i class="ti ti-coins me-1 text-primary"></i> Deductions &amp; Exemptions
              </h6>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="modal80C" class="form-label fw-semibold fs-13 mb-1">Section 80C</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input
                    id="modal80C"
                    type="number"
                    step="0.01"
                    min="0"
                    name="Section_80C__c"
                    class="form-control"
                    placeholder="0.00"
                    value={currentRecord.Section_80C__c}
                    oninput={handleFieldChange}
                    disabled={isReadOnly}
                  />
                </div>
              </div>
              <div class="col-md-6">
                <label for="modalHRA" class="form-label fw-semibold fs-13 mb-1">HRA (Rent Paid)</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input
                    id="modalHRA"
                    type="number"
                    step="0.01"
                    min="0"
                    name="HRA__c"
                    class="form-control"
                    placeholder="0.00"
                    value={currentRecord.HRA__c}
                    oninput={handleFieldChange}
                    disabled={isReadOnly}
                  />
                </div>
              </div>
              <div class="col-md-6">
                <label for="modalMedIns" class="form-label fw-semibold fs-13 mb-1">Medical Insurance</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input
                    id="modalMedIns"
                    type="number"
                    step="0.01"
                    min="0"
                    name="Medical_Insurance__c"
                    class="form-control"
                    placeholder="0.00"
                    value={currentRecord.Medical_Insurance__c}
                    oninput={handleFieldChange}
                    disabled={isReadOnly}
                  />
                </div>
              </div>
              <div class="col-md-6">
                <label for="modalNPS" class="form-label fw-semibold fs-13 mb-1">NPS</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input
                    id="modalNPS"
                    type="number"
                    step="0.01"
                    min="0"
                    name="NPS__c"
                    class="form-control"
                    placeholder="0.00"
                    value={currentRecord.NPS__c}
                    oninput={handleFieldChange}
                    disabled={isReadOnly}
                  />
                </div>
              </div>
            </div>

            <!-- Total Declared Summary Box (Highlighted Card) -->
            <div class="total-summary-card p-3 rounded-3 d-flex align-items-center justify-content-between">
              <div class="d-flex align-items-center gap-2">
                <div class="summary-icon-box rounded-circle d-flex align-items-center justify-content-center">
                  <i class="ti ti-calculator fs-18 text-primary"></i>
                </div>
                <div>
                  <span class="fs-12 text-muted fw-medium d-block">Calculated Total</span>
                  <span class="fs-14 fw-bold text-dark">Total Declared Amount:</span>
                </div>
              </div>
              <div class="total-amount-display">
                <span class="fs-18 fw-bold text-primary">{formattedTotalDeclared}</span>
              </div>
            </div>
          </div>

          <!-- Modal Footer -->
          <div class="modal-footer d-flex align-items-center justify-content-end gap-2 p-3 bg-light">
            <button type="button" class="btn btn-light" onclick={closeModal}>
              Cancel
            </button>
            <template lwc:if={isEditable}>
              <button type="button" class="btn btn-outline-primary" onclick={handleSave}>
                Save Draft
              </button>
              <button type="button" class="btn btn-primary" onclick={handleSubmit}>
                Submit
              </button>
            </template>
          </div>
        </div>
      </section>
    </template>
  </div>
</template>
