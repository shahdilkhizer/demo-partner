<template>
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- Standard Header -->
      <div class="page-header d-flex align-items-center justify-content-between mb-4">
        <div>
          <h2 class="page-title mb-1">Tax Declarations</h2>
          <p class="page-subtitle text-muted mb-0">
            Manage your tax declarations and investments
          </p>
        </div>
        <div>
          <button type="button" class="btn btn-primary" onclick={handleNew}>
            <lightning-icon icon-name="utility:add" size="x-small" class="me-1 text-white"></lightning-icon>
            New Declaration
          </button>
        </div>
      </div>

      <!-- Feedback Notice Banner -->
      <template lwc:if={feedback}>
        <div class={feedbackClass} role="status">
          <lightning-icon icon-name={feedbackIcon} size="x-small"></lightning-icon>
          <div>
            <strong>{feedback.title}</strong>
            <p>{feedback.message}</p>
          </div>
          <button type="button" class="icon-button" onclick={clearFeedback} aria-label="Dismiss">×</button>
        </div>
      </template>

      <!-- Filters Card -->
      <div class="card filter-card mb-4 border-0 shadow-sm">
        <div class="card-body p-3">
          <div class="row g-3 align-items-end">
            <div class="col-md-4 col-sm-6">
              <label for="yearFilter" class="form-label text-xs fw-semibold text-secondary mb-1">Fiscal Year</label>
              <input
                id="yearFilter"
                type="text"
                class="form-control form-control-sm"
                placeholder="e.g., 2026-2027"
                value={yearFilter}
                onkeyup={handleYearFilter}
              />
            </div>
            <div class="col-md-4 col-sm-6">
              <lightning-combobox
                label="Status"
                value={statusFilter}
                options={statusOptions}
                onchange={handleStatusFilter}
                placeholder="All Statuses"
                class="compact-combo"
              ></lightning-combobox>
            </div>
            <div class="col-md-2 col-sm-6">
              <lightning-combobox
                label="Per Page"
                value={pageSize}
                options={pageSizeOptions}
                onchange={handlePageSizeChange}
                class="compact-combo"
              ></lightning-combobox>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Datatable Card -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-0">
          <template lwc:if={isLoading}>
            <div class="loading-container p-5 text-center">
              <lightning-spinner alternative-text="Loading declarations" size="medium"></lightning-spinner>
              <p class="text-muted mt-2 mb-0">Loading declarations...</p>
            </div>
          </template>

          <template lwc:elseif={hasDeclarations}>
            <div class="table-responsive">
              <lightning-datatable
                key-field="Id"
                data={declarations}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column
              ></lightning-datatable>
            </div>

            <!-- Pagination Footer -->
            <div class="pagination-footer d-flex align-items-center justify-content-between p-3 border-top bg-light">
              <span class="text-sm text-secondary">{paginationInfo}</span>
              <div class="d-flex align-items-center gap-2">
                <lightning-button-icon
                  icon-name="utility:chevronleft"
                  alternative-text="Previous"
                  onclick={handlePrevPage}
                  disabled={isPrevDisabled}
                  variant="border-filled"
                  size="small"
                ></lightning-button-icon>
                <span class="text-sm text-secondary px-2">Page {currentPage} of {totalPages}</span>
                <lightning-button-icon
                  icon-name="utility:chevronright"
                  alternative-text="Next"
                  onclick={handleNextPage}
                  disabled={isNextDisabled}
                  variant="border-filled"
                  size="small"
                ></lightning-button-icon>
              </div>
            </div>
          </template>

          <template lwc:else>
            <div class="empty-state p-5 text-center">
              <div class="empty-state-icon mb-3">
                <lightning-icon icon-name="utility:file" size="large" class="text-muted"></lightning-icon>
              </div>
              <h5 class="fw-bold mb-1">No declarations found</h5>
              <p class="text-muted text-sm mb-0">No tax declarations available for the selected filters.</p>
            </div>
          </template>
        </div>
      </div>

      <!-- Floating Modal Dialog -->
      <template lwc:if={isModalOpen}>
        <section class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="taxDeclarationModalTitle">
          <div class="modal-backdrop" aria-label="Close dialog" onclick={closeModal}></div>
          <div class="modal-card" onclick={handleModalCardClick}>
            <!-- Modal Header -->
            <div class="modal-header">
              <h3 id="taxDeclarationModalTitle" class="modal-title">{modalTitle}</h3>
              <button type="button" class="icon-close-btn" aria-label="Close dialog" onclick={closeModal}>
                ×
              </button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <lightning-combobox
                    name="Fiscal_Year__c"
                    label="Fiscal Year"
                    value={currentRecord.Fiscal_Year__c}
                    options={fiscalYearOptions}
                    onchange={handleFieldChange}
                    required
                    disabled={isReadOnly}
                  ></lightning-combobox>
                </div>
                <div class="col-md-6">
                  <lightning-input
                    type="text"
                    label="Status"
                    value={currentRecord.Status__c}
                    disabled
                  ></lightning-input>
                </div>
              </div>

              <div class="section-divider mb-3">
                <h6 class="section-title">Deductions & Exemptions</h6>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <lightning-input
                    type="number"
                    name="Section_80C__c"
                    label="Section 80C"
                    value={currentRecord.Section_80C__c}
                    formatter="currency"
                    step="0.01"
                    onchange={handleFieldChange}
                    disabled={isReadOnly}
                  ></lightning-input>
                </div>
                <div class="col-md-6">
                  <lightning-input
                    type="number"
                    name="HRA__c"
                    label="HRA (Rent Paid)"
                    value={currentRecord.HRA__c}
                    formatter="currency"
                    step="0.01"
                    onchange={handleFieldChange}
                    disabled={isReadOnly}
                  ></lightning-input>
                </div>
                <div class="col-md-6">
                  <lightning-input
                    type="number"
                    name="Medical_Insurance__c"
                    label="Medical Insurance"
                    value={currentRecord.Medical_Insurance__c}
                    formatter="currency"
                    step="0.01"
                    onchange={handleFieldChange}
                    disabled={isReadOnly}
                  ></lightning-input>
                </div>
                <div class="col-md-6">
                  <lightning-input
                    type="number"
                    name="NPS__c"
                    label="NPS"
                    value={currentRecord.NPS__c}
                    formatter="currency"
                    step="0.01"
                    onchange={handleFieldChange}
                    disabled={isReadOnly}
                  ></lightning-input>
                </div>
              </div>

              <!-- Total Declared Summary Box -->
              <div class="total-summary-card p-3 rounded-3">
                <div class="d-flex align-items-center justify-content-between">
                  <span class="fw-semibold text-secondary">Total Declared Amount:</span>
                  <span class="fs-5 fw-bold text-primary">
                    <lightning-formatted-number
                      value={totalDeclared}
                      format-style="currency"
                      currency-code={currencyCode}
                    ></lightning-formatted-number>
                  </span>
                </div>
              </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer d-flex align-items-center justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" onclick={closeModal}>
                Cancel
              </button>
              <template lwc:if={isEditable}>
                <button type="button" class="btn btn-outline-primary" onclick={handleSave}>
                  Save Draft
                </button>
                <template lwc:if={currentRecord.Id}>
                  <button type="button" class="btn btn-success" onclick={handleSubmit}>
                    Submit
                  </button>
                </template>
              </template>
            </div>
          </div>
        </section>
      </template>
    </div>
  </div>
</template>
