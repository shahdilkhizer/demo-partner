<template>
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- PwChrono Standard Header -->
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1 text-2xl font-bold text-gray-900">
            Tax Declarations
          </h2>
          <p class="text-muted text-sm text-gray-500">
            Manage your tax declarations and investments
          </p>
        </div>
        <div class="d-flex my-xl-auto right-content">
          <lightning-button
            label="New Declaration"
            onclick={handleNew}
            variant="brand"
          ></lightning-button>
        </div>
      </div>

      <div class="p-0">
        <!-- Loading State -->
        <template if:true={isLoading}>
          <div class="bg-white border border-gray-200 rounded-xl p-8">
            <div class="flex flex-col items-center justify-center">
              <div
                class="w-12 h-12 border-4 border-amber-200 border-t-amber-600 rounded-full animate-spin mb-4"
              ></div>
              <p class="text-gray-500">Loading declarations...</p>
            </div>
          </div>
        </template>

        <template if:false={isLoading}>
          <!-- Filters -->
          <div class="bg-white border border-gray-200 rounded-xl p-4 mb-4">
            <div class="flex flex-wrap gap-4 items-end">
              <div class="flex-1 min-w-[150px]">
                <label
                  for="yearFilter"
                  class="block text-xs font-medium text-gray-600 mb-1"
                  >Fiscal Year</label
                >
                <input
                  id="yearFilter"
                  type="text"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
                  placeholder="e.g., 2024-2025"
                  value={yearFilter}
                  onkeyup={handleYearFilter}
                />
              </div>
              <div class="w-[160px]">
                <span class="block text-xs font-medium text-gray-600 mb-1"
                  >Status</span
                >
                <lightning-combobox
                  label="Status"
                  value={statusFilter}
                  options={statusOptions}
                  onchange={handleStatusFilter}
                  variant="label-hidden"
                  placeholder="Filter by status"
                >
                </lightning-combobox>
              </div>
              <div class="w-[100px]">
                <span class="block text-xs font-medium text-gray-600 mb-1"
                  >Per Page</span
                >
                <lightning-combobox
                  label="Per Page"
                  value={pageSize}
                  options={pageSizeOptions}
                  onchange={handlePageSizeChange}
                  variant="label-hidden"
                >
                </lightning-combobox>
              </div>
            </div>
          </div>

          <template if:true={hasDeclarations}>
            <div class="overflow-x-auto rounded-xl border border-gray-200">
              <lightning-datatable
                key-field="Id"
                data={declarations}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column
              ></lightning-datatable>
            </div>

            <!-- Pagination -->
            <div
              class="flex items-center justify-between mt-4 p-3 bg-gray-50 rounded-lg"
            >
              <span class="text-sm text-gray-600">{paginationInfo}</span>
              <div class="flex gap-2 items-center">
                <lightning-button-icon
                  icon-name="utility:chevronleft"
                  alternative-text="Previous"
                  onclick={handlePrevPage}
                  disabled={isPrevDisabled}
                  variant="border-filled"
                >
                </lightning-button-icon>
                <span class="px-3 py-1 text-sm text-gray-700"
                  >Page {currentPage} of {totalPages}</span
                >
                <lightning-button-icon
                  icon-name="utility:chevronright"
                  alternative-text="Next"
                  onclick={handleNextPage}
                  disabled={isNextDisabled}
                  variant="border-filled"
                >
                </lightning-button-icon>
              </div>
            </div>
          </template>

          <template if:true={hasNoDeclarations}>
            <div
              class="bg-white border border-gray-200 rounded-xl flex flex-col items-center justify-center py-12 text-center"
            >
              <div
                class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4"
              >
                <lightning-icon
                  icon-name="utility:file"
                  size="medium"
                  class="text-gray-400"
                ></lightning-icon>
              </div>
              <p class="text-gray-500">No declarations found.</p>
            </div>
          </template>
        </template>
      </div>

      <!-- Edit/New Modal -->
      <template if:true={isModalOpen}>
        <div
          class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
        >
          <div
            class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-modal-enter"
          >
            <!-- Modal Header -->
            <div
              class="flex items-center justify-between px-6 py-4 border-b border-gray-200 bg-gradient-to-r from-amber-500 to-amber-600 text-white"
            >
              <h2 class="text-lg font-bold">{modalTitle}</h2>
              <button
                class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 transition-colors"
                title="Close"
                onclick={closeModal}
              >
                <lightning-icon
                  icon-name="utility:close"
                  size="small"
                  class="text-white"
                ></lightning-icon>
              </button>
            </div>

            <!-- Modal Content -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <lightning-combobox
                    name="Fiscal_Year__c"
                    label="Fiscal Year"
                    value={currentRecord.Fiscal_Year__c}
                    options={fiscalYearOptions}
                    onchange={handleFieldChange}
                    required
                    disabled={isReadOnly}
                  ></lightning-combobox>
                </div>
                <div>
                  <lightning-input
                    type="text"
                    label="Status"
                    value={currentRecord.Status__c}
                    disabled
                  ></lightning-input>
                </div>
              </div>

              <div>
                <h3
                  class="text-base font-semibold text-gray-800 pb-2 border-b border-gray-200 mb-4"
                >
                  Deductions
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <lightning-input
                      type="number"
                      name="Section_80C__c"
                      label="Section 80C"
                      value={currentRecord.Section_80C__c}
                      formatter="currency"
                      step="0.01"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    ></lightning-input>
                  </div>
                  <div>
                    <lightning-input
                      type="number"
                      name="HRA__c"
                      label="HRA (Rent Paid)"
                      value={currentRecord.HRA__c}
                      formatter="currency"
                      step="0.01"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    ></lightning-input>
                  </div>
                  <div>
                    <lightning-input
                      type="number"
                      name="Medical_Insurance__c"
                      label="Medical Insurance"
                      value={currentRecord.Medical_Insurance__c}
                      formatter="currency"
                      step="0.01"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    ></lightning-input>
                  </div>
                  <div>
                    <lightning-input
                      type="number"
                      name="NPS__c"
                      label="NPS"
                      value={currentRecord.NPS__c}
                      formatter="currency"
                      step="0.01"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    ></lightning-input>
                  </div>
                </div>
              </div>

              <div class="bg-amber-50 rounded-xl p-4 border border-amber-200">
                <p class="text-lg font-semibold text-amber-800">
                  Total Declared:
                  <lightning-formatted-number
                    value={totalDeclared}
                    format-style="currency"
                    currency-code={currencyCode}
                  ></lightning-formatted-number>
                </p>
              </div>
            </div>

            <!-- Modal Footer -->
            <div
              class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50"
            >
              <lightning-button
                label="Cancel"
                onclick={closeModal}
              ></lightning-button>
              <template if:false={isReadOnly}>
                <lightning-button
                  label="Save Draft"
                  variant="brand"
                  onclick={handleSave}
                ></lightning-button>
                <lightning-button
                  label="Submit"
                  variant="success"
                  onclick={handleSubmit}
                  if:true={currentRecord.Id}
                ></lightning-button>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
