<template lwc:render-mode="light">
  <div class="page-wrapper">
    <div class="content container-fluid dashboard-content">
      <div class="dashboard-heading">
        <div>
          <h2>Admin Dashboard</h2>
          <p class="text-muted mb-0">Dashboard / Administration</p>
        </div>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn btn-white"
            onclick={loadDashboard}
            disabled={isLoading}
          >
            Refresh</button
          ><button type="button" class="btn btn-white" onclick={handlePrint}>
            Print / Save PDF
          </button>
        </div>
      </div>
      <section class="card welcome-card">
        <div class="card-body dashboard-heading mb-0">
          <div class="d-flex align-items-center gap-3">
            <c-pwchrono-avatar
              name={userName}
              image-url={avatarUrl}
              container-class="avatar avatar-xl avatar-rounded"
              alt-text={userName}
            ></c-pwchrono-avatar>
            <div>
              <h3>Welcome back, {userName}</h3>
              <p class="mb-0 text-muted">
                Your workforce, requests and projects at a glance.
              </p>
            </div>
          </div>
          <button
            type="button"
            class="btn btn-primary"
            data-route="Approvals__c"
            onclick={navigate}
          >
            Review approvals
          </button>
        </div>
      </section>
      <template if:true={isLoading}
        ><div class="card card-body" role="status">
          Loading dashboard…
        </div></template
      >
      <template if:true={hasErrors}
        ><div class="alert alert-danger" role="alert">
          <p>Some dashboard sections could not be loaded.</p>
          <template for:each={errors} for:item="error"
            ><p key={error.id}>{error.message}</p></template
          ><button type="button" class="btn btn-white" onclick={loadDashboard}>
            Retry
          </button>
        </div></template
      >
      <template if:false={isLoading}>
        <div class="metric-grid">
          <template for:each={cards} for:item="card"
            ><section key={card.label} class="card">
              <div class="card-body">
                <span class={card.iconClass}
                  ><i class={card.icon} aria-hidden="true"></i
                ></span>
                <h6>{card.label}</h6>
                <h3>{card.value}</h3>
                <button
                  type="button"
                  class="btn btn-link p-0"
                  data-route={card.route}
                  onclick={navigate}
                >
                  View details<span class="visually-hidden">
                    for {card.label}</span
                  >
                </button>
              </div>
            </section></template
          >
        </div>
        <div class="dashboard-grid">
          <section class="card">
            <div class="card-header dashboard-heading">
              <h5>Employees by department</h5>
              <span class="text-muted">Active · Top 10</span>
            </div>
            <div class="card-body">
              <template for:each={departmentRows} for:item="department"
                ><div key={department.label} class="department-row">
                  <div class="d-flex justify-content-between gap-2">
                    <span>{department.label}</span
                    ><strong>{department.value}</strong>
                  </div>
                  <div class="bar-track">
                    <div class="bar-fill" style={department.barStyle}></div>
                  </div></div
              ></template>
              <template if:false={hasDepartments}
                ><p class="text-muted">
                  No department data to display.
                </p></template
              >
              <button
                type="button"
                class="btn btn-light w-100"
                data-route="EmployeeDirectory__c"
                onclick={navigate}
              >
                View employees
              </button>
            </div>
          </section>
          <section class="card">
            <div class="card-header">
              <h5>Attendance request status</h5>
              <template if:true={attendance}
                ><p class="text-muted mb-0">
                  Recorded date:
                  <lightning-formatted-date-time
                    value={attendance.day}
                    year="numeric"
                    month="short"
                    day="2-digit"
                    time-zone="UTC"
                  ></lightning-formatted-date-time></p
              ></template>
            </div>
            <div class="card-body">
              <p class="text-muted">
                Requests by approval status. If today has no requests, the most
                recent recorded day is shown.
              </p>
              <template for:each={attendanceRows} for:item="item"
                ><div key={item.label} class="status-row">
                  <span>{item.label}</span><strong>{item.value}</strong>
                </div></template
              >
              <button
                type="button"
                class="btn btn-light w-100 mt-3"
                data-route="Attendance_Admin__c"
                onclick={navigate}
              >
                View attendance
              </button>
            </div>
          </section>
          <section class="card">
            <div class="card-header dashboard-heading">
              <h5>Recent projects</h5>
              <button
                type="button"
                class="btn btn-white btn-sm"
                data-route="project_list__c"
                onclick={navigate}
              >
                View all
              </button>
            </div>
            <div class="table-responsive">
              <table class="table mb-0">
                <thead>
                  <tr>
                    <th scope="col">Project</th>
                    <th scope="col">Status</th>
                    <th scope="col">Deadline</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={projectRows} for:item="project"
                    ><tr key={project.Id}>
                      <td>{project.Name}</td>
                      <td>{project.Status__c}</td>
                      <td>
                        <lightning-formatted-date-time
                          value={project.End_Date__c}
                          time-zone="UTC"
                        ></lightning-formatted-date-time>
                      </td></tr
                  ></template>
                </tbody>
              </table>
            </div>
            <template if:false={hasProjects}
              ><p class="p-3 text-muted">No projects to display.</p></template
            >
          </section>
          <section class="card">
            <div class="card-header dashboard-heading">
              <h5>Recent applicants</h5>
              <button
                type="button"
                class="btn btn-white btn-sm"
                data-route="Recruitment__c"
                onclick={navigate}
              >
                View recruitment
              </button>
            </div>
            <div class="card-body">
              <template for:each={applicantRows} for:item="applicant"
                ><div key={applicant.Id} class="status-row">
                  <span>{applicant.Name}</span
                  ><span>{applicant.Status__c}</span>
                </div></template
              ><template if:false={hasApplicants}
                ><p class="text-muted">No applicants to display.</p></template
              >
            </div>
          </section>
        </div>
        <p class="text-muted small">
          Loaded: {updatedAt}. Organization summaries may include requests
          assigned to other approvers; the approval queue shows requests
          assigned to you.
        </p>
      </template>
    </div>
  </div>
</template>
