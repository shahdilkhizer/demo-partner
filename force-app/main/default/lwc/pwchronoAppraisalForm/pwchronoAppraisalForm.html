<template lwc:render-mode="light">
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- Breadcrumb -->
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1">My Appraisals</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"
                  ><i class="ti ti-smart-home"></i
                ></a>
              </li>
              <li class="breadcrumb-item">Performance</li>
              <li class="breadcrumb-item active" aria-current="page">
                My Appraisals
              </li>
            </ol>
          </nav>
        </div>
        <div
          class="d-flex my-xl-auto right-content align-items-center flex-wrap gap-2"
        >
          <button
            type="button"
            class="btn btn-primary d-flex align-items-center"
            onclick={handleNewAppraisal}
          >
            <i class="ti ti-circle-plus me-2" aria-hidden="true"></i>New
            Appraisal
          </button>
        </div>
      </div>
      <!-- /Breadcrumb -->

      <!-- Main Card -->
      <div class="card">
        <div
          class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3"
        >
          <h5 class="card-title mb-0">Appraisals</h5>
          <div class="d-flex align-items-center flex-wrap gap-2">
            <!-- Search Filter -->
            <div class="input-group" style="width: 220px">
              <span class="input-group-text bg-white"
                ><i class="ti ti-search text-muted"></i
              ></span>
              <input
                type="text"
                class="form-control ps-1"
                placeholder="Search by period..."
                value={searchFilter}
                oninput={handleSearchFilter}
              />
            </div>

            <!-- Status Filter -->
            <select
              class="form-select"
              style="width: 160px"
              onchange={handleStatusFilterChange}
            >
              <option value="">All Statuses</option>
              <option value="Draft">Draft</option>
              <option value="Submitted">Submitted</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>

            <!-- Per Page -->
            <select
              class="form-select"
              style="width: 110px"
              onchange={handlePageSizeChange}
            >
              <option value="10">10 / page</option>
              <option value="5">5 / page</option>
              <option value="25">25 / page</option>
            </select>
          </div>
        </div>

        <div class="card-body p-0">
          <template if:true={isLoading}>
            <div class="d-flex justify-content-center align-items-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </template>

          <template if:false={isLoading}>
            <template if:true={hasAppraisals}>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Period</th>
                      <th>Start Date</th>
                      <th>End Date</th>
                      <th>Status</th>
                      <th>Self Rating</th>
                      <th>Manager Rating</th>
                      <th class="text-end">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={formattedAppraisals} for:item="item">
                      <tr key={item.Id}>
                        <td class="fw-semibold text-dark">
                          {item.Appraisal_Period__c}
                        </td>
                        <td class="text-muted">{item.formattedStartDate}</td>
                        <td class="text-muted">{item.formattedEndDate}</td>
                        <td>
                          <span class={item.statusBadgeClass}
                            >{item.Status__c}</span
                          >
                        </td>
                        <td>
                          <span
                            class="badge bg-light text-dark border px-2 py-1"
                          >
                            <i class="ti ti-star-filled text-warning me-1"></i
                            >{item.selfRatingText}
                          </span>
                        </td>
                        <td>
                          <span
                            class="badge bg-light text-dark border px-2 py-1"
                          >
                            <i class="ti ti-star-filled text-warning me-1"></i
                            >{item.managerRatingText}
                          </span>
                        </td>
                        <td class="text-end">
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-primary"
                            data-id={item.Id}
                            onclick={handleViewEditRow}
                          >
                            <i class="ti ti-edit me-1"></i>View/Edit
                          </button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- Pagination -->
              <div
                class="d-flex align-items-center justify-content-between p-3 border-top bg-white"
              >
                <span class="text-muted small">Showing {paginationInfo}</span>
                <div class="btn-group btn-group-sm">
                  <button
                    type="button"
                    class="btn btn-outline-light text-dark border"
                    onclick={handlePrevPage}
                    disabled={isPrevDisabled}
                  >
                    <i class="ti ti-chevron-left"></i> Previous
                  </button>
                  <button
                    type="button"
                    class="btn btn-primary disabled"
                    style="cursor: default"
                  >
                    Page {currentPage} of {totalPages}
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-light text-dark border"
                    onclick={handleNextPage}
                    disabled={isNextDisabled}
                  >
                    Next <i class="ti ti-chevron-right"></i>
                  </button>
                </div>
              </div>
            </template>

            <template if:true={hasNoAppraisals}>
              <div class="text-center py-5">
                <div
                  class="avatar avatar-xl bg-light rounded-circle text-muted mx-auto mb-3 d-flex align-items-center justify-content-center"
                  style="width: 54px; height: 54px"
                >
                  <i class="ti ti-file-analytics fs-2"></i>
                </div>
                <h6 class="fw-semibold">No Appraisals Found</h6>
                <p class="text-muted small mb-3">
                  Click "New Appraisal" above to create your review.
                </p>
                <button
                  type="button"
                  class="btn btn-sm btn-primary"
                  onclick={handleNewAppraisal}
                >
                  <i class="ti ti-plus me-1"></i>New Appraisal
                </button>
              </div>
            </template>
          </template>
        </div>
      </div>

      <!-- Appraisal Modal -->
      <template if:true={showModal}>
        <div
          class="modal fade show d-block"
          role="dialog"
          tabindex="-1"
          style="display: block"
        >
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow border-0">
              <div class="modal-header">
                <h5 class="modal-title fw-bold">{modalTitle}</h5>
                <button
                  type="button"
                  class="btn-close"
                  onclick={closeModal}
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body p-4">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="modal-period"
                      >Appraisal Period <span class="text-danger">*</span></label
                    >
                    <input
                      type="text"
                      id="modal-period"
                      class="form-control"
                      value={currentAppraisal.Appraisal_Period__c}
                      data-field="Appraisal_Period__c"
                      oninput={handleFieldChange}
                      disabled={isReadOnly}
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <input
                      type="text"
                      class="form-control bg-light"
                      value={currentAppraisal.Status__c}
                      disabled
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="modal-start-date"
                      >Start Date</label
                    >
                    <input
                      type="date"
                      id="modal-start-date"
                      class="form-control"
                      value={currentAppraisal.Start_Date__c}
                      data-field="Start_Date__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="modal-end-date"
                      >End Date</label
                    >
                    <input
                      type="date"
                      id="modal-end-date"
                      class="form-control"
                      value={currentAppraisal.End_Date__c}
                      data-field="End_Date__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>

                  <!-- Self Assessment -->
                  <div class="col-12 mt-4">
                    <h6 class="fw-bold border-bottom pb-2">Self Assessment</h6>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label" for="modal-self-rating"
                      >Self Rating (1 to 5)</label
                    >
                    <select
                      id="modal-self-rating"
                      class="form-select"
                      data-field="Self_Rating__c"
                      value={currentAppraisal.Self_Rating__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="1">1 - Needs Improvement</option>
                      <option value="2">2 - Developing</option>
                      <option value="3">3 - Meets Expectations</option>
                      <option value="4">4 - Exceeds Expectations</option>
                      <option value="5">5 - Outstanding</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label" for="modal-achievements"
                      >Achievements & Goals Met
                      <span class="text-danger">*</span></label
                    >
                    <textarea
                      id="modal-achievements"
                      class="form-control"
                      rows="4"
                      data-field="Achievements__c"
                      oninput={handleFieldChange}
                      disabled={isReadOnly}
                      required
                    >{currentAppraisal.Achievements__c}</textarea>
                  </div>

                  <!-- Manager Feedback (if exists) -->
                  <template if:true={currentAppraisal.Feedback__c}>
                    <div class="col-12 mt-4">
                      <h6 class="fw-bold border-bottom pb-2">
                        Manager Feedback
                      </h6>
                      <div class="bg-light rounded p-3 mt-2">
                        <div class="mb-2">
                          <span class="text-muted small"
                            >Overall Rating:
                          </span>
                          <strong class="text-dark"
                            >{currentAppraisal.Overall_Rating__c} / 5</strong
                          >
                        </div>
                        <div>
                          <span class="text-muted small">Feedback: </span>
                          <p class="mb-0 text-dark">
                            {currentAppraisal.Feedback__c}
                          </p>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-light"
                  onclick={closeModal}
                >
                  Cancel
                </button>
                <template if:false={isReadOnly}>
                  <button
                    type="button"
                    class="btn btn-outline-primary"
                    onclick={handleSaveDraft}
                  >
                    Save Draft
                  </button>
                  <button
                    type="button"
                    class="btn btn-primary"
                    onclick={handleSubmit}
                  >
                    Submit
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-backdrop fade show"></div>
      </template>
    </div>
  </div>
</template>
