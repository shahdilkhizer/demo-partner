<template>
  <div class="card flex-fill">
    <div
      class="card-header pb-2 d-flex align-items-center justify-content-between flex-wrap"
    >
      <h5 class="mb-2">Employees</h5>
      <a
        href="javascript:void(0);"
        class="btn btn-light btn-md bg-white border fs-12 mb-2"
        >View All</a
      >
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-borderless table-nowrap mb-0">
          <tbody>
            <template for:each={employees} for:item="emp">
              <tr key={emp.id}>
                <td class="border-0">
                  <div class="d-flex align-items-center">
                    <a href="javascript:void(0);" class="d-inline-flex">
                      <c-pwchrono-avatar
                        container-class="avatar avatar-rounded"
                        image-url={emp.avatarUrl}
                        name={emp.name}
                        alt-text={emp.name}
                        image-class="img-fluid rounded-circle"
                        title-class="initial-wrap"
                        fallback-bg-class="bg-secondary"
                      ></c-pwchrono-avatar>
                    </a>
                    <div class="ms-2">
                      <h6 class="fw-medium">
                        <a href="javascript:void(0);">{emp.name}</a>
                      </h6>
                      <span class="fs-12">{emp.role}</span>
                    </div>
                  </div>
                </td>
                <td class="border-0">
                  <span class={emp.badgeClass}>{emp.department}</span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</template>
