<template>
  <div class="page-wrapper">
    <div class="content">
      <!-- Breadcrumbs & Header -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">Configuration Center</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item">Administration</li>
              <li class="breadcrumb-item active" aria-current="page">Configuration</li>
            </ol>
          </nav>
        </div>
      </div>

      <template if:true={isSaving}>
        <div class="d-flex justify-content-center align-items-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Saving...</span>
          </div>
        </div>
      </template>

      <template if:false={isSaving}>
        <!-- Nav Tabs Navigation -->
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body p-2">
            <ul class="nav nav-pills custom-nav-pills gap-1">
              <li class="nav-item">
                <button
                  class={usersTabClass}
                  onclick={handleTabChange}
                  data-tab="users"
                >
                  <i class="ti ti-users me-1"></i>User Management
                </button>
              </li>
              <li class="nav-item">
                <button
                  class={settingsTabClass}
                  onclick={handleTabChange}
                  data-tab="settings"
                >
                  <i class="ti ti-settings me-1"></i>Global Settings
                </button>
              </li>
              <li class="nav-item">
                <button
                  class={leaveTabClass}
                  onclick={handleTabChange}
                  data-tab="leave"
                >
                  <i class="ti ti-calendar me-1"></i>Leave Settings
                </button>
              </li>
              <li class="nav-item">
                <button
                  class={attendanceTabClass}
                  onclick={handleTabChange}
                  data-tab="attendance"
                >
                  <i class="ti ti-clock me-1"></i>Attendance Settings
                </button>
              </li>
            </ul>
          </div>
        </div>

        <!-- Tab 1: User Management -->
        <template if:true={isUserManagementTab}>
          <div class="card border-0 shadow-sm mb-4">
            <!-- Card Header: Title + Search + Page Size + New User Button -->
            <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2 py-3">
              <div class="d-flex align-items-center">
                <h5 class="card-title mb-0 fw-bold text-dark">
                  <i class="ti ti-users me-2 text-primary"></i>User Accounts
                </h5>
                <span class="badge bg-light text-secondary ms-2 fs-12">{totalRecords} Users</span>
              </div>
              <div class="d-flex align-items-center flex-wrap gap-2">
                <div class="search-input-wrap position-relative">
                  <i class="ti ti-search position-absolute top-50 start-0 translate-middle-y ms-2 text-muted fs-14"></i>
                  <input
                    type="search"
                    class="form-control form-control-sm ps-4"
                    placeholder="Search users..."
                    value={searchTerm}
                    oninput={handleUserSearch}
                  />
                </div>
                <div class="page-size-wrap">
                  <select class="form-select form-select-sm" onchange={handlePageSizeSelect}>
                    <option value="10">10 / page</option>
                    <option value="25">25 / page</option>
                    <option value="50">50 / page</option>
                  </select>
                </div>
                <button
                  type="button"
                  class="btn btn-primary btn-sm d-flex align-items-center"
                  onclick={handleNewUser}
                >
                  <i class="ti ti-plus me-1"></i>New User
                </button>
              </div>
            </div>

            <div class="card-body p-0">
              <template if:true={isLoading}>
                <div class="d-flex flex-column align-items-center justify-content-center py-5">
                  <div class="spinner-border text-primary mb-2" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  <p class="text-muted mb-0 fs-13">Loading users...</p>
                </div>
              </template>

              <template if:false={isLoading}>
                <template if:true={hasUsers}>
                  <div class="table-responsive">
                    <table class="table datatable dataTable no-footer mb-0">
                      <thead class="thead-light">
                        <tr>
                          <th class="sorting cursor-pointer" data-field="userName" onclick={handleSort}>
                            <span class="d-flex align-items-center">
                              Name
                              <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                            </span>
                          </th>
                          <th class="sorting cursor-pointer" data-field="userEmail" onclick={handleSort}>
                            <span class="d-flex align-items-center">
                              Email
                              <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                            </span>
                          </th>
                          <th class="sorting cursor-pointer" data-field="profileName" onclick={handleSort}>
                            <span class="d-flex align-items-center">
                              Portal User Profile
                              <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                            </span>
                          </th>
                          <th class="sorting cursor-pointer" data-field="roleName" onclick={handleSort}>
                            <span class="d-flex align-items-center">
                              Role
                              <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                            </span>
                          </th>
                          <th class="sorting cursor-pointer" data-field="managerName" onclick={handleSort}>
                            <span class="d-flex align-items-center">
                              Reports To
                              <i class="ti ti-arrows-sort ms-1 text-muted fs-12"></i>
                            </span>
                          </th>
                          <th class="text-end">Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={paginatedUsers} for:item="user">
                          <tr key={user.userId}>
                            <td>
                              <div class="d-flex align-items-center">
                                <div class="user-avatar-circle me-2 flex-shrink-0">
                                  {user.userInitials}
                                </div>
                                <div>
                                  <h6 class="fw-semibold mb-0 text-dark fs-13">{user.userName}</h6>
                                  <span class="text-muted fs-11">{user.designation}</span>
                                </div>
                              </div>
                            </td>
                            <td>
                              <span class="text-secondary fs-13 d-flex align-items-center">
                                <i class="ti ti-mail text-muted me-1 fs-12"></i>{user.userEmail}
                              </span>
                            </td>
                            <td>
                              <span class="badge bg-light text-primary border fs-12 fw-medium">
                                <i class="ti ti-shield-check me-1"></i>{user.profileName}
                              </span>
                            </td>
                            <td>
                              <span class={user.roleBadgeClass}>
                                {user.roleName}
                              </span>
                            </td>
                            <td>
                              <span class="text-muted fs-13">{user.managerName}</span>
                            </td>
                            <td class="text-end">
                              <div class="d-inline-flex gap-1">
                                <button
                                  type="button"
                                  class="btn btn-sm btn-white border"
                                  data-id={user.userId}
                                  onclick={handleManageAccessClick}
                                  title="Manage Access"
                                >
                                  <i class="ti ti-lock me-1 text-secondary"></i>Access
                                </button>
                                <button
                                  type="button"
                                  class="btn btn-sm btn-light border"
                                  data-id={user.userId}
                                  onclick={handleViewRecordClick}
                                  title="View User Record"
                                >
                                  <i class="ti ti-eye text-primary"></i>
                                </button>
                              </div>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>

                  <!-- Pagination Footer -->
                  <div class="d-flex align-items-center justify-content-between p-3 border-top bg-light flex-wrap gap-2">
                    <span class="text-muted fs-13">{paginationInfo}</span>
                    <div class="d-flex align-items-center gap-1">
                      <button
                        type="button"
                        class="btn btn-sm btn-white border"
                        onclick={handlePrevPage}
                        disabled={isPrevDisabled}
                        aria-label="Previous page"
                      >
                        <i class="ti ti-chevron-left"></i>
                      </button>
                      <span class="px-2 text-muted fs-13">Page {currentPage} of {totalPages}</span>
                      <button
                        type="button"
                        class="btn btn-sm btn-white border"
                        onclick={handleNextPage}
                        disabled={isNextDisabled}
                        aria-label="Next page"
                      >
                        <i class="ti ti-chevron-right"></i>
                      </button>
                    </div>
                  </div>
                </template>

                <template if:false={hasUsers}>
                  <div class="d-flex flex-column align-items-center justify-content-center py-5 text-center bg-light">
                    <div class="empty-icon-circle mb-3">
                      <i class="ti ti-users fs-28 text-muted"></i>
                    </div>
                    <h6 class="fw-bold mb-1">No users found</h6>
                    <p class="text-muted fs-13 mb-3">No user records matched your search query.</p>
                    <button type="button" class="btn btn-primary btn-sm" onclick={handleNewUser}>
                      <i class="ti ti-plus me-1"></i>Add New User
                    </button>
                  </div>
                </template>
              </template>
            </div>
          </div>
        </template>

        <!-- Tab 2: Global Settings -->
        <template if:true={isGlobalSettingsTab}>
          <div class="row g-4 mb-4">
            <div class="col-12 col-lg-6">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3">
                  <h6 class="card-title mb-0 fw-bold text-dark">
                    <i class="ti ti-apps me-2 text-primary"></i>Module Settings
                  </h6>
                </div>
                <div class="card-body d-flex flex-column gap-3 p-4">
                  <lightning-input
                    type="toggle"
                    label="Enable Payroll Module"
                    checked={globalSettings.Enable_Payroll_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Payroll_Module__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Enable Recruitment Module"
                    checked={globalSettings.Enable_Recruitment_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Recruitment_Module__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Enable Performance Module"
                    checked={globalSettings.Enable_Performance_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Performance_Module__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Enable Training Module"
                    checked={globalSettings.Enable_Training_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Training_Module__c"
                  ></lightning-input>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3">
                  <h6 class="card-title mb-0 fw-bold text-dark">
                    <i class="ti ti-settings me-2 text-primary"></i>System Settings
                  </h6>
                </div>
                <div class="card-body d-flex flex-column gap-3 p-4">
                  <lightning-input
                    type="toggle"
                    label="Enable Self Service Portal"
                    checked={globalSettings.Enable_Self_Service_Portal__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Self_Service_Portal__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Auto Approve Attendance"
                    checked={globalSettings.Auto_Approve_Attendance_Request__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Auto_Approve_Attendance_Request__c"
                  ></lightning-input>
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mb-4">
            <button
              type="button"
              class="btn btn-primary"
              onclick={handleSaveGlobalSettings}
            >
              <i class="ti ti-device-floppy me-1"></i>Save Global Settings
            </button>
          </div>
        </template>

        <!-- Tab 3: Leave Settings -->
        <template if:true={isLeaveTab}>
          <c-pwchrono-leave-settings></c-pwchrono-leave-settings>
        </template>

        <!-- Tab 4: Attendance Settings -->
        <template if:true={isAttendanceTab}>
          <c-pwchrono-attendance-settings></c-pwchrono-attendance-settings>
        </template>
      </template>
    </div>

    <!-- Modal: New User Form -->
    <template if:true={showNewUserModal}>
      <c-pwchrono-new-user-form
        caller-portal-user-id={employeeId}
        session-token={sessionToken}
        onclose={handleCloseNewUserModal}
        onusersaved={handleUserSaved}
      ></c-pwchrono-new-user-form>
    </template>

    <!-- Modal: Manage User Access (Assign Profile) -->
    <template if:true={showUserFeatureModal}>
      <section class="modal-layer" role="dialog" aria-modal="true" aria-label="Assign Profile">
        <div class="modal-backdrop" aria-label="Close dialog" onclick={closeModal}></div>
        <div class="modal-card" onclick={handleModalCardClick}>
          <div class="modal-header">
            <div>
              <h5 class="modal-title fw-bold mb-0">
                Assign Profile: {selectedUser.userName}
              </h5>
              <p class="text-muted small mb-0">
                Current profile: {selectedUser.profileName}
              </p>
            </div>
            <button type="button" class="btn-close" onclick={closeModal}></button>
          </div>

          <div class="modal-body p-4">
            <div class="alert alert-info mb-4" role="status">
              Access is inherited from the selected Portal User Profile. Object
              and field permissions are managed on the profile record.
            </div>
            <lightning-combobox
              name="portalProfile"
              label="Portal User Profile"
              value={selectedProfileId}
              options={profileOptions}
              onchange={handleProfileChange}
              dropdown-alignment="auto"
              required
            ></lightning-combobox>
            <lightning-combobox
              class="mt-3"
              name="reportingManager"
              label="Reports To"
              value={selectedManagerId}
              options={availableManagerOptions}
              onchange={handleManagerChange}
              dropdown-alignment="auto"
              field-level-help="This Portal User becomes the employee's manager for team views and approval routing. Leave blank only for top-level users."
            ></lightning-combobox>
          </div>

          <div class="modal-footer d-flex align-items-center justify-content-end gap-2 p-3 bg-light">
            <button type="button" class="btn btn-light" onclick={closeModal}>
              Cancel
            </button>
            <button type="button" class="btn btn-primary" onclick={handleSaveUserProfile}>
              Assign Profile
            </button>
          </div>
        </div>
      </section>
    </template>

    <!-- Modal: View User Record Details -->
    <template if:true={showViewRecordModal}>
      <section class="modal-layer" role="dialog" aria-modal="true" aria-label="User Record Details">
        <div class="modal-backdrop" aria-label="Close dialog" onclick={closeViewRecordModal}></div>
        <div class="modal-card modal-card-sm" onclick={handleModalCardClick}>
          <div class="modal-header bg-light border-bottom">
            <div class="d-flex align-items-center gap-2">
              <span class="user-avatar-circle bg-primary text-white">
                <i class="ti ti-user fs-16"></i>
              </span>
              <div>
                <h5 class="modal-title fw-bold mb-0">User Record Details</h5>
                <p class="text-muted small mb-0">{viewingUser.userName}</p>
              </div>
            </div>
            <button
              type="button"
              class="btn-close"
              onclick={closeViewRecordModal}
            ></button>
          </div>

          <div class="modal-body p-4">
            <div class="d-flex align-items-center justify-content-between p-3 bg-light rounded mb-3">
              <div>
                <h6 class="fw-bold mb-1">{viewingUser.userName}</h6>
                <p class="text-muted small mb-0">{viewingUser.userEmail}</p>
              </div>
              <span class={viewingUser.statusBadgeClass}>
                {viewingUser.statusText}
              </span>
            </div>

            <div class="row g-3">
              <div class="col-6">
                <span class="text-muted small d-block">Role</span>
                <strong class="text-dark fs-13">{viewingUser.roleName}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Designation</span>
                <strong class="text-dark fs-13">{viewingUser.designation}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Department</span>
                <strong class="text-dark fs-13">{viewingUser.department}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Portal User Profile</span>
                <strong class="text-primary fs-13">{viewingUser.profileName}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Reports To</span>
                <strong class="text-dark fs-13">{viewingUser.managerName}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Phone</span>
                <strong class="text-dark fs-13">{viewingUser.phone}</strong>
              </div>
            </div>
          </div>

          <div class="modal-footer bg-light border-top d-flex align-items-center justify-content-end gap-2 p-3">
            <button type="button" class="btn btn-light" onclick={closeViewRecordModal}>
              Close
            </button>
            <button type="button" class="btn btn-primary" onclick={handleManageAccessFromView}>
              <i class="ti ti-lock me-1"></i>Manage Access
            </button>
          </div>
        </div>
      </section>
    </template>
  </div>
</template>
