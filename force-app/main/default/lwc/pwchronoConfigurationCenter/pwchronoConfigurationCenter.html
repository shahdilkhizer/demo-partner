<template>
  <div class="page-wrapper">
    <h2 class="px-4 pt-4">Configuration Center</h2>

    <template if:true={isSaving}>
      <div class="d-flex justify-content-center align-items-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Saving...</span>
        </div>
      </div>
    </template>

    <template if:false={isSaving}>
      <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
        <ul class="nav nav-tabs mb-4">
          <li class="nav-item">
            <button
              class={usersTabClass}
              onclick={handleTabChange}
              data-tab="users"
            >
              <i class="ti ti-users me-1"></i>User Management
            </button>
          </li>
          <li class="nav-item">
            <button
              class={settingsTabClass}
              onclick={handleTabChange}
              data-tab="settings"
            >
              <i class="ti ti-settings me-1"></i>Global Settings
            </button>
          </li>
          <li class="nav-item">
            <button
              class={leaveTabClass}
              onclick={handleTabChange}
              data-tab="leave"
            >
              <i class="ti ti-calendar me-1"></i>Leave Settings
            </button>
          </li>
          <li class="nav-item">
            <button
              class={attendanceTabClass}
              onclick={handleTabChange}
              data-tab="attendance"
            >
              <i class="ti ti-clock me-1"></i>Attendance Settings
            </button>
          </li>
        </ul>

        <template if:true={isUserManagementTab}>
          <div class="mb-4">
            <template if:true={isLoading}>
              <div
                class="d-flex flex-column align-items-center justify-content-center py-5"
              >
                <div class="spinner-border text-primary mb-3" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-muted mb-0">Loading users...</p>
              </div>
            </template>

            <template if:false={isLoading}>
              <div
                class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-3"
              >
                <div class="flex-grow-1">
                  <lightning-input
                    type="search"
                    placeholder="Search users..."
                    onchange={handleUserSearch}
                    value={searchTerm}
                    variant="label-hidden"
                  ></lightning-input>
                </div>
                <div class="d-flex gap-2 align-items-center">
                  <lightning-combobox
                    value={pageSizeValue}
                    options={pageSizeOptions}
                    onchange={handlePageSizeChange}
                    variant="label-hidden"
                  ></lightning-combobox>
                  <lightning-button
                    label="New User"
                    icon-name="utility:add"
                    onclick={handleNewUser}
                    variant="brand"
                  ></lightning-button>
                </div>
              </div>

              <template if:true={hasUsers}>
                <div class="table-responsive border rounded">
                  <lightning-datatable
                    key-field="userId"
                    data={paginatedUsers}
                    columns={userColumns}
                    onrowaction={handleRowAction}
                    onsort={handleSort}
                    sorted-by={sortBy}
                    sorted-direction={sortDirection}
                    hide-checkbox-column="true"
                  ></lightning-datatable>
                </div>
                <div
                  class="d-flex align-items-center justify-content-between mt-3 p-3 bg-light rounded"
                >
                  <span class="text-muted small">{paginationInfo}</span>
                  <div class="d-flex gap-2 align-items-center">
                    <lightning-button-icon
                      icon-name="utility:chevronleft"
                      alternative-text="Previous"
                      onclick={handlePrevPage}
                      disabled={isPrevDisabled}
                      variant="border-filled"
                    ></lightning-button-icon>
                    <span class="small text-muted"
                      >Page {currentPage} of {totalPages}</span
                    >
                    <lightning-button-icon
                      icon-name="utility:chevronright"
                      alternative-text="Next"
                      onclick={handleNextPage}
                      disabled={isNextDisabled}
                      variant="border-filled"
                    ></lightning-button-icon>
                  </div>
                </div>
              </template>

              <template if:false={hasUsers}>
                <div
                  class="d-flex flex-column align-items-center justify-content-center py-5 text-center bg-light rounded"
                >
                  <span class="avatar avatar-xl bg-soft-secondary mx-auto mb-3">
                    <i class="ti ti-users fs-2 text-muted"></i>
                  </span>
                  <p class="text-muted mb-1">No users found.</p>
                  <p class="text-muted small mb-0">
                    Click "New User" to add one.
                  </p>
                </div>
              </template>
            </template>
          </div>
        </template>

        <template if:true={isGlobalSettingsTab}>
          <div class="row g-4 mb-4">
            <div class="col-12 col-lg-6">
              <div class="card h-100">
                <div class="card-header">
                  <h6 class="card-title mb-0">Module Settings</h6>
                </div>
                <div class="card-body d-flex flex-column gap-3">
                  <lightning-input
                    type="toggle"
                    label="Enable Payroll Module"
                    checked={globalSettings.Enable_Payroll_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Payroll_Module__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Enable Recruitment Module"
                    checked={globalSettings.Enable_Recruitment_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Recruitment_Module__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Enable Performance Module"
                    checked={globalSettings.Enable_Performance_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Performance_Module__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Enable Training Module"
                    checked={globalSettings.Enable_Training_Module__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Training_Module__c"
                  ></lightning-input>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="card h-100">
                <div class="card-header">
                  <h6 class="card-title mb-0">System Settings</h6>
                </div>
                <div class="card-body d-flex flex-column gap-3">
                  <lightning-input
                    type="toggle"
                    label="Enable Self Service Portal"
                    checked={globalSettings.Enable_Self_Service_Portal__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Enable_Self_Service_Portal__c"
                  ></lightning-input>
                  <lightning-input
                    type="toggle"
                    label="Auto Approve Attendance"
                    checked={globalSettings.Auto_Approve_Attendance_Request__c}
                    onchange={handleGlobalSettingChange}
                    data-field="Auto_Approve_Attendance_Request__c"
                  ></lightning-input>
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end mt-4">
            <lightning-button
              label="Save Global Settings"
              variant="brand"
              onclick={handleSaveGlobalSettings}
            ></lightning-button>
          </div>
        </template>

        <template if:true={isLeaveTab}>
          <c-pwchrono-leave-settings></c-pwchrono-leave-settings>
        </template>

        <template if:true={isAttendanceTab}>
          <c-pwchrono-attendance-settings></c-pwchrono-attendance-settings>
        </template>
      </div>
    </template>
  </div>

  <template if:true={showNewUserModal}>
    <c-pwchrono-new-user-form
      caller-portal-user-id={employeeId}
      session-token={sessionToken}
      onclose={handleCloseNewUserModal}
      onusersaved={handleUserSaved}
    ></c-pwchrono-new-user-form>
  </template>

  <template if:true={showUserFeatureModal}>
    <div class="modal fade show d-block" role="dialog" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content shadow border-0" style="overflow: visible;">
          <div class="modal-header">
            <div>
              <h5 class="modal-title fw-bold">
                Assign Profile: {selectedUser.userName}
              </h5>
              <p class="text-muted small mb-0">
                Current profile: {selectedUser.profileName}
              </p>
            </div>
            <button
              type="button"
              class="btn-close"
              onclick={closeModal}
            ></button>
          </div>

          <div class="modal-body p-4" style="overflow: visible; min-height: 320px;">
            <div class="alert alert-info mb-4" role="status">
              Access is inherited from the selected Portal User Profile. Object
              and field permissions are managed on the profile record.
            </div>
            <lightning-combobox
              name="portalProfile"
              label="Portal User Profile"
              value={selectedProfileId}
              options={profileOptions}
              onchange={handleProfileChange}
              dropdown-alignment="auto"
              required
            ></lightning-combobox>
            <lightning-combobox
              class="mt-3"
              name="reportingManager"
              label="Reports To"
              value={selectedManagerId}
              options={availableManagerOptions}
              onchange={handleManagerChange}
              dropdown-alignment="auto"
              field-level-help="This Portal User becomes the employee's manager for team views and approval routing. Leave blank only for top-level users."
            ></lightning-combobox>
          </div>

          <div class="modal-footer">
            <lightning-button
              label="Cancel"
              variant="neutral"
              onclick={closeModal}
            ></lightning-button>
            <lightning-button
              label="Assign Profile"
              variant="brand"
              onclick={handleSaveUserProfile}
            ></lightning-button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop fade show"></div>
  </template>

  <!-- VIEW USER RECORD MODAL -->
  <template if:true={showViewRecordModal}>
    <div class="modal fade show d-block" role="dialog" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow border-0">
          <div class="modal-header bg-light border-bottom">
            <div class="d-flex align-items-center gap-2">
              <span class="avatar avatar-md bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px">
                <i class="ti ti-user fs-5"></i>
              </span>
              <div>
                <h5 class="modal-title fw-bold mb-0">User Record Details</h5>
                <p class="text-muted small mb-0">{viewingUser.userName}</p>
              </div>
            </div>
            <button
              type="button"
              class="btn-close"
              onclick={closeViewRecordModal}
            ></button>
          </div>

          <div class="modal-body p-4">
            <div class="d-flex align-items-center justify-content-between p-3 bg-light rounded mb-3">
              <div>
                <h6 class="fw-bold mb-1">{viewingUser.userName}</h6>
                <p class="text-muted small mb-0">{viewingUser.userEmail}</p>
              </div>
              <span class={viewingUser.statusBadgeClass}>
                {viewingUser.statusText}
              </span>
            </div>

            <div class="row g-3">
              <div class="col-6">
                <span class="text-muted small d-block">Role</span>
                <strong class="text-dark fs-13">{viewingUser.roleName}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Designation</span>
                <strong class="text-dark fs-13">{viewingUser.designation}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Department</span>
                <strong class="text-dark fs-13">{viewingUser.department}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Portal User Profile</span>
                <strong class="text-primary fs-13">{viewingUser.profileName}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Reports To</span>
                <strong class="text-dark fs-13">{viewingUser.managerName}</strong>
              </div>
              <div class="col-6">
                <span class="text-muted small d-block">Phone</span>
                <strong class="text-dark fs-13">{viewingUser.phone}</strong>
              </div>
            </div>
          </div>

          <div class="modal-footer bg-light border-top">
            <lightning-button
              label="Close"
              variant="neutral"
              onclick={closeViewRecordModal}
            ></lightning-button>
            <lightning-button
              label="Manage Access"
              icon-name="utility:lock"
              variant="brand"
              onclick={handleManageAccessFromView}
            ></lightning-button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop fade show"></div>
  </template>
</template>
