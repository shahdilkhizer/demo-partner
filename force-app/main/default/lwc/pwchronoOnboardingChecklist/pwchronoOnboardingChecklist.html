<template>
  <div class="page-wrapper onboarding-shell">
    <div class="content container-fluid">
      <header class="page-header">
        <div>
          <h2 class="page-title">Onboarding checklist</h2>
          <p class="breadcrumb-text">Dashboard / Onboarding</p>
        </div>
        <button
          class="btn btn-outline-secondary"
          type="button"
          onclick={loadTasks}
          disabled={isLoading}
        >
          Refresh
        </button>
      </header>
      <template if:true={isLoading}
        ><section class="state-card" aria-live="polite">
          <lightning-spinner
            alternative-text="Loading onboarding tasks"
            size="small"
          ></lightning-spinner
          ><span>Loading your onboarding tasks…</span>
        </section></template
      >
      <template if:false={isLoading}
        ><template if:true={error}
          ><section class="state-card error-state" role="alert">
            <strong>We could not load your checklist.</strong
            ><span>{error}</span
            ><button class="btn btn-primary" type="button" onclick={loadTasks}>
              Try again
            </button>
          </section></template
        ><template if:false={error}>
          <section class="welcome-card">
            <div>
              <p class="eyebrow">Your onboarding plan</p>
              <h1>Welcome to PWChrono</h1>
              <p>
                Complete the tasks below to get set up. Your progress is saved
                as you finish each item.
              </p>
            </div>
            <div
              class="progress-ring"
              style={progressStyle}
              role="img"
              aria-label={progressLabel}
            >
              <strong>{progress}%</strong><span>complete</span>
            </div>
          </section>
          <section class="metric-grid" aria-label="Onboarding summary">
            <div class="metric-card">
              <span class="metric-label">Total tasks</span
              ><strong>{totalCount}</strong><span>Assigned to you</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Open tasks</span
              ><strong>{openCount}</strong><span>Still to complete</span>
            </div>
            <div class="metric-card">
              <span class="metric-label">Completed</span
              ><strong>{completedCount}</strong><span>Saved successfully</span>
            </div>
            <div class="metric-card warning">
              <span class="metric-label">Overdue</span
              ><strong>{overdueCount}</strong><span>Need your attention</span>
            </div>
          </section>
          <section class="checklist-card">
            <div class="section-heading">
              <div>
                <h2>My tasks</h2>
                <p>Work through each task in due-date order.</p>
              </div>
              <div class="controls">
                <input
                  class="form-control"
                  type="search"
                  placeholder="Search tasks"
                  aria-label="Search tasks"
                  oninput={handleSearch}
                /><select
                  class="form-select"
                  aria-label="Filter tasks"
                  onchange={handleFilter}
                >
                  <template for:each={filterOptions} for:item="option"
                    ><option key={option.value} value={option.value}>
                      {option.label}
                    </option></template
                  >
                </select>
              </div>
            </div>
            <template if:true={hasTasks}
              ><div class="task-list">
                <template for:each={filteredTasks} for:item="task"
                  ><article key={task.Id} class="task-row">
                    <div class="task-icon">
                      <lightning-icon
                        icon-name={task.iconName}
                        size="small"
                        alternative-text=""
                      ></lightning-icon>
                    </div>
                    <div class="task-copy">
                      <div class="task-title">
                        <h3>{task.Name}</h3>
                        <template if:true={task.Is_Mandatory__c}
                          ><span class="badge mandatory"
                            >Mandatory</span
                          ></template
                        >
                      </div>
                      <p>{task.Description__c}</p>
                      <div class="task-meta">
                        <span>{task.statusLabel}</span
                        ><span
                          ><template if:true={task.Due_Date__c}
                            >Due
                            <lightning-formatted-date-time
                              value={task.Due_Date__c}
                              year="numeric"
                              month="short"
                              day="numeric"
                            ></lightning-formatted-date-time></template
                          ><template if:false={task.Due_Date__c}
                            >No due date</template
                          ></span
                        >
                      </div>
                    </div>
                    <template if:false={task.isCompleted}
                      ><button
                        class="btn btn-primary complete-button"
                        type="button"
                        data-id={task.Id}
                        onclick={handleMarkComplete}
                        disabled={task.isSaving}
                      >
                        <lightning-icon
                          icon-name="utility:check"
                          size="x-small"
                          alternative-text=""
                        ></lightning-icon>
                        Mark complete
                      </button></template
                    ><template if:true={task.isCompleted}
                      ><span class="completed-label">✓ Done</span></template
                    >
                  </article></template
                >
              </div></template
            ><template if:false={hasTasks}
              ><div class="empty-state">
                <lightning-icon
                  icon-name="utility:task"
                  size="medium"
                  alternative-text=""
                ></lightning-icon>
                <h3>No tasks match this view</h3>
                <p>Try another filter or search term.</p>
              </div></template
            >
          </section>
        </template></template
      >
    </div>
  </div>
</template>
