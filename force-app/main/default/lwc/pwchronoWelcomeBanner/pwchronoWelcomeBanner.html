<template lwc:render-mode="light">
  <div class="card border-0">
    <div
      class="card-body d-flex align-items-center justify-content-between flex-wrap pb-1"
    >
      <div class="d-flex align-items-center mb-3">
        <c-pwchrono-avatar
          container-class="avatar avatar-xl flex-shrink-0 avatar-rounded"
          image-url={userPhoto}
          name={userName}
          alt-text={userName}
          image-class="rounded-circle"
          title-class="initial-wrap"
          fallback-bg-class="bg-secondary"
        ></c-pwchrono-avatar>
        <div class="ms-3">
          <h3 class="mb-2">
            Welcome Back, {displayUserName}
            <button
              type="button"
              class="edit-icon bg-transparent border-0 p-0"
              aria-label="Edit"
              title="Edit"
            >
              <i class="fa-solid fa-pen-to-square fs-14"></i>
            </button>
          </h3>
          <p>
            You have
            <span class="text-primary text-decoration-underline"
              >{pendingApprovals}</span
            >
            Pending Approvals &amp;
            <span class="text-primary text-decoration-underline"
              >{leaveRequests}</span
            >
            Leave Requests
          </p>
        </div>
      </div>
      <div class="d-flex align-items-center flex-wrap mb-1">
        <button
          class="btn btn-secondary btn-md me-2 mb-2"
          type="button"
          onclick={handleAddProject}
        >
          <i class="fa-solid fa-square-plus me-1"></i>Add Project
        </button>
        <button
          class="btn btn-primary btn-md mb-2"
          type="button"
          onclick={handleAddRequests}
        >
          <i class="fa-solid fa-square-plus me-1"></i>Add Requests
        </button>
      </div>
    </div>
  </div>
</template>
