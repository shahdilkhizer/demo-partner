<template lwc:render-mode="light">
  <div class="page-wrapper opportunity-page">
    <div class="content">
      <header class="page-heading">
        <div>
          <p class="eyebrow">PROJECTS</p>
          <h1>Opportunities</h1>
          <p class="subtitle">
            Browse Salesforce opportunities and review their latest details.
          </p>
        </div>
        <span class="admin-badge">Administrator workspace</span>
      </header>
      <template lwc:if={error}
        ><section class="notice" role="alert">
          <h2>Opportunities unavailable</h2>
          <p>{error}</p>
          <button class="action" onclick={refresh}>Try again</button>
        </section></template
      >
      <template lwc:if={authorized}>
        <section class="overview" aria-label="Opportunity summary">
          <div><span>Matching opportunities</span><strong>{total}</strong></div>
          <div><span>Records loaded</span><strong>{shown}</strong></div>
          <p>
            All stages are included by default. Select an opportunity to view
            its details.
          </p>
        </section>
        <form class="filters" onsubmit={handleSubmit}>
          <label class="search-label"
            >Search opportunities<input
              type="search"
              value={search}
              oninput={handleSearch}
              placeholder="Search by opportunity name" /></label
          ><lightning-combobox
            label="Stage"
            value={stage}
            options={stageOptions}
            onchange={handleStage}
          ></lightning-combobox
          ><button type="submit" class="action" disabled={loading}>
            Search</button
          ><button
            type="button"
            class="secondary"
            onclick={refresh}
            disabled={loading}
          >
            Refresh
          </button>
        </form>
      </template>
      <template lwc:if={loading}
        ><p role="status" class="loading">Loading opportunities…</p></template
      >
      <template lwc:if={empty}
        ><section class="empty">
          <h2>No matching opportunities</h2>
          <p>Try another name or select all stages.</p>
        </section></template
      >
      <template lwc:if={hasRecords}
        ><div
          class="table-wrap"
          tabindex="0"
          role="region"
          aria-label="Opportunities table; scroll horizontally on small screens"
        >
          <table>
            <thead>
              <tr>
                <th scope="col">Opportunity</th>
                <th scope="col">Stage</th>
                <th scope="col">Amount</th>
                <th scope="col">Close date</th>
                <th scope="col">Owner</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={records} for:item="row"
                ><tr key={row.Id}>
                  <td>
                    <button
                      class="record-link"
                      data-id={row.Id}
                      onclick={openDetails}
                    >
                      {row.Name}</button
                    ><span class="account">{row.accountName}</span>
                  </td>
                  <td><span class={row.badge}>{row.StageName}</span></td>
                  <td>
                    <lightning-formatted-number
                      value={row.Amount}
                      format-style="currency"
                    ></lightning-formatted-number>
                  </td>
                  <td>
                    <lightning-formatted-date-time
                      value={row.CloseDate}
                      time-zone="UTC"
                    ></lightning-formatted-date-time>
                  </td>
                  <td>{row.ownerName}</td>
                </tr></template
              >
            </tbody>
          </table>
        </div>
        <footer class="list-footer">
          <span>Showing {shown} of {total} opportunities</span
          ><template lwc:if={hasMore}
            ><button class="secondary" onclick={loadMore} disabled={loading}>
              Load more
            </button></template
          >
        </footer></template
      >
    </div>
  </div>
  <template lwc:if={showDialog}
    ><div class="detail-overlay">
      <section
        class="detail-dialog"
        role="dialog"
        aria-modal="true"
        aria-label="Opportunity details"
        onkeydown={handleDialogKey}
      >
        <header>
          <div>
            <p class="eyebrow">OPPORTUNITY</p>
            <h2>Opportunity details</h2>
          </div>
          <button
            class="secondary close-detail"
            onclick={closeDetails}
            aria-label="Close opportunity details"
          >
            Close
          </button>
        </header>
        <div class="detail-body">
          <template lwc:if={detailLoading}
            ><p role="status">Loading details…</p></template
          ><template lwc:if={detailError}
            ><p role="alert">{detailError}</p></template
          ><template lwc:if={selected}
            ><h3>{selected.Name}</h3>
            <p class="subtitle">{selected.accountName}</p>
            <dl>
              <div>
                <dt>Stage</dt>
                <dd>{selected.StageName}</dd>
              </div>
              <div>
                <dt>Owner</dt>
                <dd>{selected.ownerName}</dd>
              </div>
              <div>
                <dt>Amount</dt>
                <dd>
                  <lightning-formatted-number
                    value={selected.Amount}
                    format-style="currency"
                  ></lightning-formatted-number>
                </dd>
              </div>
              <div>
                <dt>Close date</dt>
                <dd>
                  <lightning-formatted-date-time
                    value={selected.CloseDate}
                    time-zone="UTC"
                  ></lightning-formatted-date-time>
                </dd>
              </div>
              <div>
                <dt>Probability</dt>
                <dd>{selected.Probability}%</dd>
              </div>
              <div>
                <dt>Type</dt>
                <dd>{selected.Type}</dd>
              </div>
              <div>
                <dt>Lead source</dt>
                <dd>{selected.LeadSource}</dd>
              </div>
            </dl>
            <h4>Next step</h4>
            <p class="description">{selected.nextStep}</p>
            <h4>Description</h4>
            <p class="description">{selected.description}</p></template
          >
        </div>
      </section>
    </div></template
  >
</template>
