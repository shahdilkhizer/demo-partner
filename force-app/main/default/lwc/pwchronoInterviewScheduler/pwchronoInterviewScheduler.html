<template lwc:render-mode="light">
  <div class="interview-scheduler-container">
    <div class="card border shadow-sm mb-4">
      <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
        <div>
          <h5 class="mb-0 fw-bold text-dark">Interview Scheduler</h5>
          <small class="text-muted">Schedule and manage candidate interviews</small>
        </div>
        <button
          type="button"
          class="btn btn-sm btn-primary d-flex align-items-center gap-2"
          onclick={handleNewInterview}
          disabled={isScheduleDisabled}
        >
          <i class="fa-solid fa-calendar-plus"></i> Schedule Interview
        </button>
      </div>

      <div class="card-body p-4">
        <!-- Applicant Selection -->
        <div class="row mb-4">
          <div class="col-12 col-md-6">
            <lightning-combobox
              name="applicant"
              label="Select Applicant"
              value={selectedApplicantId}
              placeholder="Search or select applicant..."
              options={applicantOptions}
              onchange={handleApplicantChange}
            ></lightning-combobox>
          </div>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
          <div class="d-flex justify-content-center align-items-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading applicants...</span>
            </div>
          </div>
        </template>

        <!-- Interviews Section -->
        <template if:false={isLoading}>
          <template if:true={isInterviewsLoading}>
            <div class="d-flex justify-content-center align-items-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading interviews...</span>
              </div>
            </div>
          </template>

          <template if:false={isInterviewsLoading}>
            <div if:true={selectedApplicantId}>
              <template if:true={interviews.length}>
                <h6 class="fw-bold text-dark mb-3">Scheduled Interviews</h6>
                <div class="row g-3">
                  <template for:each={interviews} for:item="inv">
                    <div key={inv.Id} class="col-12 col-md-6">
                      <div class="card border bg-light h-100">
                        <div class="card-body p-3">
                          <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="fw-bold text-primary">{inv.Round__c}</span>
                            <span class={inv.statusClass}>{inv.Result__c}</span>
                          </div>
                          <div class="small text-muted">
                            <div class="mb-1">
                              <strong>Date:</strong> {inv.formattedDate}
                            </div>
                            <div class="mb-1">
                              <strong>Interviewer:</strong> {inv.interviewerName}
                            </div>
                            <div if:true={inv.Feedback__c} class="mt-2 p-2 bg-white rounded border">
                              <strong>Feedback:</strong> {inv.Feedback__c}
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <template if:false={interviews.length}>
                <div class="d-flex flex-column align-items-center justify-content-center py-5 text-center">
                  <div class="rounded-circle bg-light d-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px; float: none !important; margin: 0 auto !important;">
                    <i class="fa-solid fa-calendar-xmark fa-2x text-muted" style="float: none !important; margin: 0 !important;"></i>
                  </div>
                  <p class="text-muted mb-0">No interviews scheduled for this applicant.</p>
                </div>
              </template>
            </div>

            <div if:false={selectedApplicantId}>
              <div class="d-flex flex-column align-items-center justify-content-center py-5 text-center">
                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px; float: none !important; margin: 0 auto !important;">
                  <i class="fa-solid fa-user-clock fa-2x text-muted" style="float: none !important; margin: 0 !important;"></i>
                </div>
                <p class="text-muted mb-0">Select an applicant to view or schedule interviews.</p>
              </div>
            </div>
          </template>
        </template>
      </div>
    </div>

    <!-- Schedule Modal -->
    <template if:true={isModalOpen}>
      <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document">
          <div class="modal-content">
            <div class="modal-header bg-primary text-white">
              <h5 class="modal-title fw-bold text-white">Schedule Interview</h5>
              <button type="button" class="btn-close btn-close-white" onclick={closeModal} aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <lightning-combobox
                    name="Round__c"
                    label="Interview Round"
                    value={currentInterview.Round__c}
                    options={roundOptions}
                    onchange={handleInputChange}
                    required
                  ></lightning-combobox>
                </div>
                <div class="col-12 col-md-6">
                  <lightning-input
                    type="datetime"
                    label="Date & Time"
                    name="Interview_Date__c"
                    value={currentInterview.Interview_Date__c}
                    onchange={handleInputChange}
                    required
                  ></lightning-input>
                </div>
                <div class="col-12">
                  <lightning-combobox
                    name="Interviewer__c"
                    label="Interviewer"
                    value={currentInterview.Interviewer__c}
                    options={interviewerOptions}
                    onchange={handleInputChange}
                    required
                  ></lightning-combobox>
                </div>
                <div class="col-12">
                  <lightning-input
                    type="checkbox"
                    label="Send Email Notification"
                    name="sendEmail"
                    checked
                    disabled
                  ></lightning-input>
                  <small class="text-muted d-block mt-1">Email notifications are automatically sent to the interviewer.</small>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" onclick={closeModal}>Cancel</button>
              <button type="button" class="btn btn-primary" onclick={handleSaveInterview}>Schedule</button>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
