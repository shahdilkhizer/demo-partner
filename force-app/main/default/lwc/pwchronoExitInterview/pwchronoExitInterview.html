<template>
    <c-pwchrono-main-layout>
        <div slot="main-content">
            <!-- Page header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-1">
                        <i class="fa-solid fa-comments fa-fw me-2 text-primary"></i>Exit Interview
                    </h4>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="#" onclick={handleHome}>Home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Exit Interview</li>
                        </ol>
                    </nav>
                </div>
                <template if:true={isHrAdmin}>
                    <button class="btn btn-primary btn-sm" onclick={handleCreate}>
                        <i class="fa-solid fa-plus fa-fw me-1"></i>New Exit Interview
                    </button>
                </template>
            </div>

            <!-- Error alert -->
            <template if:true={errorMessage}>
                <div class="alert alert-danger alert-dismissible d-flex align-items-center mb-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation fa-fw me-2"></i>
                    <div>{errorMessage}</div>
                    <button type="button" class="btn-close" onclick={clearError}></button>
                </div>
            </template>

            <!-- Metric cards -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center">
                            <div class="fs-2 fw-bold text-primary">{totalCount}</div>
                            <div class="text-muted small">Total</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center">
                            <div class="fs-2 fw-bold text-secondary">{pendingCount}</div>
                            <div class="text-muted small">Pending</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center">
                            <div class="fs-2 fw-bold text-warning">{scheduledCount}</div>
                            <div class="text-muted small">Scheduled</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body text-center">
                            <div class="fs-2 fw-bold text-success">{completedCount}</div>
                            <div class="text-muted small">Completed</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter bar -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body py-2">
                    <div class="row g-2 align-items-center">
                        <div class="col-auto">
                            <label class="form-label mb-0 fw-semibold small">Status</label>
                        </div>
                        <div class="col-auto">
                            <select class="form-select form-select-sm" onchange={handleFilterChange}>
                                <template for:each={statusOptions} for:item="opt">
                                    <option key={opt.value} value={opt.value}
                                        selected={opt.selected}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </template>

            <!-- Table -->
            <template if:false={isLoading}>
                <div class="card border-0 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Interview #</th>
                                    <th>Employee</th>
                                    <th>Department</th>
                                    <th>Designation</th>
                                    <th>Interview Date</th>
                                    <th>Interviewer</th>
                                    <th>Rating</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template if:true={hasRecords}>
                                    <template for:each={enrichedRecords} for:item="row">
                                        <tr key={row.Id}>
                                            <td class="text-muted small">{row.Name}</td>
                                            <td class="fw-semibold">{row.employeeName}</td>
                                            <td>{row.deptName}</td>
                                            <td>{row.desigName}</td>
                                            <td>{row.Interview_Date__c}</td>
                                            <td>{row.interviewerName}</td>
                                            <td>
                                                <template if:true={row.Rating__c}>
                                                    <span class="badge bg-info text-dark">
                                                        <i class="fa-solid fa-star fa-fw me-1"></i>{row.Rating__c}/5
                                                    </span>
                                                </template>
                                                <template if:false={row.Rating__c}>
                                                    <span class="text-muted small">—</span>
                                                </template>
                                            </td>
                                            <td>
                                                <span class={row.statusBadgeClass}>{row.Status__c}</span>
                                            </td>
                                            <td>
                                                <button class="btn btn-sm btn-outline-primary me-1"
                                                    data-id={row.Id} onclick={handleEdit} title="Edit">
                                                    <i class="fa-solid fa-pen-to-square fa-fw"></i>
                                                </button>
                                                <template if:true={isHrAdmin}>
                                                    <button class="btn btn-sm btn-outline-danger"
                                                        data-id={row.Id} onclick={handleDelete} title="Delete">
                                                        <i class="fa-solid fa-trash fa-fw"></i>
                                                    </button>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </template>
                                <template if:false={hasRecords}>
                                    <tr>
                                        <td colspan="9" class="text-center text-muted py-4">
                                            <i class="fa-solid fa-inbox fa-fw me-2"></i>No exit interview records found.
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>

            <!-- Create / Edit Modal -->
            <template if:true={showModal}>
                <div class="modal d-block" tabindex="-1" style="background:rgba(0,0,0,.5)">
                    <div class="modal-dialog modal-xl modal-dialog-scrollable">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title fw-semibold">
                                    <i class="fa-solid fa-comments fa-fw me-2 text-primary"></i>
                                    {modalTitle}
                                </h5>
                                <button type="button" class="btn-close" onclick={handleModalClose}></button>
                            </div>
                            <div class="modal-body">
                                <!-- Validation error -->
                                <template if:true={validationError}>
                                    <div class="alert alert-warning d-flex align-items-center mb-3">
                                        <i class="fa-solid fa-triangle-exclamation fa-fw me-2"></i>
                                        {validationError}
                                    </div>
                                </template>

                                <div class="row g-3">
                                    <!-- Employee -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Employee <span class="text-danger">*</span></label>
                                        <select class="form-select form-select-sm" data-field="Employee__c" onchange={handleFieldChange}>
                                            <option value="">-- Select Employee --</option>
                                            <template for:each={employeeOptions} for:item="opt">
                                                <option key={opt.value} value={opt.value}
                                                    selected={opt.selected}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Employee Name -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Employee Name</label>
                                        <input type="text" class="form-control form-control-sm"
                                            data-field="Employee_Name__c"
                                            value={editRecord.Employee_Name__c}
                                            onchange={handleFieldChange} />
                                    </div>
                                    <!-- Department -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Department</label>
                                        <select class="form-select form-select-sm" data-field="Department__c" onchange={handleFieldChange}>
                                            <option value="">-- Select --</option>
                                            <template for:each={departmentOptions} for:item="opt">
                                                <option key={opt.value} value={opt.value}
                                                    selected={opt.selected}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Designation -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Designation</label>
                                        <select class="form-select form-select-sm" data-field="Designation__c" onchange={handleFieldChange}>
                                            <option value="">-- Select --</option>
                                            <template for:each={designationOptions} for:item="opt">
                                                <option key={opt.value} value={opt.value}
                                                    selected={opt.selected}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Separation -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Linked Separation</label>
                                        <select class="form-select form-select-sm" data-field="Separation__c" onchange={handleFieldChange}>
                                            <option value="">-- None --</option>
                                            <template for:each={separationOptions} for:item="opt">
                                                <option key={opt.value} value={opt.value}
                                                    selected={opt.selected}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Interviewer -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Interviewer</label>
                                        <select class="form-select form-select-sm" data-field="Interviewer__c" onchange={handleFieldChange}>
                                            <option value="">-- Select --</option>
                                            <template for:each={employeeOptions} for:item="opt">
                                                <option key={opt.value} value={opt.value}
                                                    selected={opt.interviewerSelected}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Interview Date -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Interview Date <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control form-control-sm"
                                            data-field="Interview_Date__c"
                                            value={editRecord.Interview_Date__c}
                                            onchange={handleFieldChange} />
                                    </div>
                                    <!-- Rating -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small">Rating (1–5)</label>
                                        <select class="form-select form-select-sm" data-field="Rating__c" onchange={handleFieldChange}>
                                            <option value="">-- Not Rated --</option>
                                            <template for:each={ratingOptions} for:item="opt">
                                                <option key={opt.value} value={opt.value}
                                                    selected={opt.selected}>{opt.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <!-- Status (HR only) -->
                                    <template if:true={isHrAdmin}>
                                        <div class="col-md-4">
                                            <label class="form-label fw-semibold small">Status</label>
                                            <select class="form-select form-select-sm" data-field="Status__c" onchange={handleFieldChange}>
                                                <template for:each={eiStatusOptions} for:item="opt">
                                                    <option key={opt.value} value={opt.value}
                                                        selected={opt.selected}>{opt.label}</option>
                                                </template>
                                            </select>
                                        </div>
                                    </template>

                                    <!-- Exit Questionnaire -->
                                    <div class="col-12">
                                        <hr class="my-1" />
                                        <label class="form-label fw-semibold small">Exit Questionnaire</label>
                                        <textarea class="form-control form-control-sm" rows="4"
                                            data-field="Exit_Questionnaire__c"
                                            onchange={handleFieldChange}>{editRecord.Exit_Questionnaire__c}</textarea>
                                    </div>
                                    <!-- Employee Feedback -->
                                    <div class="col-12">
                                        <label class="form-label fw-semibold small">Employee Feedback</label>
                                        <textarea class="form-control form-control-sm" rows="4"
                                            data-field="Employee_Feedback__c"
                                            onchange={handleFieldChange}>{editRecord.Employee_Feedback__c}</textarea>
                                    </div>
                                    <!-- Final Remarks -->
                                    <div class="col-12">
                                        <label class="form-label fw-semibold small">Final Remarks</label>
                                        <textarea class="form-control form-control-sm" rows="3"
                                            data-field="Final_Remarks__c"
                                            onchange={handleFieldChange}>{editRecord.Final_Remarks__c}</textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <template if:true={isHrAdmin}>
                                    <template if:true={isEditMode}>
                                        <button type="button" class="btn btn-danger btn-sm me-auto"
                                            data-id={editRecord.Id} onclick={handleDelete}>
                                            <i class="fa-solid fa-trash fa-fw me-1"></i>Delete
                                        </button>
                                    </template>
                                </template>
                                <button type="button" class="btn btn-secondary btn-sm" onclick={handleModalClose}>Cancel</button>
                                <button type="button" class="btn btn-primary btn-sm" onclick={handleSave} disabled={isSaving}>
                                    <template if:true={isSaving}>
                                        <span class="spinner-border spinner-border-sm me-1" role="status"></span>
                                    </template>
                                    <i class="fa-solid fa-floppy-disk fa-fw me-1"></i>Save
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </c-pwchrono-main-layout>
</template>
