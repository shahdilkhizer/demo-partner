<template lwc:render-mode="light">
  <!-- Loading -->
  <template if:true={isLoading}>
    <div class="text-center py-5">
      <div class="spinner-border text-primary">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </template>

  <!-- Error -->
  <template if:true={loadError}>
    <div class="alert alert-danger m-3">
      <i class="fa-solid fa-circle-exclamation me-2"></i>{loadError}
    </div>
  </template>

  <template if:true={hasData}>
    <div class="page-wrapper">
      <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
        <!-- Back Button -->
        <div class="mb-3">
          <button type="button" class="btn btn-sm btn-white" onclick={handleBack}>
            <i class="fa-solid fa-arrow-left me-1"></i>Back to Leaves
          </button>
        </div>

        <!-- Request Header -->
        <c-pwchrono-request-header
          record-name={leaveTitle}
          record-type={leaveTypeName}
          status={leaveStatus}
          submitted-by={employeeName}
          submitted-date={appliedDate}
        ></c-pwchrono-request-header>

        <div class="row g-3 mt-1">
          <!-- Left Column: Details + Files -->
          <div class="col-12 col-xl-8">
            <!-- Leave Details Card -->
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0">Leave Details</h5>
              </div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <span class="form-label text-muted fs-12 mb-1">Leave Type</span>
                      <p class="fw-medium mb-0">{leaveTypeName}</p>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <span class="form-label text-muted fs-12 mb-1">Status</span>
                      <div>
                        <c-pwchrono-request-status-badge status={leaveStatus}></c-pwchrono-request-status-badge>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <span class="form-label text-muted fs-12 mb-1">From Date</span>
                      <p class="fw-medium mb-0">{fromDate}</p>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <span class="form-label text-muted fs-12 mb-1">To Date</span>
                      <p class="fw-medium mb-0">{toDate}</p>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <span class="form-label text-muted fs-12 mb-1">Total Days</span>
                      <p class="fw-medium mb-0">{totalDays}</p>
                    </div>
                  </div>
                  <template if:true={isHalfDay}>
                    <div class="col-md-6">
                      <div class="mb-3">
                        <span class="form-label text-muted fs-12 mb-1">Half Day Session</span>
                        <p class="fw-medium mb-0">{halfDaySession}</p>
                      </div>
                    </div>
                  </template>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <span class="form-label text-muted fs-12 mb-1">Approver</span>
                      <p class="fw-medium mb-0">{approverName}</p>
                    </div>
                  </div>
                  <template if:true={approvalDate}>
                    <div class="col-md-6">
                      <div class="mb-3">
                        <span class="form-label text-muted fs-12 mb-1">Approval Date</span>
                        <p class="fw-medium mb-0">{approvalDate}</p>
                      </div>
                    </div>
                  </template>
                  <div class="col-12">
                    <div class="mb-0">
                      <span class="form-label text-muted fs-12 mb-1">Reason</span>
                      <p class="mb-0">{reason}</p>
                    </div>
                  </div>
                  <template if:true={rejectionReason}>
                    <div class="col-12">
                      <div class="mb-0">
                        <span class="form-label text-muted fs-12 mb-1 text-danger">Rejection Reason</span>
                        <p class="mb-0 text-danger">{rejectionReason}</p>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <c-pwchrono-file-upload-panel
              files={files}
              allow-upload={canUploadFiles}
              accept=".pdf,.jpg,.jpeg,.png"
              onfilesselected={handleFilesSelected}
            ></c-pwchrono-file-upload-panel>

            <div class="card mt-3">
              <div class="card-header">
                <h5 class="mb-0">Ledger History</h5>
              </div>
              <div class="card-body p-0">
                <template if:true={hasLedgerEntries}>
                  <div class="table-responsive">
                    <table class="table mb-0">
                      <thead>
                        <tr>
                          <th>Date</th>
                          <th>Type</th>
                          <th>Days</th>
                          <th>Balance After</th>
                          <th>Notes</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template for:each={enrichedLedgerEntries} for:item="entry">
                          <tr key={entry.key}>
                            <td>{entry.displayDate}</td>
                            <td>{entry.transactionType}</td>
                            <td>{entry.signedDays}</td>
                            <td>{entry.balanceAfter}</td>
                            <td>{entry.notes}</td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template if:false={hasLedgerEntries}>
                  <p class="text-muted text-center py-3 mb-0">No ledger entries yet.</p>
                </template>
              </div>
            </div>
          </div>

          <!-- Right Column: Actions + Timeline -->
          <div class="col-12 col-xl-4">
            <!-- Action Bar -->
            <c-pwchrono-request-action-bar
              status={leaveStatus}
              is-approver={isApprover}
              is-owner={isOwner}
              onrequestaction={handleRequestAction}
            ></c-pwchrono-request-action-bar>

            <div class="mt-3">
              <c-pwchrono-request-comments
                entries={timelineEntries}
                allow-new-comment={canComment}
                onnewcomment={handleNewComment}
              ></c-pwchrono-request-comments>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
