<template lwc:render-mode="light">
  <div class="page-wrapper" style="min-height: 1318px">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- Breadcrumb -->
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1">Profile</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="index.html"><i class="fa-solid fa-house"></i></a>
              </li>
              <li class="breadcrumb-item">Pages</li>
              <li class="breadcrumb-item active" aria-current="page">
                Profile
              </li>
            </ol>
          </nav>
        </div>
        <div class="head-icons ms-2">
          <a
            href="javascript:void(0);"
            class=""
            data-bs-toggle="tooltip"
            data-bs-placement="top"
            data-bs-original-title="Collapse"
            id="collapse-header"
          >
            <i class="fa-solid fa-chevron-up"></i>
          </a>
        </div>
      </div>
      <!-- /Breadcrumb -->

      <div class="card">
        <div class="card-body">
          <div class="border-bottom mb-3 pb-3">
            <h4>Profile</h4>
          </div>

          <template if:true={profile}>
            <div>
              <div class="border-bottom mb-3">
                <div class="row">
                  <div class="col-md-12">
                    <div>
                      <h6 class="mb-3">Basic Information</h6>
                      <div
                        class="d-flex align-items-center flex-wrap row-gap-3 bg-light w-100 rounded p-3 mb-4"
                      >
                        <c-pwchrono-avatar
                          container-class="d-flex align-items-center justify-content-center avatar avatar-xxl rounded-circle border border-dashed me-2 flex-shrink-0 text-dark frames"
                          image-url={profile.Photo_Url__c}
                          name={profile.Name}
                          initials={initials}
                          alt-text="Profile"
                          image-class="rounded-circle"
                          image-style="width:100%; height:100%; object-fit:cover;"
                          title-class="fs-16"
                        ></c-pwchrono-avatar>
                        <div class="profile-upload">
                          <div class="mb-2">
                            <h6 class="mb-1">Profile Photo</h6>
                            <p class="fs-12">
                              Recommended image size is 40px x 40px
                            </p>
                          </div>
                          <div
                            class="profile-uploader d-flex align-items-center"
                          >
                            <div
                              class="drag-upload-btn btn btn-sm btn-primary me-2"
                            >
                              Upload
                              <input
                                type="file"
                                class="form-control image-sign"
                                onchange={handleImageUpload}
                                accept="image/*"
                              />
                            </div>
                            <button
                              type="button"
                              class="btn btn-light btn-sm"
                              onclick={handleCancelUpload}
                            >
                              Cancel
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="row align-items-center mb-3">
                      <div class="col-md-4">
                        <label class="form-label mb-md-0" for="profile-fullname"
                          >Full Name</label
                        >
                      </div>
                      <div class="col-md-8">
                        <input
                          type="text"
                          id="profile-fullname"
                          class="form-control"
                          name="Name"
                          value={formState.Name}
                          onchange={handleFieldChange}
                        />
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="row align-items-center mb-3">
                      <div class="col-md-4">
                        <label class="form-label mb-md-0" for="profile-email"
                          >Email</label
                        >
                      </div>
                      <div class="col-md-8">
                        <input
                          type="text"
                          id="profile-email"
                          class="form-control"
                          value={profile.Email__c}
                          disabled
                        />
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="row align-items-center mb-3">
                      <div class="col-md-4">
                        <label class="form-label mb-md-0" for="profile-phone"
                          >Phone</label
                        >
                      </div>
                      <div class="col-md-8">
                        <input
                          type="text"
                          id="profile-phone"
                          class="form-control"
                          name="Phone__c"
                          value={formState.Phone__c}
                          onchange={handleFieldChange}
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="border-bottom mb-3">
                <h6 class="mb-3">Address Information</h6>
                <div class="row">
                  <div class="col-md-12">
                    <div class="row align-items-center mb-3">
                      <div class="col-md-2">
                        <label class="form-label mb-md-0" for="profile-address"
                          >Address</label
                        >
                      </div>
                      <div class="col-md-10">
                        <input
                          type="text"
                          id="profile-address"
                          class="form-control"
                          name="Address__c"
                          value={formState.Address__c}
                          onchange={handleFieldChange}
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="border-bottom mb-3">
                <h6 class="mb-3">Emergency Contact</h6>
                <div class="row">
                  <div class="col-md-6">
                    <div class="row align-items-center mb-3">
                      <div class="col-md-4">
                        <label
                          class="form-label mb-md-0"
                          for="profile-emer-name"
                          >Contact Name</label
                        >
                      </div>
                      <div class="col-md-8">
                        <input
                          type="text"
                          id="profile-emer-name"
                          class="form-control"
                          name="Emergency_Contact_Name__c"
                          value={formState.Emergency_Contact_Name__c}
                          onchange={handleFieldChange}
                        />
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="row align-items-center mb-3">
                      <div class="col-md-4">
                        <label
                          class="form-label mb-md-0"
                          for="profile-emer-phone"
                          >Contact Phone</label
                        >
                      </div>
                      <div class="col-md-8">
                        <input
                          type="text"
                          id="profile-emer-phone"
                          class="form-control"
                          name="Emergency_Contact_Phone__c"
                          value={formState.Emergency_Contact_Phone__c}
                          onchange={handleFieldChange}
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Password section omitted as backend not ready -->

              <div class="d-flex align-items-center justify-content-end">
                <button
                  type="button"
                  class="btn btn-outline-light border me-3"
                  onclick={handleCancelEdit}
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  onclick={handleSave}
                  disabled={isSaving}
                >
                  <template if:true={isSaving}>Saving...</template>
                  <template if:false={isSaving}>Save Changes</template>
                </button>
              </div>
            </div>
          </template>

          <template if:false={profile}>
            <div class="d-flex justify-content-center p-5">
              <output class="spinner-border text-primary">
                <span class="visually-hidden">Loading...</span>
              </output>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</template>
