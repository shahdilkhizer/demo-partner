<template lwc:render-mode="light">
  <div class="page-wrapper performance-shell">
    <div class="content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Performance</p>
          <h1>My goals</h1>
          <p class="subtitle">Track and manage your professional objectives.</p>
        </div>
        <div class="header-actions">
          <button
            class="btn btn-outline"
            type="button"
            onclick={refreshGoals}
            disabled={isLoading}
          >
            <lightning-icon
              icon-name="utility:refresh"
              size="x-small"
              alternative-text=""
            ></lightning-icon>
            Refresh
          </button>
          <button class="btn btn-primary" type="button" onclick={handleNewGoal}>
            <lightning-icon
              icon-name="utility:add"
              size="x-small"
              variant="inverse"
              alternative-text=""
            ></lightning-icon>
            New goal
          </button>
        </div>
      </header>

      <section class="summary-grid" aria-label="Goal summary">
        <article class="summary-card">
          <span class="summary-icon orange"
            ><lightning-icon
              icon-name="utility:target"
              size="small"
              alternative-text=""
            ></lightning-icon
          ></span>
          <div><strong>{totalGoals}</strong><span>Total goals</span></div>
        </article>
        <article class="summary-card">
          <span class="summary-icon amber"
            ><lightning-icon
              icon-name="utility:sync"
              size="small"
              alternative-text=""
            ></lightning-icon
          ></span>
          <div><strong>{inProgressCount}</strong><span>In progress</span></div>
        </article>
        <article class="summary-card">
          <span class="summary-icon green"
            ><lightning-icon
              icon-name="utility:check"
              size="small"
              alternative-text=""
            ></lightning-icon
          ></span>
          <div><strong>{completedCount}</strong><span>Completed</span></div>
        </article>
        <article class="summary-card">
          <span class="summary-icon purple"
            ><lightning-icon
              icon-name="utility:trending"
              size="small"
              alternative-text=""
            ></lightning-icon
          ></span>
          <div>
            <strong>{averageProgress}%</strong><span>Average progress</span>
          </div>
        </article>
      </section>

      <section class="toolbar" aria-label="Goal filters">
        <div class="filter-pills" role="group" aria-label="Filter by status">
          <button
            class={allFilterClass}
            type="button"
            data-status="All"
            onclick={handleStatusFilterChange}
          >
            All
          </button>
          <button
            class={notStartedFilterClass}
            type="button"
            data-status="Not Started"
            onclick={handleStatusFilterChange}
          >
            Not started
          </button>
          <button
            class={inProgressFilterClass}
            type="button"
            data-status="In Progress"
            onclick={handleStatusFilterChange}
          >
            In progress
          </button>
          <button
            class={completedFilterClass}
            type="button"
            data-status="Completed"
            onclick={handleStatusFilterChange}
          >
            Completed
          </button>
        </div>
        <label class="search-field"
          ><span class="sr-only">Search goals</span
          ><lightning-icon
            icon-name="utility:search"
            size="x-small"
            alternative-text=""
          ></lightning-icon
          ><input
            type="search"
            value={searchTerm}
            oninput={handleSearch}
            placeholder="Search goals"
            aria-label="Search goals"
        /></label>
      </section>

      <template if:true={isLoading}>
        <section class="state-card" aria-live="polite">
          <lightning-spinner
            alternative-text="Loading goals"
            size="small"
          ></lightning-spinner
          ><span>Loading goals…</span>
        </section>
      </template>
      <template if:false={isLoading}>
        <template if:true={error}>
          <section class="state-card error-state" role="alert">
            <lightning-icon
              icon-name="utility:error"
              size="small"
              alternative-text=""
            ></lightning-icon
            ><strong>We could not load your goals.</strong><span>{error}</span
            ><button
              class="btn btn-primary"
              type="button"
              onclick={refreshGoals}
            >
              Try again
            </button>
          </section>
        </template>
        <template if:false={error}>
          <template if:true={hasGoals}>
            <section class="goal-grid" aria-label="Your goals">
              <template for:each={visibleGoals} for:item="goal">
                <article key={goal.Id} class="goal-card">
                  <div class="goal-card-header">
                    <span class={goal.badgeClass}>{goal.Status__c}</span
                    ><button
                      class="icon-button"
                      type="button"
                      data-id={goal.Id}
                      onclick={handleEditGoal}
                      title="Edit goal"
                    >
                      <lightning-icon
                        icon-name="utility:edit"
                        size="x-small"
                        alternative-text="Edit goal"
                      ></lightning-icon>
                    </button>
                  </div>
                  <button
                    class="goal-name"
                    type="button"
                    data-id={goal.Id}
                    onclick={handleEditGoal}
                  >
                    {goal.Name}
                  </button>
                  <p class="goal-description">{goal.Description__c}</p>
                  <div class="goal-details">
                    <span
                      ><lightning-icon
                        icon-name="utility:event"
                        size="xx-small"
                        alternative-text=""
                      ></lightning-icon
                      >Target {goal.formattedDate}</span
                    ><span>{goal.Progress__c}% complete</span>
                  </div>
                  <div
                    class="progress-track"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow={goal.Progress__c}
                    aria-label={goal.Name}
                  >
                    <span style={goal.progressStyle}></span>
                  </div>
                  <div class="slider-row">
                    <span>Update progress</span
                    ><lightning-slider
                      value={goal.Progress__c}
                      disabled={goal.progressDisabled}
                      label="Update goal progress"
                      min="0"
                      max="100"
                      step="5"
                      data-id={goal.Id}
                      onchange={handleProgressChange}
                      variant="label-hidden"
                    ></lightning-slider>
                  </div>
                </article>
              </template>
            </section>
          </template>
          <template if:false={hasGoals}>
            <section class="empty-state">
              <span class="empty-icon"
                ><lightning-icon
                  icon-name="utility:target"
                  size="medium"
                  alternative-text=""
                ></lightning-icon
              ></span>
              <h2>
                <template if:true={hasSearchOrFilter}
                  >No goals match this view</template
                ><template if:false={hasSearchOrFilter}>No goals yet</template>
              </h2>
              <p>
                <template if:true={hasSearchOrFilter}
                  >Try a different status or search term.</template
                ><template if:false={hasSearchOrFilter}
                  >Create a goal to track your professional growth and
                  achievements.</template
                >
              </p>
              <template if:false={hasSearchOrFilter}
                ><button
                  class="btn btn-primary"
                  type="button"
                  onclick={handleNewGoal}
                >
                  <lightning-icon
                    icon-name="utility:add"
                    size="x-small"
                    variant="inverse"
                    alternative-text=""
                  ></lightning-icon
                  >Create your first goal
                </button></template
              >
            </section>
          </template>
        </template>
      </template>
    </div>
  </div>

  <template if:true={isModalOpen}>
    <div
      class="modal-overlay"
      role="presentation"
      onclick={closeModal}
      onkeydown={handleModalKeydown}
    >
      <section
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="goal-modal-title"
        onclick={stopPropagation}
      >
        <header class="modal-header">
          <div>
            <p class="eyebrow">Performance</p>
            <h2 id="goal-modal-title">{modalTitle}</h2>
          </div>
          <button
            class="icon-button"
            type="button"
            onclick={closeModal}
            title="Close"
          >
            <lightning-icon
              icon-name="utility:close"
              size="x-small"
              alternative-text="Close"
            ></lightning-icon>
          </button>
        </header>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-field full">
              <label for="goalName">Goal name <span>*</span></label
              ><lightning-input
                id="goalName"
                label="Goal name"
                class="goal-input"
                type="text"
                name="Name"
                value={currentGoal.Name}
                onchange={handleInputChange}
                required
                variant="label-hidden"
                placeholder="Enter goal name"
              ></lightning-input>
            </div>
            <div class="form-field">
              <label for="targetDate">Target date <span>*</span></label
              ><lightning-input
                id="targetDate"
                label="Target date"
                class="goal-input"
                type="date"
                name="Target_Date__c"
                value={currentGoal.Target_Date__c}
                onchange={handleInputChange}
                required
                variant="label-hidden"
              ></lightning-input>
            </div>
            <div class="form-field">
              <label for="goalStatus">Status <span>*</span></label
              ><lightning-combobox
                id="goalStatus"
                label="Status"
                class="goal-input"
                name="Status__c"
                value={currentGoal.Status__c}
                options={goalStatusOptions}
                onchange={handleInputChange}
                required
                variant="label-hidden"
              ></lightning-combobox>
            </div>
            <div class="form-field full">
              <label for="goalDescription">Description</label
              ><lightning-textarea
                id="goalDescription"
                label="Description"
                name="Description__c"
                value={currentGoal.Description__c}
                onchange={handleInputChange}
                variant="label-hidden"
                placeholder="Describe your goal"
              ></lightning-textarea>
            </div>
            <div class="form-field full">
              <label for="goalProgress"
                >Progress ({currentGoal.Progress__c}%)</label
              ><lightning-slider
                id="goalProgress"
                label="Progress"
                data-field="Progress__c"
                value={currentGoal.Progress__c}
                min="0"
                max="100"
                step="5"
                onchange={handleInputChange}
                variant="label-hidden"
              ></lightning-slider>
            </div>
          </div>
        </div>
        <footer class="modal-footer">
          <button class="btn btn-outline" type="button" onclick={closeModal}>
            Cancel</button
          ><button
            class="btn btn-primary"
            type="button"
            onclick={handleSaveGoal}
            disabled={isSaving}
          >
            {saveButtonLabel}
          </button>
        </footer>
      </section>
    </div>
  </template>
</template>
