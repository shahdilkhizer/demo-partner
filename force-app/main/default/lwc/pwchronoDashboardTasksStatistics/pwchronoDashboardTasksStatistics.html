<template>
  <div class="card flex-fill">
    <div
      class="card-header pb-2 d-flex align-items-center justify-content-between flex-wrap"
    >
      <h5 class="mb-2">Tasks Statistics</h5>
      <div class="d-flex align-items-center">
        <div class="dropdown mb-2">
          <a
            href="javascript:void(0);"
            class="btn btn-white border btn-sm d-inline-flex align-items-center"
            data-bs-toggle="dropdown"
          >
            <i class="ti ti-calendar-event me-1" aria-hidden="true"></i
            >This Week
          </a>
          <ul class="dropdown-menu dropdown-menu-end p-3">
            <li>
              <a href="javascript:void(0);" class="dropdown-item rounded-1"
                >This Month</a
              >
            </li>
            <li>
              <a href="javascript:void(0);" class="dropdown-item rounded-1"
                >This Week</a
              >
            </li>
            <li>
              <a href="javascript:void(0);" class="dropdown-item rounded-1"
                >Today</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="chartjs-wrapper-demo position-relative mb-4">
        <canvas class="chart" lwc:dom="manual"></canvas>
        <div class="position-absolute text-center attendance-canvas">
          <p class="fs-13 mb-1">Total Tasks</p>
          <h3>{totalTasksDisplay}</h3>
        </div>
      </div>
      <div class="d-flex align-items-center flex-wrap">
        <div class="border-end text-center me-2 pe-2 mb-3">
          <p class="fs-13 d-inline-flex align-items-center mb-1">
            <i
              class="ti ti-circle-filled fs-10 me-1 text-warning"
              aria-hidden="true"
            ></i
            >Ongoing
          </p>
          <h5>{ongoingPct}%</h5>
        </div>
        <div class="border-end text-center me-2 pe-2 mb-3">
          <p class="fs-13 d-inline-flex align-items-center mb-1">
            <i
              class="ti ti-circle-filled fs-10 me-1 text-info"
              aria-hidden="true"
            ></i
            >On Hold
          </p>
          <h5>{onHoldPct}%</h5>
        </div>
        <div class="border-end text-center me-2 pe-2 mb-3">
          <p class="fs-13 d-inline-flex align-items-center mb-1">
            <i
              class="ti ti-circle-filled fs-10 me-1 text-danger"
              aria-hidden="true"
            ></i
            >Overdue
          </p>
          <h5>{overduePct}%</h5>
        </div>
        <div class="text-center me-2 pe-2 mb-3">
          <p class="fs-13 d-inline-flex align-items-center mb-1">
            <i
              class="ti ti-circle-filled fs-10 me-1 text-success"
              aria-hidden="true"
            ></i
            >Completed
          </p>
          <h5>{completedPct}%</h5>
        </div>
      </div>
      <div
        class="bg-dark br-5 p-3 pb-0 d-flex align-items-center justify-content-between"
      >
        <div class="mb-2">
          <h4 class="text-success">{summaryLine}</h4>
          <p class="fs-13 mb-0">Overall Tasks Summary</p>
        </div>
        <a
          href="javascript:void(0);"
          class="btn btn-sm btn-light mb-2 text-nowrap"
          >View All</a
        >
      </div>
    </div>
  </div>

  <!-- Edit Timesheet -->
  <div class="modal fade" id="edit_timesheet">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Edit Todays Work</h4>
          <button
            type="button"
            class="btn-close custom-btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          >
            <i class="ti ti-x"></i>
          </button>
        </div>
        <form action="timesheets.html">
          <div class="modal-body pb-0">
            <div class="row">
              <div class="col-md-12">
                <div class="mb-3">
                  <label class="form-label"
                    >Project <span class="text-danger"> *</span></label
                  >
                  <select class="select">
                    <option>Select</option>
                    <option selected>Office Management</option>
                    <option>Project Management</option>
                    <option>Hospital Administration</option>
                  </select>
                </div>
              </div>
              <div class="col-md-12">
                <div class="mb-3">
                  <label class="form-label"
                    >Deadline <span class="text-danger"> *</span></label
                  >
                  <div class="input-icon-end position-relative">
                    <input
                      type="text"
                      class="form-control datetimepicker"
                      placeholder="dd/mm/yyyy"
                      value="14 Jan 2024"
                    />
                    <span class="input-icon-addon">
                      <i class="ti ti-calendar text-gray-7"></i>
                    </span>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label"
                    >Total Hours <span class="text-danger"> *</span></label
                  >
                  <input type="text" class="form-control" value="32" />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label"
                    >Remaining Hours<span class="text-danger"> *</span></label
                  >
                  <input type="text" class="form-control" value="8" />
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label"
                    >Date<span class="text-danger"> *</span></label
                  >
                  <div class="input-icon-end position-relative">
                    <input
                      type="text"
                      class="form-control datetimepicker"
                      placeholder="dd/mm/yyyy"
                      value="14 Apr 2024"
                    />
                    <span class="input-icon-addon">
                      <i class="ti ti-calendar text-gray-7"></i>
                    </span>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label"
                    >Hours<span class="text-danger">*</span></label
                  >
                  <input type="text" class="form-control" value="13" />
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light me-2"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal fade" id="delete_modal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <span class="avatar avatar-xl bg-transparent-danger text-danger mb-3">
            <i class="ti ti-trash-x fs-36"></i>
          </span>
          <h4 class="mb-1">Confirm Delete</h4>
          <p class="mb-3">
            You want to delete all the marked items, this cant be undone once
            you delete.
          </p>
          <div class="d-flex justify-content-center">
            <a
              href="javascript:void(0);"
              class="btn btn-light me-3"
              data-bs-dismiss="modal"
              >Cancel</a
            >
            <a href="timesheets.html" class="btn btn-danger">Yes, Delete</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
