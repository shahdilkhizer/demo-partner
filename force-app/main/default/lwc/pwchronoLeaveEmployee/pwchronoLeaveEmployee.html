<template>
  <div class="page-wrapper">
    <div class="content">
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2">
          <h2 class="mb-1">My Leaves</h2>
          <nav aria-label="Breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">Employee</li>
              <li class="breadcrumb-item active" aria-current="page">
                My Leaves
              </li>
            </ol>
          </nav>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <button
            class="btn btn-white"
            type="button"
            onclick={handleExport}
            disabled={isLoading}
          >
            <i class="ti ti-file-export me-1" aria-hidden="true"></i>Export CSV
          </button>
          <button
            class="btn btn-primary"
            type="button"
            onclick={handleNewLeaveRequest}
          >
            <i class="ti ti-circle-plus me-1" aria-hidden="true"></i>New Leave
          </button>
        </div>
      </div>
      <template if:true={balanceError}>
        <div class="alert alert-warning" role="status">
          {balanceError}
          <button
            type="button"
            class="btn btn-sm btn-white ms-2"
            onclick={loadLeaveBalance}
          >
            Retry balances
          </button>
        </div>
      </template>
      <div class="row">
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-dark-transparent"
                ><i class="ti ti-calendar fs-24" aria-hidden="true"></i
              ></span>
              <div>
                <p class="mb-1">Annual Allocation</p>
                <h3 class="mb-0">{annualLeaveCount}</h3>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-info-transparent"
                ><i class="ti ti-heart fs-24" aria-hidden="true"></i
              ></span>
              <div>
                <p class="mb-1">Medical Allocation</p>
                <h3 class="mb-0">{medicalLeaveCount}</h3>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-warning-transparent"
                ><i class="ti ti-calendar-event fs-24" aria-hidden="true"></i
              ></span>
              <div>
                <p class="mb-1">Other Allocation</p>
                <h3 class="mb-0">{otherLeaveCount}</h3>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-success-transparent"
                ><i class="ti ti-calendar-check fs-24" aria-hidden="true"></i
              ></span>
              <div>
                <p class="mb-1">Total Remaining</p>
                <h3 class="mb-0">{remainingLeaveCount}</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div
          class="card-header d-flex align-items-center justify-content-between flex-wrap gap-3"
        >
          <h5 class="mb-0">
            Leave Requests
            <span class="badge bg-primary-transparent ms-2"
              >{visibleLeaves.length}</span
            >
          </h5>
          <div class="d-flex flex-wrap align-items-end gap-2">
            <div>
              <label class="form-label fs-12 mb-1" for="leave-filter-start"
                >From date</label
              ><input
                id="leave-filter-start"
                type="date"
                name="startDate"
                class="form-control"
                value={startDate}
                onchange={handleDateFilter}
              />
            </div>
            <div>
              <label class="form-label fs-12 mb-1" for="leave-filter-end"
                >To date</label
              ><input
                id="leave-filter-end"
                type="date"
                name="endDate"
                class="form-control"
                value={endDate}
                min={startDate}
                onchange={handleDateFilter}
              />
            </div>
            <div>
              <label class="form-label fs-12 mb-1" for="leave-filter-status"
                >Status</label
              ><select
                id="leave-filter-status"
                class="form-select"
                name="statusFilter"
                onchange={handleStatusSelect}
              >
                <option value="All">All statuses</option>
                <option value="Submitted">Submitted</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
            <button
              class="btn btn-white"
              type="button"
              onclick={handleResetFilters}
            >
              Reset
            </button>
          </div>
        </div>
        <div class="card-body p-0">
          <div
            class="p-3 border-bottom d-flex justify-content-between align-items-center gap-3 flex-wrap"
          >
            <p class="mb-0 text-muted">Your submitted leave requests</p>
            <input
              class="form-control leave-search"
              type="search"
              placeholder="Search leave requests"
              aria-label="Search leave requests"
              value={searchTerm}
              oninput={handleSearch}
            />
          </div>
          <template if:true={loadError}
            ><div class="alert alert-danger m-3" role="alert">
              {loadError}<button
                class="btn btn-sm btn-white ms-2"
                type="button"
                onclick={loadLeaveRequests}
              >
                Retry
              </button>
            </div></template
          >
          <template if:true={isLoading}
            ><div class="text-center p-5" role="status">
              <span class="spinner-border text-primary"></span>
              <p class="mt-2 mb-0">Loading leave requests…</p>
            </div></template
          >
          <template if:true={showLeaveTable}>
            <div class="table-responsive">
              <table class="table mb-0">
                <thead class="thead-light">
                  <tr>
                    <th scope="col">Leave Type</th>
                    <th scope="col">From</th>
                    <th scope="col">To</th>
                    <th scope="col">Days</th>
                    <th scope="col">Reason</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={visibleLeaves} for:item="leave"
                    ><tr key={leave.Id}>
                      <td class="fw-medium text-dark">{leave.leaveTypeName}</td>
                      <td>{leave.formattedStartDate}</td>
                      <td>{leave.formattedEndDate}</td>
                      <td>{leave.totalDays}</td>
                      <td class="leave-reason">{leave.Reason__c}</td>
                      <td>
                        <span class={leave.statusClass}>{leave.Status__c}</span>
                      </td>
                    </tr></template
                  >
                  <template if:false={hasVisibleLeaves}
                    ><tr>
                      <td colspan="6" class="text-center py-5">
                        <i
                          class="ti ti-calendar-off fs-32 text-muted"
                          aria-hidden="true"
                        ></i>
                        <h6 class="mt-3">No leave requests found</h6>
                        <p class="mb-0">
                          Change the filters or use New Leave to submit a
                          request.
                        </p>
                      </td>
                    </tr></template
                  >
                </tbody>
              </table>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
  <template if:true={isNewLeaveModalOpen}>
    <div
      class="modal fade show d-block leave-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="new-leave-title"
      onkeydown={handleDialogKeydown}
      tabindex="-1"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" onsubmit={handleSubmitLeave}>
          <div class="modal-header">
            <h4 class="modal-title" id="new-leave-title">New Leave Request</h4>
            <button
              class="btn-close"
              type="button"
              aria-label="Close leave request"
              onclick={handleCloseLeaveModal}
              disabled={isSavingLeave}
            ></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12">
                <label for="new-leave-type" class="form-label"
                  >Leave Type <span class="text-danger">*</span></label
                ><select
                  id="new-leave-type"
                  class="form-select"
                  name="leaveTypeId"
                  onchange={handleNewLeaveFormChange}
                  required
                >
                  <option value="">Select leave type</option>
                  <template for:each={leaveTypes} for:item="type"
                    ><option key={type.value} value={type.value}>
                      {type.label}
                    </option></template
                  >
                </select>
              </div>
              <div class="col-md-6">
                <label for="new-leave-start" class="form-label"
                  >From Date <span class="text-danger">*</span></label
                ><input
                  id="new-leave-start"
                  class="form-control"
                  type="date"
                  name="fromDate"
                  value={newLeaveForm.fromDate}
                  onchange={handleNewLeaveFormChange}
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="new-leave-end" class="form-label"
                  >To Date <span class="text-danger">*</span></label
                ><input
                  id="new-leave-end"
                  class="form-control"
                  type="date"
                  name="toDate"
                  min={newLeaveForm.fromDate}
                  value={newLeaveForm.toDate}
                  onchange={handleNewLeaveFormChange}
                  required
                />
              </div>
              <div class="col-12">
                <label for="new-leave-reason" class="form-label">Reason</label
                ><textarea
                  id="new-leave-reason"
                  class="form-control"
                  name="reason"
                  rows="3"
                  onchange={handleNewLeaveFormChange}
                ></textarea>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input
                    id="new-leave-half"
                    class="form-check-input"
                    type="checkbox"
                    name="halfDay"
                    checked={newLeaveForm.halfDay}
                    onchange={handleNewLeaveFormChange}
                  /><label class="form-check-label" for="new-leave-half"
                    >Half Day</label
                  >
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-white"
              onclick={handleCloseLeaveModal}
              disabled={isSavingLeave}
            >
              Cancel</button
            ><button
              type="submit"
              class="btn btn-primary"
              disabled={isSavingLeave}
            >
              <template if:true={isSavingLeave}>Submitting…</template
              ><template if:false={isSavingLeave}>Submit Request</template>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>
</template>
