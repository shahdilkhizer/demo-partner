<template lwc:render-mode="light">
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- PwChrono Standard Header -->
      <div
        class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
      >
        <div class="my-auto mb-2 header-text-wrap">
          <h2 class="training-portal-title">Training Portal</h2>
          <p class="training-portal-subtitle">
            Access training programs and resources
          </p>
        </div>
        <div class="d-flex my-xl-auto right-content"></div>
      </div>

      <div class="training-card">
        <!-- Navigation Tabs with brand underline -->
        <div class="tabs-navigation" role="tablist">
          <button
            type="button"
            class={upcomingTabClass}
            onclick={handleSelectUpcomingTab}
            role="tab"
            aria-selected={isUpcomingTab}
          >
            <lightning-icon icon-name="utility:event" size="x-small"></lightning-icon>
            Upcoming Trainings
            <span class="tab-badge">{upcomingCount}</span>
          </button>
          <button
            type="button"
            class={registrationsTabClass}
            onclick={handleSelectRegistrationsTab}
            role="tab"
            aria-selected={isRegistrationsTab}
          >
            <lightning-icon icon-name="utility:bookmark" size="x-small"></lightning-icon>
            My Registrations
            <span class="tab-badge">{registrationsCount}</span>
          </button>
        </div>

        <!-- Tab 1: Upcoming Trainings -->
        <template if:true={isUpcomingTab}>
          <div>
            <template if:true={hasUpcomingTrainings}>
              <div class="training-grid">
                <template for:each={upcomingTrainings} for:item="training">
                  <div key={training.Id} class="training-item-card">
                    <div>
                      <h3 class="training-item-title">
                        {training.Training_Program__r.Name}
                      </h3>
                      <p class="training-item-desc">
                        {training.Training_Program__r.Description__c}
                      </p>
                      <div class="training-details-grid">
                        <div>
                          <p class="training-detail-label">Date</p>
                          <p class="training-detail-value">
                            <lightning-formatted-date-time
                              value={training.Start_Date__c}
                            ></lightning-formatted-date-time>
                          </p>
                        </div>
                        <div>
                          <p class="training-detail-label">Location</p>
                          <p class="training-detail-value">
                            {training.Location__c}
                          </p>
                        </div>
                        <div>
                          <p class="training-detail-label">Trainer</p>
                          <p class="training-detail-value">
                            {training.Training_Program__r.Trainer__c}
                          </p>
                        </div>
                        <div>
                          <p class="training-detail-label">Duration</p>
                          <p class="training-detail-value">
                            {training.Training_Program__r.Duration_Hours__c} Hours
                          </p>
                        </div>
                      </div>
                    </div>
                    <div class="training-card-footer">
                      <lightning-button
                        label="Register"
                        variant="brand"
                        onclick={handleRegister}
                        data-id={training.Id}
                      ></lightning-button>
                    </div>
                  </div>
                </template>
              </div>
            </template>
            <template if:false={hasUpcomingTrainings}>
              <div class="empty-state-box">
                <div class="empty-icon-circle">
                  <lightning-icon
                    icon-name="utility:education"
                    size="medium"
                  ></lightning-icon>
                </div>
                <h4 class="empty-state-title">No upcoming trainings scheduled</h4>
                <p class="empty-state-subtitle">
                  New training programs and events will appear here when scheduled.
                </p>
              </div>
            </template>
          </div>
        </template>

        <!-- Tab 2: My Registrations -->
        <template if:true={isRegistrationsTab}>
          <div>
            <!-- Loading State -->
            <template if:true={isRegistrationsLoading}>
              <div class="loading-box">
                <div class="loading-spinner-circle"></div>
                <p class="empty-state-subtitle">Loading registrations...</p>
              </div>
            </template>

            <template if:false={isRegistrationsLoading}>
              <!-- Filters -->
              <div class="registrations-filter-bar">
                <div class="search-filter-wrap">
                  <div class="search-input-icon">
                    <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                  </div>
                  <input
                    id="searchFilter"
                    type="text"
                    class="search-filter-input"
                    placeholder="Search registered programs..."
                    value={searchFilter}
                    oninput={handleSearchFilter}
                  />
                </div>
                <div class="page-size-wrap">
                  <label for="pageSizeSelect">Per Page:</label>
                  <lightning-combobox
                    id="pageSizeSelect"
                    label="Per Page"
                    value={pageSizeValue}
                    options={pageSizeOptions}
                    onchange={handlePageSizeChange}
                    variant="label-hidden"
                  >
                  </lightning-combobox>
                </div>
              </div>

              <template if:true={hasMyRegistrations}>
                <div class="registrations-table-container">
                  <lightning-datatable
                    key-field="Id"
                    data={myRegistrations}
                    columns={columns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column
                  ></lightning-datatable>
                </div>

                <!-- Pagination -->
                <div class="registrations-pagination">
                  <span class="pagination-info">{paginationInfo}</span>
                  <div class="pagination-controls">
                    <lightning-button-icon
                      icon-name="utility:chevronleft"
                      alternative-text="Previous"
                      onclick={handlePrevPage}
                      disabled={isPrevDisabled}
                      variant="border-filled"
                    >
                    </lightning-button-icon>
                    <span class="page-indicator">Page {currentPage} of {totalPages}</span>
                    <lightning-button-icon
                      icon-name="utility:chevronright"
                      alternative-text="Next"
                      onclick={handleNextPage}
                      disabled={isNextDisabled}
                      variant="border-filled"
                    >
                    </lightning-button-icon>
                  </div>
                </div>
              </template>
              <template if:false={hasMyRegistrations}>
                <div class="empty-state-box">
                  <div class="empty-icon-circle">
                    <lightning-icon
                      icon-name="utility:check"
                      size="medium"
                    ></lightning-icon>
                  </div>
                  <h4 class="empty-state-title">No registrations found</h4>
                  <p class="empty-state-subtitle">
                    You have not registered for any upcoming or past trainings.
                  </p>
                </div>
              </template>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
