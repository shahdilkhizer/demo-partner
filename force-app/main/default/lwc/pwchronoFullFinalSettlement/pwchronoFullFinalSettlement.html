<template lwc:render-mode="light">
  <div class="page-wrapper pwchrono-lifecycle-page">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <div class="container-fluid py-4">
        <!-- Page Header -->
        <div
          class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4"
        >
          <div>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-1">
                <li class="breadcrumb-item small">
                  <a href="#" onclick={handleHome}>Home</a>
                </li>
                <li class="breadcrumb-item active small" aria-current="page">
                  Full &amp; Final Settlement
                </li>
              </ol>
            </nav>
            <h4 class="fw-bold mb-0">
              <i
                class="fa-solid fa-file-invoice-dollar fa-fw me-2 text-primary"
              ></i>
              Full &amp; Final Settlement
            </h4>
          </div>
          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-outline-secondary"
              onclick={handleExport}
              disabled={isLoading}
              data-action="export"
            >
              <i class="fa-solid fa-file-csv fa-fw me-1"></i> Export CSV
            </button>
            <template lwc:if={canCreate}>
              <button
                type="button"
                class="btn btn-primary"
                onclick={handleNew}
                data-action="create"
              >
                <i class="fa-solid fa-plus fa-fw me-1"></i> New Settlement
              </button>
            </template>
          </div>
        </div>

        <!-- Metric Cards -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
              <div class="fs-4 fw-bold text-dark" data-metric="total">
                {totalCount}
              </div>
              <div class="small text-muted">Total</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
              <div class="fs-4 fw-bold text-secondary" data-metric="draft">
                {draftCount}
              </div>
              <div class="small text-muted">Draft</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
              <div class="fs-4 fw-bold text-warning" data-metric="submitted">
                {submittedCount}
              </div>
              <div class="small text-muted">Submitted</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center py-3">
              <div class="fs-4 fw-bold text-success" data-metric="paid">
                {paidCount}
              </div>
              <div class="small text-muted">Paid</div>
            </div>
          </div>
        </div>

        <!-- Filter + Table Card -->
        <div class="card border-0 shadow-sm">
          <div
            class="card-header bg-white d-flex align-items-center justify-content-between py-3"
          >
            <h6 class="mb-0 fw-semibold">Settlement List</h6>
            <select
              class="form-select form-select-sm w-auto"
              onchange={handleFilterChange}
              aria-label="Filter by status"
            >
              <template for:each={statusOptions} for:item="opt">
                <option
                  key={opt.value}
                  value={opt.value}
                  selected={opt.selected}
                >
                  {opt.label}
                </option>
              </template>
            </select>
          </div>
          <div class="card-body p-0">
            <!-- Loading -->
            <template lwc:if={isLoading}>
              <div class="text-center py-5 text-muted" data-id="loading">
                <i class="fa-solid fa-spinner fa-spin fa-lg me-2"></i>
                Loading...
              </div>
            </template>

            <!-- Error -->
            <template lwc:if={loadError}>
              <div
                class="alert alert-danger m-3 d-flex align-items-center justify-content-between"
                role="alert"
                data-id="load-error"
              >
                <div>
                  <i class="fa-solid fa-circle-exclamation fa-fw me-2"></i
                  >{loadError}
                </div>
                <button
                  type="button"
                  class="btn btn-sm btn-outline-danger"
                  onclick={handleRetry}
                >
                  <i class="fa-solid fa-rotate-right fa-fw me-1"></i>Retry
                </button>
              </div>
            </template>

            <!-- Table -->
            <template lwc:if={showTable}>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th class="ps-3">Settlement #</th>
                      <th>Employee</th>
                      <th>Relieving Date</th>
                      <th>Department</th>
                      <th class="text-end">Total Payable</th>
                      <th class="text-end">Total Receivable</th>
                      <th class="text-end">Net Payable</th>
                      <th>Status</th>
                      <th class="text-end pe-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template lwc:if={hasRecords}>
                      <template for:each={enrichedSettlements} for:item="s">
                        <tr key={s.Id} data-row={s.Id}>
                          <td class="ps-3 fw-semibold text-primary">
                            {s.Name}
                          </td>
                          <td>{s.employeeName}</td>
                          <td>{s.relievingDateFormatted}</td>
                          <td>{s.deptName}</td>
                          <td class="text-end">{s.totalPayableFormatted}</td>
                          <td class="text-end">{s.totalReceivableFormatted}</td>
                          <td class="text-end fw-semibold">
                            {s.netPayableFormatted}
                          </td>
                          <td>
                            <span class={s.badgeClass}>{s.Status__c}</span>
                          </td>
                          <td class="text-end pe-3 text-nowrap">
                            <button
                              type="button"
                              class="btn btn-sm btn-outline-secondary me-1"
                              title="View"
                              aria-label="View settlement"
                              data-id={s.Id}
                              data-action="view"
                              onclick={handleView}
                            >
                              <i class="fa-solid fa-eye fa-fw"></i>
                            </button>
                            <template lwc:if={s.canEdit}>
                              <button
                                type="button"
                                class="btn btn-sm btn-outline-primary me-1"
                                title="Edit"
                                aria-label="Edit settlement"
                                data-id={s.Id}
                                data-action="edit"
                                onclick={handleEdit}
                                disabled={s.isBusy}
                              >
                                <i class="fa-solid fa-pen fa-fw"></i>
                              </button>
                            </template>
                            <template lwc:if={s.canSubmit}>
                              <button
                                type="button"
                                class="btn btn-sm btn-outline-warning me-1"
                                title="Submit"
                                aria-label="Submit settlement"
                                data-id={s.Id}
                                data-status="Submitted"
                                data-action="submit"
                                onclick={handleStatusAction}
                                disabled={s.isBusy}
                              >
                                <i class="fa-solid fa-paper-plane fa-fw"></i>
                              </button>
                            </template>
                            <template lwc:if={s.canPay}>
                              <button
                                type="button"
                                class="btn btn-sm btn-outline-success me-1"
                                title="Mark as paid"
                                aria-label="Mark settlement as paid"
                                data-id={s.Id}
                                data-status="Paid"
                                data-action="pay"
                                onclick={handleStatusAction}
                                disabled={s.isBusy}
                              >
                                <i
                                  class="fa-solid fa-money-check-dollar fa-fw"
                                ></i>
                              </button>
                            </template>
                            <template lwc:if={s.canCancel}>
                              <button
                                type="button"
                                class="btn btn-sm btn-outline-secondary me-1"
                                title="Cancel"
                                aria-label="Cancel settlement"
                                data-id={s.Id}
                                data-status="Cancelled"
                                data-action="cancel"
                                onclick={handleStatusAction}
                                disabled={s.isBusy}
                              >
                                <i class="fa-solid fa-ban fa-fw"></i>
                              </button>
                            </template>
                            <template lwc:if={s.canDelete}>
                              <button
                                type="button"
                                class="btn btn-sm btn-outline-danger"
                                title="Delete"
                                aria-label="Delete settlement"
                                data-id={s.Id}
                                data-action="delete"
                                onclick={handleDelete}
                                disabled={s.isBusy}
                              >
                                <i class="fa-solid fa-trash fa-fw"></i>
                              </button>
                            </template>
                          </td>
                        </tr>
                      </template>
                    </template>
                    <template lwc:else>
                      <tr>
                        <td
                          colspan="9"
                          class="text-center text-muted py-4"
                          data-id="empty"
                        >
                          No settlement records found.
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- ─── Create / Edit Modal ─────────────────────────────────────────── -->
      <template lwc:if={showModal}>
        <div
          class="modal d-block"
          tabindex="-1"
          role="dialog"
          aria-modal="true"
          style="background: rgba(0, 0, 0, 0.45)"
        >
          <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-semibold">
                  <i
                    class="fa-solid fa-file-invoice-dollar fa-fw me-2 text-primary"
                  ></i>
                  {modalTitle}
                  <template lwc:if={isEditMode}>
                    <span class={modalStatusBadgeClass}
                      >{currentRecord.Status__c}</span
                    >
                  </template>
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  aria-label="Close"
                  onclick={handleModalClose}
                ></button>
              </div>
              <div class="modal-body">
                <template lwc:if={modalError}>
                  <div class="alert alert-danger" data-id="modal-error">
                    {modalError}
                  </div>
                </template>

                <!-- Employee Info -->
                <h6 class="fw-semibold text-muted mb-3">
                  Employee Information
                </h6>
                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <label class="form-label">Linked Separation</label>
                    <select
                      class="form-select"
                      data-field="Separation__c"
                      onchange={handleFieldChange}
                    >
                      <option value="">-- Select Separation --</option>
                      <template for:each={separationOptions} for:item="s">
                        <option
                          key={s.value}
                          value={s.value}
                          selected={s.selected}
                        >
                          {s.label}
                        </option>
                      </template>
                    </select>
                    <div class="form-text">
                      Blank employee, dates, department and designation are
                      filled from the separation.
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label"
                      >Employee <span class="text-danger">*</span></label
                    >
                    <select
                      class="form-select"
                      data-field="Employee__c"
                      onchange={handleFieldChange}
                    >
                      <option value="">-- Select Employee --</option>
                      <template for:each={employeeOptions} for:item="e">
                        <option
                          key={e.value}
                          value={e.value}
                          selected={e.selected}
                        >
                          {e.label}
                        </option>
                      </template>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Employee Name</label>
                    <input
                      type="text"
                      class="form-control"
                      value={currentRecord.Employee_Name__c}
                      data-field="Employee_Name__c"
                      onchange={handleFieldChange}
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Company</label>
                    <input
                      type="text"
                      class="form-control"
                      value={currentRecord.Company__c}
                      data-field="Company__c"
                      onchange={handleFieldChange}
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <select
                      class="form-select"
                      data-field="Department__c"
                      onchange={handleFieldChange}
                    >
                      <option value="">-- Select Department --</option>
                      <template for:each={departmentOptions} for:item="d">
                        <option
                          key={d.value}
                          value={d.value}
                          selected={d.selected}
                        >
                          {d.label}
                        </option>
                      </template>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Designation</label>
                    <select
                      class="form-select"
                      data-field="Designation__c"
                      onchange={handleFieldChange}
                    >
                      <option value="">-- Select Designation --</option>
                      <template for:each={designationOptions} for:item="d">
                        <option
                          key={d.value}
                          value={d.value}
                          selected={d.selected}
                        >
                          {d.label}
                        </option>
                      </template>
                    </select>
                  </div>
                </div>

                <!-- Dates -->
                <h6 class="fw-semibold text-muted mb-3">Dates</h6>
                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <label class="form-label">Date of Joining</label>
                    <input
                      type="date"
                      class="form-control"
                      value={currentRecord.Date_of_Joining__c}
                      data-field="Date_of_Joining__c"
                      onchange={handleFieldChange}
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label"
                      >Relieving Date <span class="text-danger">*</span></label
                    >
                    <input
                      type="date"
                      class="form-control"
                      value={currentRecord.Relieving_Date__c}
                      data-field="Relieving_Date__c"
                      onchange={handleFieldChange}
                    />
                  </div>
                </div>

                <!-- Payables Table -->
                <div
                  class="d-flex align-items-center justify-content-between mb-2"
                >
                  <h6 class="fw-semibold text-muted mb-0">
                    <i
                      class="fa-solid fa-circle-plus fa-fw me-1 text-success"
                    ></i>
                    Payable Items
                  </h6>
                  <button
                    type="button"
                    class="btn btn-sm btn-outline-success"
                    onclick={handleAddPayable}
                    data-action="add-payable"
                  >
                    <i class="fa-solid fa-plus fa-fw me-1"></i> Add Row
                  </button>
                </div>
                <div class="table-responsive mb-4">
                  <table class="table table-bordered table-sm align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Component</th>
                        <th>Reference Document</th>
                        <th>Account</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th class="text-center">Remove</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template lwc:if={hasPayableLines}>
                        <template for:each={payableLinesView} for:item="p">
                          <tr key={p._key} data-line={p._key}>
                            <td>
                              <input
                                type="text"
                                class="form-control form-control-sm"
                                value={p.Component__c}
                                data-key={p._key}
                                data-field="Component__c"
                                data-table="payable"
                                onchange={handleLineChange}
                                placeholder="e.g. Basic Salary"
                              />
                            </td>
                            <td>
                              <input
                                type="text"
                                class="form-control form-control-sm"
                                value={p.Reference_Document__c}
                                data-key={p._key}
                                data-field="Reference_Document__c"
                                data-table="payable"
                                onchange={handleLineChange}
                              />
                            </td>
                            <td>
                              <input
                                type="text"
                                class="form-control form-control-sm"
                                value={p.Account__c}
                                data-key={p._key}
                                data-field="Account__c"
                                data-table="payable"
                                onchange={handleLineChange}
                              />
                            </td>
                            <td>
                              <input
                                type="number"
                                class="form-control form-control-sm"
                                value={p.Amount__c}
                                data-key={p._key}
                                data-field="Amount__c"
                                data-table="payable"
                                onchange={handleLineChange}
                                min="0"
                                step="0.01"
                              />
                            </td>
                            <td>
                              <select
                                class="form-select form-select-sm"
                                data-key={p._key}
                                data-field="Status__c"
                                data-table="payable"
                                onchange={handleLineChange}
                              >
                                <template
                                  for:each={p.statusOptions}
                                  for:item="opt"
                                >
                                  <option
                                    key={opt.value}
                                    value={opt.value}
                                    selected={opt.selected}
                                  >
                                    {opt.label}
                                  </option>
                                </template>
                              </select>
                            </td>
                            <td class="text-center">
                              <button
                                type="button"
                                class="btn btn-sm btn-outline-danger"
                                data-key={p._key}
                                data-table="payable"
                                onclick={handleRemoveLine}
                                aria-label="Remove payable line"
                              >
                                <i class="fa-solid fa-times fa-fw"></i>
                              </button>
                            </td>
                          </tr>
                        </template>
                      </template>
                      <template lwc:else>
                        <tr>
                          <td
                            colspan="6"
                            class="text-center text-muted small py-2"
                          >
                            No payable items. Click "Add Row" to begin.
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>

                <!-- Receivables Table -->
                <div
                  class="d-flex align-items-center justify-content-between mb-2"
                >
                  <h6 class="fw-semibold text-muted mb-0">
                    <i
                      class="fa-solid fa-circle-minus fa-fw me-1 text-danger"
                    ></i>
                    Receivable Items
                  </h6>
                  <button
                    type="button"
                    class="btn btn-sm btn-outline-danger"
                    onclick={handleAddReceivable}
                    data-action="add-receivable"
                  >
                    <i class="fa-solid fa-plus fa-fw me-1"></i> Add Row
                  </button>
                </div>
                <div class="table-responsive">
                  <table class="table table-bordered table-sm align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Component</th>
                        <th>Reference Document</th>
                        <th>Account</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th class="text-center">Remove</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template lwc:if={hasReceivableLines}>
                        <template for:each={receivableLinesView} for:item="r">
                          <tr key={r._key} data-line={r._key}>
                            <td>
                              <input
                                type="text"
                                class="form-control form-control-sm"
                                value={r.Component__c}
                                data-key={r._key}
                                data-field="Component__c"
                                data-table="receivable"
                                onchange={handleLineChange}
                                placeholder="e.g. Laptop Recovery"
                              />
                            </td>
                            <td>
                              <input
                                type="text"
                                class="form-control form-control-sm"
                                value={r.Reference_Document__c}
                                data-key={r._key}
                                data-field="Reference_Document__c"
                                data-table="receivable"
                                onchange={handleLineChange}
                              />
                            </td>
                            <td>
                              <input
                                type="text"
                                class="form-control form-control-sm"
                                value={r.Account__c}
                                data-key={r._key}
                                data-field="Account__c"
                                data-table="receivable"
                                onchange={handleLineChange}
                              />
                            </td>
                            <td>
                              <input
                                type="number"
                                class="form-control form-control-sm"
                                value={r.Amount__c}
                                data-key={r._key}
                                data-field="Amount__c"
                                data-table="receivable"
                                onchange={handleLineChange}
                                min="0"
                                step="0.01"
                              />
                            </td>
                            <td>
                              <select
                                class="form-select form-select-sm"
                                data-key={r._key}
                                data-field="Status__c"
                                data-table="receivable"
                                onchange={handleLineChange}
                              >
                                <template
                                  for:each={r.statusOptions}
                                  for:item="opt"
                                >
                                  <option
                                    key={opt.value}
                                    value={opt.value}
                                    selected={opt.selected}
                                  >
                                    {opt.label}
                                  </option>
                                </template>
                              </select>
                            </td>
                            <td class="text-center">
                              <button
                                type="button"
                                class="btn btn-sm btn-outline-danger"
                                data-key={r._key}
                                data-table="receivable"
                                onclick={handleRemoveLine}
                                aria-label="Remove receivable line"
                              >
                                <i class="fa-solid fa-times fa-fw"></i>
                              </button>
                            </td>
                          </tr>
                        </template>
                      </template>
                      <template lwc:else>
                        <tr>
                          <td
                            colspan="6"
                            class="text-center text-muted small py-2"
                          >
                            No receivable items. Click "Add Row" to begin.
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Net Summary Footer -->
              <div class="border-top px-4 py-3 bg-light">
                <div class="row justify-content-end g-2 text-end">
                  <div class="col-auto">
                    <span class="text-muted small">Total Payable:</span>
                    <span class="fw-semibold ms-2" data-id="preview-payable"
                      >{computedTotalPayable}</span
                    >
                  </div>
                  <div class="col-auto">
                    <span class="text-muted small">Total Receivable:</span>
                    <span class="fw-semibold ms-2" data-id="preview-receivable"
                      >{computedTotalReceivable}</span
                    >
                  </div>
                  <div class="col-auto">
                    <span class="text-muted small"
                      >Net Payable / Recoverable:</span
                    >
                    <span
                      class="fw-bold ms-2 text-primary"
                      data-id="preview-net"
                      >{computedNetPayable}</span
                    >
                  </div>
                </div>
                <div class="small text-muted text-end mt-1">
                  Preview only. Waived lines are excluded; the final totals are
                  calculated when you save.
                </div>
              </div>

              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  onclick={handleModalClose}
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  onclick={handleSave}
                  disabled={isSaving}
                  data-action="save"
                >
                  <template lwc:if={isSaving}>
                    <i class="fa-solid fa-spinner fa-spin fa-fw me-1"></i>
                  </template>
                  Save Settlement
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ─── View Modal ──────────────────────────────────────────────────── -->
      <template lwc:if={showViewModal}>
        <div
          class="modal d-block"
          tabindex="-1"
          role="dialog"
          aria-modal="true"
          style="background: rgba(0, 0, 0, 0.45)"
        >
          <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-semibold">
                  <i
                    class="fa-solid fa-file-invoice-dollar fa-fw me-2 text-primary"
                  ></i>
                  Settlement Details — {viewRecord.Name}
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  aria-label="Close"
                  onclick={handleViewClose}
                ></button>
              </div>
              <div class="modal-body">
                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <div class="small text-muted">Employee</div>
                    <div class="fw-semibold" data-id="view-employee">
                      {viewRecord.employeeName}
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="small text-muted">Company</div>
                    <div>{viewRecord.Company__c}</div>
                  </div>
                  <div class="col-md-6">
                    <div class="small text-muted">Department</div>
                    <div>{viewRecord.deptName}</div>
                  </div>
                  <div class="col-md-6">
                    <div class="small text-muted">Designation</div>
                    <div>{viewRecord.desigName}</div>
                  </div>
                  <div class="col-md-6">
                    <div class="small text-muted">Linked Separation</div>
                    <div>{viewRecord.separationName}</div>
                  </div>
                  <div class="col-md-6">
                    <div class="small text-muted">Status</div>
                    <span class={viewRecord.badgeClass}
                      >{viewRecord.Status__c}</span
                    >
                  </div>
                  <div class="col-md-6">
                    <div class="small text-muted">Date of Joining</div>
                    <div>{viewRecord.joiningDateFormatted}</div>
                  </div>
                  <div class="col-md-6">
                    <div class="small text-muted">Relieving Date</div>
                    <div>{viewRecord.relievingDateFormatted}</div>
                  </div>
                </div>
                <hr />
                <div class="row g-3 text-center mb-3">
                  <div class="col-md-4">
                    <div class="small text-muted">Total Payable</div>
                    <div class="fs-5 fw-bold text-success">
                      {viewRecord.totalPayableFormatted}
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="small text-muted">Total Receivable</div>
                    <div class="fs-5 fw-bold text-danger">
                      {viewRecord.totalReceivableFormatted}
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="small text-muted">
                      Net Payable / Recoverable
                    </div>
                    <div class="fs-5 fw-bold text-primary">
                      {viewRecord.netPayableFormatted}
                    </div>
                  </div>
                </div>
                <template lwc:if={viewLinesLoading}>
                  <div class="text-center py-3 text-muted">
                    <i class="fa-solid fa-spinner fa-spin fa-fw me-1"></i>
                    Loading lines...
                  </div>
                </template>
                <template lwc:else>
                  <div class="row g-3">
                    <div class="col-md-6">
                      <h6 class="fw-semibold text-muted">Payable Items</h6>
                      <template lwc:if={hasViewPayables}>
                        <ul
                          class="list-group list-group-flush"
                          data-id="view-payables"
                        >
                          <template for:each={viewPayables} for:item="line">
                            <li
                              key={line.Id}
                              class="list-group-item d-flex justify-content-between px-0"
                            >
                              <span
                                >{line.label}
                                <span class="text-muted small"
                                  >({line.Status__c})</span
                                ></span
                              >
                              <span class="fw-semibold"
                                >{line.amountFormatted}</span
                              >
                            </li>
                          </template>
                        </ul>
                      </template>
                      <template lwc:else>
                        <p class="small text-muted mb-0">No payable items.</p>
                      </template>
                    </div>
                    <div class="col-md-6">
                      <h6 class="fw-semibold text-muted">Receivable Items</h6>
                      <template lwc:if={hasViewReceivables}>
                        <ul
                          class="list-group list-group-flush"
                          data-id="view-receivables"
                        >
                          <template for:each={viewReceivables} for:item="line">
                            <li
                              key={line.Id}
                              class="list-group-item d-flex justify-content-between px-0"
                            >
                              <span
                                >{line.label}
                                <span class="text-muted small"
                                  >({line.Status__c})</span
                                ></span
                              >
                              <span class="fw-semibold"
                                >{line.amountFormatted}</span
                              >
                            </li>
                          </template>
                        </ul>
                      </template>
                      <template lwc:else>
                        <p class="small text-muted mb-0">
                          No receivable items.
                        </p>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  onclick={handleViewClose}
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
