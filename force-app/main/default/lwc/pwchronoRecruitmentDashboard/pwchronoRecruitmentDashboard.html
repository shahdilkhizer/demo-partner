<template>
  <div class="pwchrono-recruitment-dashboard">
    <!-- Header -->
    <div class="page-header mb-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <h4 class="mb-1 fw-semibold">
            <i class="fa-solid fa-chart-line fa-fw me-2 text-primary"></i>Recruitment Dashboard
          </h4>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0 small">
              <li class="breadcrumb-item">Recruitment</li>
              <li class="breadcrumb-item active">Dashboard</li>
            </ol>
          </nav>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick={handleRefresh} title="Refresh">
          <i class="fa-solid fa-rotate fa-fw"></i>
        </button>
      </div>
    </div>

    <!-- Loading -->
    <template if:true={isLoading}>
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </template>

    <template if:false={isLoading}>
      <!-- ── Row 1: Top Metric Cards ───────────────────────────────────────── -->
      <div class="row g-3 mb-4">
        <!-- Total Job Openings -->
        <div class="col-6 col-md-4 col-lg-2">
          <div class="card border-0 shadow-sm h-100 text-center">
            <div class="card-body py-3">
              <div class="fs-2 fw-bold text-primary">{data.totalJobOpenings}</div>
              <div class="small text-muted">Total Openings</div>
            </div>
          </div>
        </div>
        <!-- Open -->
        <div class="col-6 col-md-4 col-lg-2">
          <div class="card border-0 shadow-sm h-100 text-center">
            <div class="card-body py-3">
              <div class="fs-2 fw-bold text-success">{data.openJobOpenings}</div>
              <div class="small text-muted">Open</div>
            </div>
          </div>
        </div>
        <!-- Closed -->
        <div class="col-6 col-md-4 col-lg-2">
          <div class="card border-0 shadow-sm h-100 text-center">
            <div class="card-body py-3">
              <div class="fs-2 fw-bold text-secondary">{data.closedJobOpenings}</div>
              <div class="small text-muted">Closed</div>
            </div>
          </div>
        </div>
        <!-- Total Applicants -->
        <div class="col-6 col-md-4 col-lg-2">
          <div class="card border-0 shadow-sm h-100 text-center">
            <div class="card-body py-3">
              <div class="fs-2 fw-bold text-info">{data.totalApplicants}</div>
              <div class="small text-muted">Total Applicants</div>
            </div>
          </div>
        </div>
        <!-- Avg Time to Fill -->
        <div class="col-6 col-md-4 col-lg-2">
          <div class="card border-0 shadow-sm h-100 text-center">
            <div class="card-body py-3">
              <div class="fs-2 fw-bold text-warning">{data.avgTimeToFill}</div>
              <div class="small text-muted">Avg Days to Fill</div>
            </div>
          </div>
        </div>
        <!-- Accepted -->
        <div class="col-6 col-md-4 col-lg-2">
          <div class="card border-0 shadow-sm h-100 text-center">
            <div class="card-body py-3">
              <div class="fs-2 fw-bold text-success">{data.funnelAccepted}</div>
              <div class="small text-muted">Hires (Accepted)</div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Row 2: Hiring Funnel + Applicants by Status ───────────────────── -->
      <div class="row g-3 mb-4">
        <!-- Hiring Funnel -->
        <div class="col-12 col-lg-5">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-bottom py-2 px-3">
              <h6 class="mb-0 fw-semibold">
                <i class="fa-solid fa-filter fa-fw me-2 text-primary"></i>Hiring Funnel
              </h6>
            </div>
            <div class="card-body py-3 px-4">
              <div class="d-flex flex-column gap-2">
                <template for:each={funnelStages} for:item="stage">
                  <div key={stage.label} class="funnel-stage">
                    <div class="d-flex justify-content-between small mb-1">
                      <span class="fw-semibold">{stage.label}</span>
                      <span class="text-muted">{stage.count}</span>
                    </div>
                    <div class="progress" style="height:18px;border-radius:4px;">
                      <div
                        class={stage.barClass}
                        role="progressbar"
                        style={stage.barStyle}
                        aria-valuenow={stage.pct}
                        aria-valuemin="0"
                        aria-valuemax="100"
                      >{stage.pctLabel}</div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- Applicants by Status -->
        <div class="col-12 col-lg-7">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-bottom py-2 px-3">
              <h6 class="mb-0 fw-semibold">
                <i class="fa-solid fa-users fa-fw me-2 text-info"></i>Applicants by Status
              </h6>
            </div>
            <div class="card-body py-3">
              <template if:true={hasApplicantsByStatus}>
                <template for:each={applicantsByStatusChart} for:item="row">
                  <div key={row.label} class="mb-3">
                    <div class="d-flex justify-content-between small mb-1">
                      <span>{row.label}</span>
                      <span class="fw-semibold">{row.count}</span>
                    </div>
                    <div class="progress" style="height:14px;border-radius:4px;">
                      <div
                        class="progress-bar bg-info"
                        role="progressbar"
                        style={row.barStyle}
                        aria-valuenow={row.pct}
                        aria-valuemin="0"
                        aria-valuemax="100"
                      ></div>
                    </div>
                  </div>
                </template>
              </template>
              <template if:false={hasApplicantsByStatus}>
                <p class="text-muted small text-center mt-3">No applicant data available.</p>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Row 3: By Source + By Job Opening ─────────────────────────────── -->
      <div class="row g-3 mb-4">
        <!-- Applicants by Source -->
        <div class="col-12 col-md-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-bottom py-2 px-3">
              <h6 class="mb-0 fw-semibold">
                <i class="fa-solid fa-arrow-up-right-dots fa-fw me-2 text-success"></i>Applicants by Source
              </h6>
            </div>
            <div class="card-body py-3">
              <template if:true={hasApplicantsBySource}>
                <template for:each={applicantsBySourceChart} for:item="row">
                  <div key={row.label} class="mb-3">
                    <div class="d-flex justify-content-between small mb-1">
                      <span>{row.label}</span>
                      <span class="fw-semibold">{row.count}</span>
                    </div>
                    <div class="progress" style="height:14px;border-radius:4px;">
                      <div
                        class="progress-bar bg-success"
                        role="progressbar"
                        style={row.barStyle}
                        aria-valuenow={row.pct}
                        aria-valuemin="0"
                        aria-valuemax="100"
                      ></div>
                    </div>
                  </div>
                </template>
              </template>
              <template if:false={hasApplicantsBySource}>
                <p class="text-muted small text-center mt-3">No source data available.</p>
              </template>
            </div>
          </div>
        </div>

        <!-- Offers by Status -->
        <div class="col-12 col-md-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-bottom py-2 px-3">
              <h6 class="mb-0 fw-semibold">
                <i class="fa-solid fa-envelope-open-text fa-fw me-2 text-warning"></i>Job Offers by Status
              </h6>
            </div>
            <div class="card-body p-0">
              <template if:true={hasOffersByStatus}>
                <table class="table table-hover align-middle small mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Offer Status</th>
                      <th class="text-end">Count</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={data.offersByStatus} for:item="row">
                      <tr key={row.label}>
                        <td>
                          <span class={row.badgeClass}>{row.label}</span>
                        </td>
                        <td class="text-end fw-semibold">{row.count}</td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
              <template if:false={hasOffersByStatus}>
                <p class="text-muted small text-center py-4">No offer data available.</p>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Row 4: Dept-wise Openings + Top Job Openings ──────────────────── -->
      <div class="row g-3 mb-4">
        <!-- Department-wise Openings -->
        <div class="col-12 col-md-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-bottom py-2 px-3">
              <h6 class="mb-0 fw-semibold">
                <i class="fa-solid fa-building fa-fw me-2 text-secondary"></i>Department-wise Openings
              </h6>
            </div>
            <div class="card-body py-3">
              <template if:true={hasDeptWiseOpenings}>
                <template for:each={deptWiseChart} for:item="row">
                  <div key={row.label} class="mb-3">
                    <div class="d-flex justify-content-between small mb-1">
                      <span>{row.label}</span>
                      <span class="fw-semibold">{row.count}</span>
                    </div>
                    <div class="progress" style="height:14px;border-radius:4px;">
                      <div
                        class="progress-bar bg-secondary"
                        role="progressbar"
                        style={row.barStyle}
                        aria-valuenow={row.pct}
                        aria-valuemin="0"
                        aria-valuemax="100"
                      ></div>
                    </div>
                  </div>
                </template>
              </template>
              <template if:false={hasDeptWiseOpenings}>
                <p class="text-muted small text-center mt-3">No department data available.</p>
              </template>
            </div>
          </div>
        </div>

        <!-- Top Job Openings by Applicants -->
        <div class="col-12 col-md-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white border-bottom py-2 px-3">
              <h6 class="mb-0 fw-semibold">
                <i class="fa-solid fa-ranking-star fa-fw me-2 text-danger"></i>Top Openings by Applicants
              </h6>
            </div>
            <div class="card-body p-0">
              <template if:true={hasApplicantsByJobOpening}>
                <table class="table table-hover align-middle small mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Job Opening</th>
                      <th class="text-end">Applicants</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={data.applicantsByJobOpening} for:item="row">
                      <tr key={row.label}>
                        <td>{row.label}</td>
                        <td class="text-end">
                          <span class="badge bg-danger-subtle text-danger">{row.count}</span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </template>
              <template if:false={hasApplicantsByJobOpening}>
                <p class="text-muted small text-center py-4">No applicant data by opening.</p>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Error -->
      <template if:true={loadError}>
        <div class="alert alert-danger py-2 small" role="alert">
          <i class="fa-solid fa-circle-exclamation fa-fw me-1"></i>{loadError}
        </div>
      </template>
    </template>
  </div>
</template>
