<template lwc:render-mode="light">
  <div class="page-wrapper pwchrono-lifecycle-page">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- Page header -->
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"
      >
        <div>
          <h4 class="fw-bold mb-1">
            <i class="fa-solid fa-right-left fa-fw me-2 text-primary"></i
            >Employee Transfer
          </h4>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="#" onclick={handleHome}>Home</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Employee Transfer
              </li>
            </ol>
          </nav>
        </div>
        <template if:true={canCreate}>
          <div class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-outline-secondary btn-sm"
              data-action="export"
              onclick={handleExport}
              disabled={isLoading}
            >
              <i class="fa-solid fa-file-csv fa-fw me-1"></i>Export
            </button>
            <button
              type="button"
              class="btn btn-primary btn-sm"
              data-action="create"
              onclick={handleCreate}
            >
              <i class="fa-solid fa-plus fa-fw me-1"></i>New Transfer
            </button>
          </div>
        </template>
      </div>

      <!-- Action error alert -->
      <template if:true={errorMessage}>
        <div
          class="alert alert-danger alert-dismissible d-flex align-items-center mb-3"
          role="alert"
          data-id="action-error"
        >
          <i class="fa-solid fa-circle-exclamation fa-fw me-2"></i>
          <div>{errorMessage}</div>
          <button
            type="button"
            class="btn-close"
            aria-label="Dismiss"
            onclick={clearError}
          ></button>
        </div>
      </template>

      <!-- Metric cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-primary">{totalCount}</div>
              <div class="text-muted small">Total</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-secondary">{draftCount}</div>
              <div class="text-muted small">Draft</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-warning">{submittedCount}</div>
              <div class="text-muted small">Submitted</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-success">{approvedCount}</div>
              <div class="text-muted small">Approved</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-auto">
              <label
                class="form-label mb-0 fw-semibold small"
                for="transfer-status-filter"
                >Status</label
              >
            </div>
            <div class="col-auto">
              <select
                id="transfer-status-filter"
                class="form-select form-select-sm"
                data-id="status-filter"
                onchange={handleFilterChange}
              >
                <template for:each={statusOptions} for:item="opt">
                  <option
                    key={opt.value}
                    value={opt.value}
                    selected={opt.selected}
                  >
                    {opt.label}
                  </option>
                </template>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading -->
      <template if:true={isLoading}>
        <div class="text-center py-5" data-id="loading">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </template>

      <!-- Load error -->
      <template if:true={loadError}>
        <div class="card border-0 shadow-sm" data-id="load-error">
          <div class="card-body text-center py-5">
            <i
              class="fa-solid fa-triangle-exclamation fa-2x text-danger mb-3"
            ></i>
            <p class="mb-3">{loadError}</p>
            <button
              type="button"
              class="btn btn-outline-primary btn-sm"
              onclick={handleRetry}
            >
              <i class="fa-solid fa-rotate-right fa-fw me-1"></i>Try again
            </button>
          </div>
        </div>
      </template>

      <!-- Table -->
      <template if:true={showTable}>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Transfer #</th>
                  <th>Employee</th>
                  <th>Transfer Date</th>
                  <th>Branch</th>
                  <th>Department</th>
                  <th>Designation</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <template if:true={hasRecords}>
                  <template for:each={enrichedRecords} for:item="row">
                    <tr key={row.Id} data-row-id={row.Id}>
                      <td class="text-muted small">{row.Name}</td>
                      <td class="fw-semibold">{row.employeeName}</td>
                      <td>{row.transferDateFormatted}</td>
                      <td>
                        <span class="text-muted">{row.currentBranch}</span>
                        <i
                          class="fa-solid fa-arrow-right fa-fw mx-1 text-primary"
                        ></i>
                        <span class="fw-semibold">{row.newBranch}</span>
                      </td>
                      <td>
                        <span class="text-muted">{row.currentDeptName}</span>
                        <template if:true={row.deptChanged}>
                          <i
                            class="fa-solid fa-arrow-right fa-fw mx-1 text-primary"
                          ></i>
                          <span class="fw-semibold">{row.newDeptName}</span>
                        </template>
                      </td>
                      <td>
                        <span class="text-muted">{row.currentDesigName}</span>
                        <template if:true={row.desigChanged}>
                          <i
                            class="fa-solid fa-arrow-right fa-fw mx-1 text-primary"
                          ></i>
                          <span class="fw-semibold">{row.newDesigName}</span>
                        </template>
                      </td>
                      <td>
                        <span class={row.statusBadgeClass}
                          >{row.Status__c}</span
                        >
                      </td>
                      <td>
                        <div class="d-flex flex-wrap gap-1">
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-primary"
                            data-id={row.Id}
                            data-action="open"
                            onclick={handleEdit}
                            title={row.openTitle}
                            aria-label={row.openTitle}
                          >
                            <i class={row.openIconClass}></i>
                          </button>
                          <template if:true={row.canSubmit}>
                            <button
                              type="button"
                              class="btn btn-sm btn-outline-warning"
                              data-id={row.Id}
                              data-status="Submitted"
                              data-action="submit"
                              onclick={handleStatusAction}
                              disabled={row.busy}
                              title="Submit for approval"
                              aria-label="Submit for approval"
                            >
                              <i class="fa-solid fa-paper-plane fa-fw"></i>
                            </button>
                          </template>
                          <template if:true={row.canApprove}>
                            <button
                              type="button"
                              class="btn btn-sm btn-outline-success"
                              data-id={row.Id}
                              data-status="Approved"
                              data-action="approve"
                              onclick={handleStatusAction}
                              disabled={row.busy}
                              title="Approve"
                              aria-label="Approve"
                            >
                              <i class="fa-solid fa-check fa-fw"></i>
                            </button>
                          </template>
                          <template if:true={row.canReturnToDraft}>
                            <button
                              type="button"
                              class="btn btn-sm btn-outline-secondary"
                              data-id={row.Id}
                              data-status="Draft"
                              data-action="return"
                              onclick={handleStatusAction}
                              disabled={row.busy}
                              title="Return to draft"
                              aria-label="Return to draft"
                            >
                              <i class="fa-solid fa-rotate-left fa-fw"></i>
                            </button>
                          </template>
                          <template if:true={row.canCancel}>
                            <button
                              type="button"
                              class="btn btn-sm btn-outline-dark"
                              data-id={row.Id}
                              data-status="Cancelled"
                              data-action="cancel"
                              onclick={handleStatusAction}
                              disabled={row.busy}
                              title="Cancel transfer"
                              aria-label="Cancel transfer"
                            >
                              <i class="fa-solid fa-ban fa-fw"></i>
                            </button>
                          </template>
                          <template if:true={row.canDelete}>
                            <button
                              type="button"
                              class="btn btn-sm btn-outline-danger"
                              data-id={row.Id}
                              data-action="delete"
                              onclick={handleDelete}
                              disabled={row.busy}
                              title="Delete"
                              aria-label="Delete"
                            >
                              <i class="fa-solid fa-trash fa-fw"></i>
                            </button>
                          </template>
                        </div>
                      </td>
                    </tr>
                  </template>
                </template>
                <template if:false={hasRecords}>
                  <tr>
                    <td
                      colspan="8"
                      class="text-center text-muted py-4"
                      data-id="empty"
                    >
                      <i class="fa-solid fa-inbox fa-fw me-2"></i>No transfer
                      records found.
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- Create / Edit / View Modal -->
      <template if:true={showModal}>
        <div
          class="modal d-block"
          tabindex="-1"
          role="dialog"
          aria-modal="true"
          style="background: rgba(0, 0, 0, 0.5)"
        >
          <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-semibold">
                  <i class="fa-solid fa-right-left fa-fw me-2 text-primary"></i>
                  {modalTitle}
                  <template if:true={isEditMode}>
                    <span class={modalStatusBadgeClass} data-id="modal-status"
                      >{modalStatus}</span
                    >
                  </template>
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  aria-label="Close"
                  onclick={handleModalClose}
                ></button>
              </div>
              <div class="modal-body">
                <!-- Read-only notice -->
                <template if:true={isReadOnly}>
                  <div
                    class="alert alert-info d-flex align-items-center mb-3"
                    data-id="read-only"
                  >
                    <i class="fa-solid fa-lock fa-fw me-2"></i>
                    {readOnlyNotice}
                  </div>
                </template>

                <!-- Validation / server error -->
                <template if:true={validationError}>
                  <div
                    class="alert alert-warning d-flex align-items-center mb-3"
                    data-id="modal-error"
                  >
                    <i class="fa-solid fa-triangle-exclamation fa-fw me-2"></i>
                    {validationError}
                  </div>
                </template>

                <div class="row g-3">
                  <!-- Employee -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Employee <span class="text-danger">*</span></label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="Employee__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="">-- Select Employee --</option>
                      <template for:each={employeeOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selected}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>
                  <!-- Employee Name -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Employee Name</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      data-id="employee-name"
                      value={editRecord.Employee_Name__c}
                      disabled
                    />
                    <div class="form-text">
                      The name and current department, designation and reporting
                      manager come from the employee record.
                    </div>
                  </div>
                  <!-- Company -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small">Company</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      maxlength="255"
                      data-field="Company__c"
                      value={editRecord.Company__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>
                  <!-- Transfer Date -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Transfer Date <span class="text-danger">*</span></label
                    >
                    <input
                      type="date"
                      class="form-control form-control-sm"
                      data-field="Transfer_Date__c"
                      value={editRecord.Transfer_Date__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                    <div class="form-text">
                      The transfer can be approved on or after this date.
                    </div>
                  </div>

                  <!-- Section: Branch -->
                  <div class="col-12">
                    <hr class="my-1" />
                    <p class="fw-semibold small mb-0 text-muted text-uppercase">
                      Branch
                    </p>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Current Branch</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      maxlength="255"
                      data-field="Current_Branch__c"
                      value={editRecord.Current_Branch__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >New Branch</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      maxlength="255"
                      data-field="New_Branch__c"
                      value={editRecord.New_Branch__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>

                  <!-- Section: Department -->
                  <div class="col-12">
                    <hr class="my-1" />
                    <p class="fw-semibold small mb-0 text-muted text-uppercase">
                      Department
                    </p>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Current Department</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      data-id="current-department"
                      value={editRecord.currentDepartmentName}
                      disabled
                    />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >New Department</label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="New_Department__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="">-- Select --</option>
                      <template for:each={departmentOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selectedNew}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>

                  <!-- Section: Designation -->
                  <div class="col-12">
                    <hr class="my-1" />
                    <p class="fw-semibold small mb-0 text-muted text-uppercase">
                      Designation
                    </p>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Current Designation</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      data-id="current-designation"
                      value={editRecord.currentDesignationName}
                      disabled
                    />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >New Designation</label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="New_Designation__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="">-- Select --</option>
                      <template for:each={designationOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selectedNewDesig}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>

                  <!-- Section: Reports To -->
                  <div class="col-12">
                    <hr class="my-1" />
                    <p class="fw-semibold small mb-0 text-muted text-uppercase">
                      Reports To
                    </p>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Current Reports To</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      data-id="current-reports-to"
                      value={editRecord.currentReportsToName}
                      disabled
                    />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >New Reports To</label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="New_Reports_To__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="">-- Select --</option>
                      <template for:each={managerOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selectedNewMgr}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>

                  <!-- Transfer Details -->
                  <div class="col-12">
                    <hr class="my-1" />
                    <p class="fw-semibold small mb-0 text-muted text-uppercase">
                      Transfer Details / Notes
                    </p>
                  </div>
                  <div class="col-12">
                    <textarea
                      class="form-control form-control-sm"
                      rows="3"
                      data-field="Transfer_Details__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
{editRecord.Transfer_Details__c}</textarea
                    >
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <template if:true={canDeleteInModal}>
                  <button
                    type="button"
                    class="btn btn-danger btn-sm me-auto"
                    data-id={editRecord.Id}
                    onclick={handleDelete}
                  >
                    <i class="fa-solid fa-trash fa-fw me-1"></i>Delete
                  </button>
                </template>
                <button
                  type="button"
                  class="btn btn-secondary btn-sm"
                  onclick={handleModalClose}
                >
                  Close
                </button>
                <template if:true={canSaveRecord}>
                  <button
                    type="button"
                    class="btn btn-primary btn-sm"
                    data-action="save"
                    onclick={handleSave}
                    disabled={isSaving}
                  >
                    <template if:true={isSaving}>
                      <span
                        class="spinner-border spinner-border-sm me-1"
                        role="status"
                      ></span>
                    </template>
                    <i class="fa-solid fa-floppy-disk fa-fw me-1"></i>Save
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
