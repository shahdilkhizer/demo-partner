<template lwc:render-mode="light">
  <div class="job-openings-container">
    <!-- Header -->
    <div class="card">
      <div
        class="card-body d-flex align-items-center justify-content-between flex-wrap gap-3"
      >
        <div>
          <h5 class="mb-0 fw-bold text-dark">Job Openings</h5>
          <small class="text-muted"
            >Explore open positions and refer candidates</small
          >
        </div>
        <div class="d-flex gap-2">
          <input
            class="form-control"
            type="search"
            value={searchTerm}
            oninput={handleSearch}
            placeholder="Search job openings"
            aria-label="Search job openings"
          /><button
            type="button"
            class="btn btn-white"
            onclick={handleResetSearch}
          >
            Reset
          </button>
        </div>
      </div>
    </div>
    <template if:true={error}
      ><div class="alert alert-danger" role="alert">{error}</div></template
    >

    <!-- Loading State -->
    <template if:true={isLoading}>
      <div class="d-flex align-items-center justify-content-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading job openings...</span>
        </div>
      </div>
    </template>

    <template if:false={isLoading}>
      <template if:true={hasJobs}>
        <div class="row">
          <template for:each={filteredJobs} for:item="job">
            <div key={job.Id} class="col-12 col-md-6 col-xl-4 col-xxl-3 d-flex">
              <div class="card flex-fill job-opening-card">
                <div class="card-body d-flex flex-column">
                  <div
                    class="d-flex align-items-start justify-content-between mb-3"
                  >
                    <div class="job-opening-title">
                      <h5 class="card-title fw-bold text-dark mb-1">
                        {job.designationName}
                      </h5>
                      <span class="badge bg-primary-subtle text-primary"
                        >{job.departmentName}</span
                      >
                    </div>
                    <span class="badge bg-success-subtle text-success"
                      >Open</span
                    >
                  </div>

                  <div class="row g-2 mb-3 text-muted small">
                    <div class="col-6">
                      <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-users text-secondary"></i>
                        <span
                          >Positions:
                          <strong class="text-dark"
                            >{job.No_of_Positions__c}</strong
                          ></span
                        >
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-secondary"></i>
                        <span
                          >Closes:
                          <strong class="text-dark"
                            ><lightning-formatted-date-time
                              value={job.Closing_Date__c}
                            ></lightning-formatted-date-time></strong
                        ></span>
                      </div>
                    </div>
                  </div>

                  <div class="mb-3 flex-grow-1">
                    <p
                      class="card-text text-muted small"
                      style="
                        display: -webkit-box;
                        -webkit-line-clamp: 3;
                        -webkit-box-orient: vertical;
                        overflow: hidden;
                      "
                    >
                      {job.Job_Description__c}
                    </p>
                  </div>

                  <div class="pt-3 border-top d-flex justify-content-end">
                    <button
                      type="button"
                      class="btn btn-sm btn-primary d-flex align-items-center gap-2"
                      onclick={handleRefer}
                      data-id={job.Id}
                      data-title={job.designationName}
                    >
                      <i class="fa-solid fa-user-plus"></i> Refer Candidate
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template if:true={showEmptyState}>
        <div class="card border-0 shadow-sm text-center py-5">
          <div
            class="card-body d-flex flex-column align-items-center justify-content-center"
          >
            <div
              class="rounded-circle bg-light d-flex align-items-center justify-content-center mb-3"
              style="
                width: 64px;
                height: 64px;
                float: none !important;
                margin: 0 auto !important;
              "
            >
              <i
                class="fa-solid fa-briefcase fa-2x text-muted"
                style="float: none !important; margin: 0 !important"
              ></i>
            </div>
            <h5 class="text-muted mb-0">
              No open positions match your search.
            </h5>
          </div>
        </div>
      </template>
    </template>

    <!-- Referral Modal -->
    <template if:true={isModalOpen}>
      <div
        class="modal fade show d-block"
        tabindex="-1"
        style="background-color: rgba(0, 0, 0, 0.5)"
        role="dialog"
        aria-modal="true"
        aria-labelledby="referral-title"
        onkeydown={handleModalKeydown}
      >
        <div class="modal-dialog modal-dialog-centered" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="referral-title">
                Refer Candidate for {selectedJobTitle}
              </h5>
              <button
                type="button"
                class="btn-close"
                onclick={closeModal}
                aria-label="Close"
                disabled={isSaving}
              ></button>
            </div>
            <div class="modal-body p-4">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="referral-firstName" class="form-label"
                    >First Name <span class="text-danger">*</span></label
                  >
                  <input
                    id="referral-firstName"
                    class="form-control"
                    name="firstName"
                    value={referral.firstName}
                    onchange={handleFieldChange}
                    required
                  />
                </div>
                <div class="col-12 col-md-6">
                  <label for="referral-lastName" class="form-label"
                    >Last Name <span class="text-danger">*</span></label
                  >
                  <input
                    id="referral-lastName"
                    class="form-control"
                    name="lastName"
                    value={referral.lastName}
                    onchange={handleFieldChange}
                    required
                  />
                </div>
                <div class="col-12 col-md-6">
                  <label for="referral-email" class="form-label"
                    >Email <span class="text-danger">*</span></label
                  >
                  <input
                    id="referral-email"
                    class="form-control"
                    type="email"
                    name="email"
                    value={referral.email}
                    onchange={handleFieldChange}
                    required
                  />
                </div>
                <div class="col-12 col-md-6">
                  <label for="referral-phone" class="form-label"
                    >Phone <span class="text-danger">*</span></label
                  >
                  <input
                    id="referral-phone"
                    class="form-control"
                    type="tel"
                    name="phone"
                    value={referral.phone}
                    onchange={handleFieldChange}
                    required
                  />
                </div>
                <div class="col-12">
                  <label for="referral-experience" class="form-label"
                    >Experience (Years)
                    <span class="text-danger">*</span></label
                  >
                  <input
                    id="referral-experience"
                    class="form-control"
                    type="number"
                    name="experience"
                    value={referral.experience}
                    min="0"
                    max="60"
                    step="0.5"
                    onchange={handleFieldChange}
                    required
                  />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-light"
                onclick={closeModal}
                disabled={isSaving}
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick={handleSubmit}
                disabled={isSaving}
              >
                <template if:true={isSaving}>Submitting…</template
                ><template if:false={isSaving}>Submit Referral</template>
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
