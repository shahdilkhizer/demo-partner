<template>
  <c-pwchrono-main-layout>
    <div slot="main-content">
      <div class="page-wrapper" style="margin-left: 260px !important; padding: 20px !important; min-height: 732px;">
        <div class="content" style="padding: 0 !important;">

          <!-- Breadcrumb -->
          <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
            <div class="my-auto mb-2">
              <h2 class="mb-1">Chat</h2>
              <nav>
                <ol class="breadcrumb mb-0">
                  <li class="breadcrumb-item">
                    <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
                  </li>
                  <li class="breadcrumb-item">Applications</li>
                  <li class="breadcrumb-item active" aria-current="page">Chat</li>
                </ol>
              </nav>
            </div>
            <div class="head-icons">
              <a href="javascript:void(0);" class="btn-collapse" title="Collapse">
                <i class="ti ti-chevrons-up"></i>
              </a>
            </div>
          </div>
          <!-- /Breadcrumb -->

          <!-- Chat Wrapper Card -->
          <div class="chat-wrapper card border-0 shadow-sm">
            <div class="row g-0 h-100 flex-grow-1">

              <!-- Left Sidebar: Chat Contacts List -->
              <div class="col-12 col-md-4 col-lg-3 border-end chat-users-sidebar bg-white d-flex flex-column" style="min-width: 290px;">
                <div class="p-3 border-bottom">
                  <h4 class="mb-3 fs-16 fw-semibold">Chats</h4>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="ti ti-search text-muted"></i></span>
                    <input
                      type="text"
                      class="form-control bg-light border-start-0"
                      placeholder="Search Contacts or Messages"
                      value={searchKeyword}
                      oninput={handleSearch}
                    />
                  </div>
                </div>

                <div class="p-3 pb-1">
                  <h5 class="fs-13 fw-semibold text-muted mb-0">All Chats</h5>
                </div>

                <div class="chat-users-list flex-grow-1 overflow-auto">
                  <template for:each={filteredContacts} for:item="c">
                    <div
                      key={c.id}
                      class={c.itemClass}
                      data-id={c.id}
                      onclick={selectContact}
                    >
                      <div class="avatar avatar-md online me-2 position-relative flex-shrink-0">
                        <img src={c.avatarUrl} class="rounded-circle" style="width: 42px; height: 42px; object-fit: cover;" alt="Avatar" />
                        <template if:true={c.isOnline}>
                          <span class="online-indicator"></span>
                        </template>
                      </div>
                      <div class="flex-grow-1 min-w-0">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                          <h6 class="fs-13 fw-semibold text-dark text-truncate mb-0">{c.name}</h6>
                          <span class="fs-11 text-muted">{c.time}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                          <p class="fs-12 text-muted text-truncate mb-0">{c.lastMessage}</p>
                          <template if:true={c.unreadCount}>
                            <span class="badge bg-danger rounded-pill fs-10 px-2 py-1 text-white">{c.unreadCount}</span>
                          </template>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Right Area: Active Conversation -->
              <div class="col-12 col-md-8 col-lg-9 d-flex flex-column chat-messages-area bg-light-subtle">
                <!-- Chat Header -->
                <div class="chat-header p-3 bg-white border-bottom d-flex justify-content-between align-items-center">
                  <div class="d-flex align-items-center">
                    <div class="avatar avatar-md online me-2 position-relative">
                      <img src={activeContact.avatarUrl} class="rounded-circle" style="width: 44px; height: 44px; object-fit: cover;" alt="Avatar" />
                      <span class="online-indicator"></span>
                    </div>
                    <div>
                      <h6 class="fs-14 fw-semibold text-dark mb-0">{activeContact.name}</h6>
                      <span class="fs-12 text-success"><i class="ti ti-point-filled me-1"></i>Online</span>
                    </div>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-icon btn-light rounded-circle" title="Search">
                      <i class="ti ti-search"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-icon btn-light rounded-circle" title="Options">
                      <i class="ti ti-dots-vertical"></i>
                    </button>
                  </div>
                </div>

                <!-- Chat Body (Messages Stream) -->
                <div class="chat-body p-4 flex-grow-1 overflow-auto" id="chat-stream">
                  <template for:each={messages} for:item="msg">
                    <div key={msg.id} class={msg.containerClass}>
                      <template if:false={msg.isOutgoing}>
                        <div class="avatar avatar-sm me-2 flex-shrink-0 align-self-end mb-1">
                          <img src={activeContact.avatarUrl} class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;" alt="Avatar" />
                        </div>
                      </template>
                      <div class="message-bubble-wrapper">
                        <div class={msg.bubbleClass}>
                          <p class="mb-0 fs-13">{msg.text}</p>
                        </div>
                        <div class={msg.metaClass}>
                          <span class="fs-11 text-muted">{msg.time}</span>
                          <template if:true={msg.isOutgoing}>
                            <i class="ti ti-checks text-success ms-1 fs-12"></i>
                          </template>
                        </div>
                      </div>
                      <template if:true={msg.isOutgoing}>
                        <div class="avatar avatar-sm ms-2 flex-shrink-0 align-self-end mb-1">
                          <img src={userAvatarUrl} class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;" alt="You" />
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <!-- Chat Footer: Input and Send -->
                <div class="chat-footer p-3 bg-white border-top">
                  <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-light btn-icon rounded-circle" title="Voice Message">
                      <i class="ti ti-microphone"></i>
                    </button>
                    <button type="button" class="btn btn-light btn-icon rounded-circle" title="Attach File">
                      <i class="ti ti-folder"></i>
                    </button>
                    <input
                      type="text"
                      class="form-control rounded-pill px-3 py-2 fs-13"
                      placeholder="Type Your Message..."
                      value={messageInput}
                      oninput={handleMessageInput}
                      onkeydown={handleKeyDown}
                    />
                    <button type="button" class="btn btn-primary rounded-circle btn-icon p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; background-color: #ff9b44; border-color: #ff9b44;" onclick={handleSend}>
                      <i class="ti ti-send text-white" style="font-size: 16px;"></i>
                    </button>
                  </div>
                </div>

              </div>

            </div>
          </div>
          <!-- /Chat Wrapper Card -->

        </div>
      </div>
    </div>
  </c-pwchrono-main-layout>
</template>
