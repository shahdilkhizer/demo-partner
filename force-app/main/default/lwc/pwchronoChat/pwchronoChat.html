<template>
  <section class="chat-access-card field-card text-center">
    <span class="chat-access-icon" aria-hidden="true"
      ><i class="fa-solid fa-comments"></i
    ></span>
    <h3 class="mt-3 mb-2">Salesforce Chatter</h3>
    <p class="text-muted mb-4">
      Open Chatter using the Salesforce or Chatter Free account assigned by your
      administrator.
    </p>
    <template if:true={chatterLoginUrl}>
      <a
        class="btn btn-primary"
        href={chatterLoginUrl}
        target="_blank"
        rel="noopener noreferrer"
        >{actionLabel}</a
      >
      <p class="small text-muted mt-3">Opens in a new tab.</p>
    </template>
    <template if:true={errorMessage}>
      <p role="alert">{errorMessage}</p>
      <button class="btn btn-primary" type="button" onclick={loadChatterUrl}>
        Retry
      </button>
    </template>
  </section>
</template>
