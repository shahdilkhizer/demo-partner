<template>
  <div class="page-wrapper video-call-page">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <div class="row">
        <div class="col-xl-12">
          <div class="chat-window field-card">
            <!-- Chat List Sidebar (Left) -->
            <div class="chat-cont-left" if:true={showSidebar}>
              <div class="card mb-0">
                <div class="card-header border-bottom">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div class="d-flex align-items-center">
                      <span
                        class="avatar avatar-md rounded-circle border bg-light text-primary me-2"
                      >
                        <i class="fa-solid fa-user"></i>
                      </span>
                      <div>
                        <h5 class="mb-0">{currentUserName}</h5>
                        <p class="mb-0 fs-12 text-muted">{currentUserRole}</p>
                      </div>
                    </div>
                  </div>
                  <div class="mt-3">
                    <div class="input-group input-group-flat">
                      <span class="input-icon-addon">
                        <i class="fa-solid fa-magnifying-glass"></i>
                      </span>
                      <input
                        type="text"
                        class="form-control"
                        placeholder="Search..."
                        onkeyup={handleSearchContacts}
                      />
                    </div>
                  </div>
                </div>
                <div class="card-body p-0 chat-users-list slimscroll">
                  <div class="chat-list">
                    <template for:each={filteredContacts} for:item="contact">
                      <button
                        type="button"
                        key={contact.id}
                        class={contact.itemClass}
                        data-id={contact.id}
                        onclick={handleSelectContact}
                        style="
                          background: none;
                          border: 0;
                          padding: 0;
                          width: 100%;
                          text-align: left;
                        "
                      >
                        <div class="d-flex align-items-center">
                          <c-pwchrono-avatar
                            container-class="avatar avatar-md flex-shrink-0 me-2"
                            image-url={contact.avatarUrl}
                            name={contact.name}
                            alt-text={contact.name}
                            fallback-bg-class="bg-primary"
                          ></c-pwchrono-avatar>
                          <div class="flex-fill">
                            <div
                              class="d-flex align-items-center justify-content-between"
                            >
                              <h6 class="mb-0">{contact.name}</h6>
                              <span class="fs-11 text-muted"
                                >{contact.lastMessageTimeFormatted}</span
                              >
                            </div>
                            <p class="fs-12 text-muted mb-0 text-truncate">
                              {contact.lastMessage}
                            </p>
                          </div>
                          <template if:true={contact.unreadCount}>
                            <span class="badge bg-primary rounded-pill ms-2"
                              >{contact.unreadCount}</span
                            >
                          </template>
                        </div>
                      </button>
                    </template>
                  </div>
                </div>
              </div>
            </div>
            <!-- /Chat List Sidebar -->

            <!-- Chat Content (Right) -->
            <div class="chat-cont-right" if:true={selectedContactId}>
              <div class="card mb-0">
                <div class="card-header border-bottom">
                  <div
                    class="d-flex align-items-center justify-content-between"
                  >
                    <div class="d-flex align-items-center">
                      <button
                        type="button"
                        class="btn btn-icon btn-sm me-2 d-xl-none"
                        onclick={handleBackToSidebar}
                        aria-label="Back"
                      >
                        <i class="fa-solid fa-arrow-left"></i>
                      </button>
                      <c-pwchrono-avatar
                        container-class="avatar avatar-md flex-shrink-0 me-2"
                        image-url={selectedContact.avatarUrl}
                        name={selectedContact.name}
                        alt-text={selectedContact.name}
                        fallback-bg-class="bg-primary"
                      ></c-pwchrono-avatar>
                      <div>
                        <h5 class="mb-0">{selectedContact.name}</h5>
                        <p class="mb-0 fs-12 text-muted">
                          {selectedContact.status}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="card-body chat-body slimscroll" lwc:dom="manual">
                  <!-- Messages rendered manually or via loop -->
                  <!-- Using lwc:dom="manual" for scroll management if complex, but simple loop here -->
                </div>
                <div class="card-body chat-body slimscroll">
                  <div class="chat-msg-list">
                    <template for:each={messages} for:item="msg">
                      <div key={msg.id} class={msg.wrapperClass}>
                        <div class="chat-content">
                          <div class="chat-box">
                            <p>{msg.content}</p>
                            <div class="chat-time">
                              <span>{msg.timeFormatted}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
                <div class="card-footer border-top">
                  <div class="inp-group">
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Type a message..."
                      value={messageInput}
                      onkeyup={handleInputKeyup}
                      onchange={handleInputChange}
                    />
                    <button
                      class="btn btn-primary"
                      onclick={handleSendMessage}
                      disabled={isSending}
                    >
                      <i class="fa-solid fa-paper-plane"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <!-- Empty State -->
            <div
              class="chat-cont-right d-flex align-items-center justify-content-center"
              if:false={selectedContactId}
            >
              <div class="text-center">
                <i class="fa-regular fa-comments fa-3x text-muted mb-3"></i>
                <h3>Select a contact to start chatting</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
