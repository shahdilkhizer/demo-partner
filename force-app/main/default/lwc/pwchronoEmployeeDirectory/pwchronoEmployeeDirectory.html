<template lwc:render-mode="light">
  <div class="page-wrapper" style="min-height: 900px;">
    <div class="content">

      <!-- ========================================================================= -->
      <!-- TOP BREADCRUMB & ACTIONS                                                  -->
      <!-- ========================================================================= -->
      <template if:false={isDetailView}>
        <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
          <div class="my-auto mb-2">
            <h2 class="mb-1">{headerTitle}</h2>
            <nav>
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="javascript:void(0);"><i class="fa-solid fa-house"></i></a>
                </li>
                <li class="breadcrumb-item">Employees</li>
                <li class="breadcrumb-item active" aria-current="page">{headerTitle}</li>
              </ol>
            </nav>
          </div>
          <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
            <!-- View Switch Toggle (List vs Grid) -->
            <div class="me-2 mb-2">
              <div class="d-flex align-items-center border bg-white rounded p-1 me-2 icon-list">
                <button type="button" class={listBtnClass} onclick={switchToList} title="List View">
                  <i class="fa-solid fa-list-ul"></i>
                </button>
                <button type="button" class={gridBtnClass} onclick={switchToGrid} title="Grid View">
                  <i class="fa-solid fa-table-cells-large"></i>
                </button>
              </div>
            </div>
            <!-- Export Dropdown -->
            <div class="me-2 mb-2">
              <div class="dropdown">
                <button type="button" class="dropdown-toggle btn btn-white d-inline-flex align-items-center" data-bs-toggle="dropdown">
                  <i class="fa-solid fa-file-export me-1"></i>Export
                </button>
                <ul class="dropdown-menu dropdown-menu-end p-3">
                  <li>
                    <a href="javascript:void(0);" class="dropdown-item rounded-1"><i class="fa-solid fa-file-pdf me-2 text-danger"></i>Export as PDF</a>
                  </li>
                  <li>
                    <a href="javascript:void(0);" class="dropdown-item rounded-1"><i class="fa-solid fa-file-excel me-2 text-success"></i>Export as Excel</a>
                  </li>
                </ul>
              </div>
            </div>
            <!-- Add Employee Button -->
            <div class="mb-2">
              <button type="button" class="btn btn-primary d-flex align-items-center" onclick={handleOpenAddModal}>
                <i class="fa-solid fa-circle-plus me-2"></i>Add Employee
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- DETAIL VIEW BREADCRUMB -->
      <template if:true={isDetailView}>
        <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
          <div class="my-auto mb-2">
            <h6 class="fw-medium d-inline-flex align-items-center mb-3 mb-sm-0">
              <a href="javascript:void(0);" onclick={handleBackToList} class="text-dark d-inline-flex align-items-center text-decoration-none">
                <i class="fa-solid fa-arrow-left me-2"></i>Employee Details
              </a>
            </h6>
          </div>
          <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
            <div class="mb-2">
              <button type="button" class="btn btn-primary d-flex align-items-center" onclick={handleOpenBankModal}>
                <i class="fa-solid fa-circle-plus me-2"></i>Bank &amp; Statutory
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- TOP METRIC CARDS (Shown on List & Grid Views)                             -->
      <!-- ========================================================================= -->
      <template if:false={isDetailView}>
        <div class="row mb-3">
          <!-- Total Employee -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div class="card-body d-flex align-items-center justify-content-between p-3">
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span class="avatar avatar-lg bg-dark text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                      <i class="fa-solid fa-users fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">Total Employee</p>
                    <h4 class="mb-0 fw-bold">{metrics.total}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-purple badge-sm fw-normal">
                    <i class="fa-solid fa-arrow-trend-up"></i> +19.01%
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Active -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div class="card-body d-flex align-items-center justify-content-between p-3">
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span class="avatar avatar-lg bg-success text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                      <i class="fa-solid fa-user-check fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">Active</p>
                    <h4 class="mb-0 fw-bold text-success">{metrics.active}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-primary badge-sm fw-normal">
                    <i class="fa-solid fa-arrow-trend-up"></i> +19.01%
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- InActive -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div class="card-body d-flex align-items-center justify-content-between p-3">
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span class="avatar avatar-lg bg-danger text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                      <i class="fa-solid fa-user-xmark fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">InActive</p>
                    <h4 class="mb-0 fw-bold text-danger">{metrics.inactive}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-dark badge-sm fw-normal">
                    <i class="fa-solid fa-arrow-trend-up"></i> +19.01%
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- New Joiners -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div class="card-body d-flex align-items-center justify-content-between p-3">
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span class="avatar avatar-lg bg-info text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                      <i class="fa-solid fa-user-plus fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">New Joiners</p>
                    <h4 class="mb-0 fw-bold text-info">{metrics.newJoiners}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-secondary badge-sm fw-normal">
                    <i class="fa-solid fa-arrow-trend-up"></i> +19.01%
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- VIEW 1: EMPLOYEE LIST VIEW (Images 1 & 2)                                 -->
      <!-- ========================================================================= -->
      <template if:true={isListView}>
        <div class="card shadow-sm border-0">
          <!-- Filter Header -->
          <div class="card-header bg-white d-flex align-items-center justify-content-between flex-wrap row-gap-3 py-3 border-bottom">
            <h5 class="mb-0 fw-bold">Plan List</h5>
            <div class="d-flex my-xl-auto right-content align-items-center flex-wrap row-gap-2">
              <!-- Date Range Display -->
              <div class="me-3">
                <div class="input-icon position-relative">
                  <span class="input-icon-addon">
                    <i class="fa-regular fa-calendar text-muted"></i>
                  </span>
                  <input type="text" class="form-control form-control-sm date-range" style="width: 220px;" value="08/26/2026 - 09/01/2026" readonly>
                </div>
              </div>
              <!-- Designation Filter -->
              <div class="me-3">
                <select class="form-select form-select-sm" onchange={handleDesignationChange} style="width: 150px;">
                  <template for:each={designationOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                  </template>
                </select>
              </div>
              <!-- Status Filter -->
              <div class="me-3">
                <select class="form-select form-select-sm" onchange={handleStatusChange} style="width: 140px;">
                  <template for:each={statusOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                  </template>
                </select>
              </div>
              <!-- Sort Filter -->
              <div>
                <select class="form-select form-select-sm" onchange={handleSortChange} style="width: 160px;">
                  <template for:each={sortOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>Sort By : {opt.label}</option>
                  </template>
                </select>
              </div>
            </div>
          </div>

          <!-- Table Controls: Rows per page & Live Search -->
          <div class="card-body p-0">
            <div class="p-3 border-bottom d-flex align-items-center justify-content-between flex-wrap gap-2">
              <div class="d-flex align-items-center gap-2">
                <label class="mb-0 fs-13 text-muted">Row Per Page</label>
                <select class="form-select form-select-sm" style="width: 80px;" onchange={handlePageSizeChange}>
                  <template for:each={pageSizeOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                  </template>
                </select>
                <span class="fs-13 text-muted">Entries</span>
              </div>
              <div style="width: 250px;">
                <input type="search" class="form-control form-control-sm" placeholder="Search..." oninput={handleSearch}>
              </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
              <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </template>

            <!-- Table -->
            <template if:false={isLoading}>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 datatable">
                  <thead class="thead-light bg-light">
                    <tr>
                      <th style="width: 40px;" class="ps-3">
                        <div class="form-check form-check-md">
                          <input class="form-check-input" type="checkbox" onchange={handleSelectAll} checked={selectAllChecked}>
                        </div>
                      </th>
                      <th>Emp ID</th>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Phone</th>
                      <th>Designation</th>
                      <th>Joining Date</th>
                      <th>Status</th>
                      <th class="text-end pe-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={displayedEmployees} for:item="emp">
                      <tr key={emp.id} class="cursor-pointer" data-id={emp.id} onclick={handleSelectEmployee}>
                        <td class="ps-3" onclick={handleStopPropagation}>
                          <div class="form-check form-check-md">
                            <input class="form-check-input" type="checkbox" data-id={emp.id} onchange={handleSelectRow}>
                          </div>
                        </td>
                        <td>
                          <a href="javascript:void(0);" data-id={emp.id} onclick={handleSelectEmployee} class="fw-medium text-primary text-decoration-none">
                            {emp.empId}
                          </a>
                        </td>
                        <td>
                          <div class="d-flex align-items-center">
                            <a href="javascript:void(0);" data-id={emp.id} onclick={handleSelectEmployee} class="avatar avatar-md me-2 flex-shrink-0">
                              <img src={displayAvatarUrl} class="img-fluid rounded-circle" alt="img" style="width: 38px; height: 38px; object-fit: cover;" onerror={handleImageError}>
                            </a>
                            <div>
                              <p class="text-dark fw-medium mb-0">
                                <a href="javascript:void(0);" data-id={emp.id} onclick={handleSelectEmployee} class="text-dark text-decoration-none">
                                  {emp.name}
                                </a>
                              </p>
                              <span class="fs-12 text-muted">{emp.department}</span>
                            </div>
                          </div>
                        </td>
                        <td class="text-muted">{emp.email}</td>
                        <td class="text-muted">{emp.phone}</td>
                        <td>
                          <span class="badge bg-light text-dark border px-2 py-1">{emp.title}</span>
                        </td>
                        <td class="text-muted">{emp.joiningDate}</td>
                        <td>
                          <span class={emp.statusClass}>
                            <i class="ti ti-point-filled me-1"></i>{emp.status}
                          </span>
                        </td>
                        <td class="text-end pe-3" onclick={handleStopPropagation}>
                          <div class="action-icon d-inline-flex gap-2">
                            <button type="button" class="btn btn-sm btn-icon btn-light text-primary" data-id={emp.id} onclick={handleSelectEmployee} title="View Details">
                              <i class="fa-solid fa-eye"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-icon btn-light text-secondary" data-id={emp.id} onclick={handleOpenEditEmployeeModal} title="Edit">
                              <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-icon btn-light text-danger" data-id={emp.id} onclick={handleOpenDeleteModal} title="Delete">
                              <i class="fa-solid fa-trash-can"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    </template>
                    <template if:false={displayedEmployees.length}>
                      <tr>
                        <td colspan="9" class="text-center py-5 text-muted">
                          <i class="fa-solid fa-users-slash fs-1 d-block mb-2 text-secondary"></i>
                          No employees found matching the criteria.
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- Pagination footer -->
              <div class="p-3 border-top d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div class="text-muted fs-13">
                  Showing {pageInfo} of {totalCount} entries
                </div>
                <nav aria-label="Page navigation">
                  <ul class="pagination pagination-sm mb-0">
                    <li class="page-item">
                      <button type="button" class="page-link" onclick={handlePrevPage} disabled={isPrevDisabled}>
                        <i class="fa-solid fa-chevron-left"></i>
                      </button>
                    </li>
                    <template for:each={paginationPages} for:item="p">
                      <li key={p.number} class={p.className}>
                        <button type="button" class="page-link" data-page={p.number} onclick={handleGoToPage}>
                          {p.number}
                        </button>
                      </li>
                    </template>
                    <li class="page-item">
                      <button type="button" class="page-link" onclick={handleNextPage} disabled={isNextDisabled}>
                        <i class="fa-solid fa-chevron-right"></i>
                      </button>
                    </li>
                  </ul>
                </nav>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- VIEW 2: EMPLOYEE GRID VIEW (Images 3 & 4)                                 -->
      <!-- ========================================================================= -->
      <template if:true={isGridView}>
        <!-- Grid Header Filter Card -->
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-3">
            <div class="d-flex align-items-center justify-content-between flex-wrap row-gap-3">
              <h5 class="mb-0 fw-bold">Employees Grid</h5>
              <div class="d-flex align-items-center flex-wrap gap-3">
                <div style="width: 220px;">
                  <input type="search" class="form-control form-control-sm" placeholder="Search employees..." oninput={handleSearch}>
                </div>
                <div style="width: 150px;">
                  <select class="form-select form-select-sm" onchange={handleDesignationChange}>
                    <template for:each={designationOptions} for:item="opt">
                      <option key={opt.value} value={opt.value}>{opt.label}</option>
                    </template>
                  </select>
                </div>
                <div style="width: 170px;">
                  <select class="form-select form-select-sm" onchange={handleSortChange}>
                    <template for:each={sortOptions} for:item="opt">
                      <option key={opt.value} value={opt.value}>Sort By : {opt.label}</option>
                    </template>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </template>

        <!-- Grid of Employee Cards -->
        <template if:false={isLoading}>
          <div class="row g-4">
            <template for:each={displayedEmployees} for:item="emp">
              <div key={emp.id} class="col-xl-3 col-lg-4 col-md-6">
                <div class="card h-100 shadow-sm border-0 employee-grid-card cursor-pointer" data-id={emp.id} onclick={handleSelectEmployee}>
                  <div class="card-body p-3 d-flex flex-column justify-content-between">
                    <div>
                      <!-- Card Header: Checkbox, Avatar, 3-dots dropdown -->
                      <div class="d-flex justify-content-between align-items-start mb-2">
                        <div class="form-check form-check-md" onclick={handleStopPropagation}>
                          <input class="form-check-input" type="checkbox" data-id={emp.id} onchange={handleSelectRow}>
                        </div>
                        <div class="text-center position-relative">
                          <a href="javascript:void(0);" data-id={emp.id} onclick={handleSelectEmployee} class="avatar avatar-xl avatar-rounded border p-1 border-primary rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm" style="width: 64px; height: 64px;">
                            <img src={displayAvatarUrl} class="img-fluid rounded-circle" alt="img" style="width: 100%; height: 100%; object-fit: cover;" onerror={handleImageError}>
                          </a>
                          <span class="position-absolute bottom-0 end-0 p-1 bg-success border border-white rounded-circle" style="width: 14px; height: 14px;"></span>
                        </div>
                        <div class="dropdown" onclick={handleStopPropagation}>
                          <button class="btn btn-icon btn-sm rounded-circle text-muted" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                          </button>
                          <ul class="dropdown-menu dropdown-menu-end p-2 shadow-sm">
                            <li>
                              <a class="dropdown-item rounded-1" href="javascript:void(0);" data-id={emp.id} onclick={handleSelectEmployee}>
                                <i class="fa-solid fa-eye me-2 text-primary"></i>View Profile
                              </a>
                            </li>
                            <li>
                              <a class="dropdown-item rounded-1" href="javascript:void(0);" data-id={emp.id} onclick={handleOpenEditEmployeeModal}>
                                <i class="fa-solid fa-pen-to-square me-2 text-secondary"></i>Edit
                              </a>
                            </li>
                            <li>
                              <a class="dropdown-item rounded-1 text-danger" href="javascript:void(0);" data-id={emp.id} onclick={handleOpenDeleteModal}>
                                <i class="fa-solid fa-trash-can me-2"></i>Delete
                              </a>
                            </li>
                          </ul>
                        </div>
                      </div>

                      <!-- Name and Title -->
                      <div class="text-center mb-3">
                        <h6 class="mb-1 fw-bold">
                          <a href="javascript:void(0);" data-id={emp.id} onclick={handleSelectEmployee} class="text-dark text-decoration-none">
                            {emp.name}
                          </a>
                        </h6>
                        <span class="badge bg-pink-transparent text-pink fs-10 fw-medium">
                          {emp.title}
                        </span>
                      </div>

                      <!-- Stats row: Projects / Done / Progress -->
                      <div class="row text-center mb-3">
                        <div class="col-4">
                          <div>
                            <span class="fs-12 text-muted d-block">Projects</span>
                            <h6 class="fw-bold mb-0">{emp.projects}</h6>
                          </div>
                        </div>
                        <div class="col-4">
                          <div>
                            <span class="fs-12 text-muted d-block">Done</span>
                            <h6 class="fw-bold mb-0">{emp.done}</h6>
                          </div>
                        </div>
                        <div class="col-4">
                          <div>
                            <span class="fs-12 text-muted d-block">Progress</span>
                            <h6 class="fw-bold mb-0">{emp.progress}</h6>
                          </div>
                        </div>
                      </div>
                    </div>

                    <!-- Productivity bar -->
                    <div>
                      <p class="mb-1 text-center fs-12 text-muted">
                        Productivity : <span class="fw-bold text-dark">{emp.productivity}%</span>
                      </p>
                      <div class="progress" style="height: 6px;">
                        <div class="progress-bar bg-purple" role="progressbar" style="width: 65%;"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Empty Grid state -->
          <template if:false={displayedEmployees.length}>
            <div class="card p-5 text-center shadow-sm border-0 mt-3">
              <i class="fa-solid fa-users-slash fs-1 text-secondary mb-2"></i>
              <h5 class="text-muted">No employees found</h5>
              <p class="text-muted fs-13">Try clearing search or filters.</p>
            </div>
          </template>

          <!-- Grid Pagination footer -->
          <div class="p-3 mt-4 border bg-white rounded d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="text-muted fs-13">
              Showing {pageInfo} of {totalCount} entries
            </div>
            <nav aria-label="Page navigation">
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item">
                  <button type="button" class="page-link" onclick={handlePrevPage} disabled={isPrevDisabled}>
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                </li>
                <template for:each={paginationPages} for:item="p">
                  <li key={p.number} class={p.className}>
                    <button type="button" class="page-link" data-page={p.number} onclick={handleGoToPage}>
                      {p.number}
                    </button>
                  </li>
                </template>
                <li class="page-item">
                  <button type="button" class="page-link" onclick={handleNextPage} disabled={isNextDisabled}>
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </li>
              </ul>
            </nav>
          </div>
        </template>
      </template>

      <!-- ========================================================================= -->
      <!-- VIEW 3: EMPLOYEE DETAIL VIEW (Matching SmartHR Image 1 Exactly)           -->
      <!-- ========================================================================= -->
      <template if:true={isDetailView}>
        <div if:true={selectedEmployee} class="row g-4">

          <!-- LEFT COLUMN: Profile & Personal Cards (col-xl-4) -->
          <div class="col-xl-4 col-lg-5">
            <!-- Main Profile Card with Curved Top Banner -->
            <div class="card shadow-sm border-0 mb-4 overflow-hidden bg-white">
              <div class="card-body p-0">
                <!-- Top Orange Curved Banner -->
                <div class="card-bg-banner" style={bannerBackgroundStyle}></div>

                <!-- Avatar overlapping half-way -->
                <div class="profile-avatar-wrap">
                  <span class="avatar avatar-xl avatar-rounded border border-2 border-white m-auto d-inline-block shadow-sm" style="width: 76px; height: 76px; border-radius: 50%;">
                    <img src={displayAvatarUrl} class="rounded-circle" alt="Img" style="width: 100%; height: 100%; object-fit: cover;" onerror={handleImageError}>
                  </span>
                </div>

                <!-- Clean White Details Section -->
                <div class="text-center px-3 pb-3 border-bottom">
                  <div class="mb-3">
                    <h5 class="d-flex align-items-center justify-content-center mb-1 fw-bold text-dark">
                      {selectedEmployee.name}
                      <i class="ti ti-discount-check-filled text-success ms-1" title="Verified Employee"></i>
                    </h5>

                        <input type="tel" class="form-control" name="primaryPhone1" value={emergencyForm.primaryPhone1} oninput={handleEmergencyFieldChange} required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Phone No 2</label>
                        <input type="tel" class="form-control" name="primaryPhone2" value={emergencyForm.primaryPhone2} oninput={handleEmergencyFieldChange}>
                      </div>
                    </div>
                  </div>

                  <!-- Block 2: Secondary Contact Details -->
                  <div class="mb-3">
                    <h5 class="mb-3 fw-medium">Secondary Contact Details</h5>
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="secondaryName" value={emergencyForm.secondaryName} oninput={handleEmergencyFieldChange} required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Relationship</label>
                        <input type="text" class="form-control" name="secondaryRelationship" value={emergencyForm.secondaryRelationship} oninput={handleEmergencyFieldChange}>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Phone No 1 <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" name="secondaryPhone1" value={emergencyForm.secondaryPhone1} oninput={handleEmergencyFieldChange} required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Phone No 2</label>
                        <input type="tel" class="form-control" name="secondaryPhone2" value={emergencyForm.secondaryPhone2} oninput={handleEmergencyFieldChange}>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="modal-footer">
                  <button type="button" class="btn btn-white border me-2" onclick={handleCloseEmergencyModal}>Cancel</button>
                  <button type="submit" class="btn btn-primary px-4">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- MODAL 2: BASIC INFORMATION MODAL                                          -->
      <!-- ========================================================================= -->
      <template if:true={isBasicInfoModalOpen}>
        <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h4 class="modal-title fw-bold">Basic Information</h4>
                <button type="button" class="btn-close custom-btn-close" onclick={handleCloseBasicInfoModal}>
                  <i class="ti ti-x"></i>
                </button>
              </div>
              <form onsubmit={handleSaveBasicInfo}>
                <div class="modal-body pb-0">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Phone</label>
                      <input type="tel" class="form-control" name="Phone" value={basicInfoForm.Phone} oninput={handleBasicInfoFieldChange}>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Email</label>
                      <input type="email" class="form-control" name="Email" value={basicInfoForm.Email} oninput={handleBasicInfoFieldChange}>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Gender</label>
                      <select class="form-select" name="Gender" onchange={handleBasicInfoFieldChange}>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Birthday</label>
                      <input type="text" class="form-control" name="Birthdate" value={basicInfoForm.Birthdate} oninput={handleBasicInfoFieldChange} placeholder="e.g. 24th July 2000">
                    </div>
                    <div class="col-12">
                      <label class="form-label">Address</label>
                      <input type="text" class="form-control" name="MailingStreet" value={basicInfoForm.MailingStreet} oninput={handleBasicInfoFieldChange} placeholder="Street, City, State, ZIP">
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-white border me-2" onclick={handleCloseBasicInfoModal}>Cancel</button>
                  <button type="submit" class="btn btn-primary px-4">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- MODAL 3: PERSONAL INFORMATION MODAL                                       -->
      <!-- ========================================================================= -->
      <template if:true={isPersonalModalOpen}>
        <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h4 class="modal-title fw-bold">Personal Information</h4>
                <button type="button" class="btn-close custom-btn-close" onclick={handleClosePersonalModal}>
                  <i class="ti ti-x"></i>
                </button>
              </div>
              <form onsubmit={handleSavePersonal}>
                <div class="modal-body pb-0">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Passport No</label>
                      <input type="text" class="form-control" name="passportNo" value={personalForm.passportNo} oninput={handlePersonalFieldChange}>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Passport Exp Date</label>
                      <input type="text" class="form-control" name="passportExpDate" value={personalForm.passportExpDate} oninput={handlePersonalFieldChange} placeholder="e.g. 15 May 2029">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Nationality</label>
                      <input type="text" class="form-control" name="nationality" value={personalForm.nationality} oninput={handlePersonalFieldChange}>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Religion</label>
                      <input type="text" class="form-control" name="religion" value={personalForm.religion} oninput={handlePersonalFieldChange}>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Marital Status</label>
                      <select class="form-select" name="maritalStatus" onchange={handlePersonalFieldChange}>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Employment of Spouse</label>
                      <select class="form-select" name="spouseEmployment" onchange={handlePersonalFieldChange}>
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">No. of Children</label>
                      <input type="number" class="form-control" name="noOfChildren" value={personalForm.noOfChildren} oninput={handlePersonalFieldChange}>
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-white border me-2" onclick={handleClosePersonalModal}>Cancel</button>
                  <button type="submit" class="btn btn-primary px-4">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- MODAL 4: BANK DETAILS MODAL                                               -->
      <!-- ========================================================================= -->
      <template if:true={isBankModalOpen}>
        <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h4 class="modal-title fw-bold">Bank Details</h4>
                <button type="button" class="btn-close custom-btn-close" onclick={handleCloseBankModal}>
                  <i class="ti ti-x"></i>
                </button>
              </div>
              <form onsubmit={handleSaveBank}>
                <div class="modal-body pb-0">
                  <div class="row g-3">
                    <div class="col-12">
                      <label class="form-label">Bank Name <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" name="bankName" value={bankForm.bankName} oninput={handleBankFieldChange} required>
                    </div>
                    <div class="col-12">
                      <label class="form-label">Bank Account No</label>
                      <input type="text" class="form-control" name="accountNo" value={bankForm.accountNo} oninput={handleBankFieldChange}>
                    </div>
                    <div class="col-12">
                      <label class="form-label">IFSC Code</label>
                      <input type="text" class="form-control" name="ifscCode" value={bankForm.ifscCode} oninput={handleBankFieldChange}>
                    </div>
                    <div class="col-12">
                      <label class="form-label">Branch Address</label>
                      <input type="text" class="form-control" name="branch" value={bankForm.branch} oninput={handleBankFieldChange}>
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-white border me-2" onclick={handleCloseBankModal}>Cancel</button>
                  <button type="submit" class="btn btn-primary px-4">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- MODAL 5: FAMILY INFORMATION MODAL                                         -->
      <!-- ========================================================================= -->
      <template if:true={isFamilyModalOpen}>
        <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h4 class="modal-title fw-bold">Family Information</h4>
                <button type="button" class="btn-close custom-btn-close" onclick={handleCloseFamilyModal}>
                  <i class="ti ti-x"></i>
                </button>
              </div>
              <form onsubmit={handleSaveFamily}>
                <div class="modal-body pb-0">
                  <div class="row g-3">
                    <div class="col-12">
                      <label class="form-label">Name <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" name="name" value={familyForm.name} oninput={handleFamilyFieldChange} required>
                    </div>
                    <div class="col-12">
                      <label class="form-label">Relationship</label>
                      <input type="text" class="form-control" name="relationship" value={familyForm.relationship} oninput={handleFamilyFieldChange}>
                    </div>
                    <div class="col-12">
                      <label class="form-label">Phone</label>
                      <input type="tel" class="form-control" name="phone" value={familyForm.phone} oninput={handleFamilyFieldChange}>
                    </div>
                    <div class="col-12">
                      <label class="form-label">Date of Birth</label>
                      <input type="text" class="form-control" name="dateOfBirth" value={familyForm.dateOfBirth} oninput={handleFamilyFieldChange} placeholder="e.g. 25 May 2014">
                    </div>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-white border me-2" onclick={handleCloseFamilyModal}>Cancel</button>
                  <button type="submit" class="btn btn-primary px-4">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- MODAL 6: ABOUT EMPLOYEE MODAL                                             -->
      <!-- ========================================================================= -->
      <template if:true={isAboutModalOpen}>
        <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h4 class="modal-title fw-bold">About Employee</h4>
                <button type="button" class="btn-close custom-btn-close" onclick={handleCloseAboutModal}>
                  <i class="ti ti-x"></i>
                </button>
              </div>
              <form onsubmit={handleSaveAbout}>
                <div class="modal-body pb-0">
                  <div class="mb-3">
                    <label class="form-label">About / Bio Description</label>
                    <textarea class="form-control" rows="5" value={aboutForm.about} oninput={handleAboutFieldChange}></textarea>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-white border me-2" onclick={handleCloseAboutModal}>Cancel</button>
                  <button type="submit" class="btn btn-primary px-4">Save</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- MODAL 7: ADD / EDIT FULL EMPLOYEE MODAL                                   -->
      <!-- ========================================================================= -->
      <template if:true={isAddEditModalOpen}>
        <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h4 class="modal-title fw-bold">{modalTitle}</h4>
                <button type="button" class="btn-close custom-btn-close" onclick={handleCloseAddEditModal}>
                  <i class="ti ti-x"></i>
                </button>
              </div>
              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium">First Name</label>
                    <input type="text" class="form-control" name="FirstName" value={employeeForm.FirstName} oninput={handleFormFieldChange}>
                  </div>
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium">Last Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="LastName" value={employeeForm.LastName} oninput={handleFormFieldChange} required>
                  </div>
                  <div class="col-12">
                    <label class="form-label fs-13 fw-medium">Email</label>
                    <input type="email" class="form-control" name="Email" value={employeeForm.Email} oninput={handleFormFieldChange}>
                  </div>
                  <div class="col-12">
                    <label class="form-label fs-13 fw-medium">Phone</label>
                    <input type="tel" class="form-control" name="Phone" value={employeeForm.Phone} oninput={handleFormFieldChange}>
                  </div>
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium">Designation / Title</label>
                    <input type="text" class="form-control" name="Title" value={employeeForm.Title} oninput={handleFormFieldChange} placeholder="e.g. Software Developer">
                  </div>
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium">Department</label>
                    <input type="text" class="form-control" name="Department" value={employeeForm.Department} oninput={handleFormFieldChange} placeholder="e.g. Engineering">
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-white border" onclick={handleCloseAddEditModal}>Cancel</button>
                <button type="button" class="btn btn-primary" onclick={handleSaveEmployee}>Save Employee</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- MODAL 8: DELETE CONFIRMATION MODAL                                        -->
      <!-- ========================================================================= -->
      <template if:true={isDeleteModalOpen}>
        <div class="modal fade show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
          <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content shadow text-center p-4">
              <div class="text-danger mb-3">
                <i class="fa-solid fa-trash-can fs-1"></i>
              </div>
              <h5 class="fw-bold mb-2">Delete Employee</h5>
              <p class="text-muted fs-13 mb-4">
                Are you sure you want to delete <strong>{employeeToDelete.name}</strong>? This action cannot be undone.
              </p>
              <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-white border px-3" onclick={handleCloseDeleteModal}>Cancel</button>
                <button type="button" class="btn btn-danger px-3" onclick={handleConfirmDelete}>Delete</button>
              </div>
            </div>
          </div>
        </div>
      </template>

    </div>
  </div>
</template>
