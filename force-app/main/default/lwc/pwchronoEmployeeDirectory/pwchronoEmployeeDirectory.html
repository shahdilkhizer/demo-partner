<template lwc:render-mode="light">
  <div class="page-wrapper">
    <div class="content">
      <!-- ========================================================================= -->
      <!-- TOP BREADCRUMB & ACTIONS                                                  -->
      <!-- ========================================================================= -->
      <template if:false={isDetailView}>
        <div
          class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
        >
          <div class="my-auto mb-2">
            <h2 class="mb-1">{headerTitle}</h2>
            <nav>
              <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                  <a href="javascript:void(0);"
                    ><i class="fa-solid fa-house"></i
                  ></a>
                </li>
                <li class="breadcrumb-item">Employees</li>
                <li class="breadcrumb-item active" aria-current="page">
                  {headerTitle}
                </li>
              </ol>
            </nav>
          </div>
          <div
            class="d-flex my-xl-auto right-content align-items-center flex-wrap"
          >
            <!-- View Switch Toggle (List vs Grid) -->
            <div class="me-2 mb-2">
              <div
                class="d-flex align-items-center border bg-white rounded p-1 me-2 icon-list"
              >
                <button
                  type="button"
                  class={listBtnClass}
                  onclick={switchToList}
                  title="List View"
                  aria-label="List View"
                  aria-pressed={isListView}
                >
                  <i class="fa-solid fa-list-ul"></i>
                </button>
                <button
                  type="button"
                  class={gridBtnClass}
                  onclick={switchToGrid}
                  title="Grid View"
                  aria-label="Grid View"
                  aria-pressed={isGridView}
                >
                  <i class="fa-solid fa-table-cells-large"></i>
                </button>
              </div>
            </div>
            <div class="me-2 mb-2">
              <button
                type="button"
                class="btn btn-white"
                onclick={handleExport}
                disabled={isLoading}
              >
                <i class="ti ti-file-export me-1" aria-hidden="true"></i>Export
                CSV
              </button>
            </div>
            <!-- Add Employee Button -->
            <div class="mb-2">
              <button
                type="button"
                class="btn btn-primary d-flex align-items-center"
                onclick={handleOpenAddModal}
              >
                <i class="fa-solid fa-circle-plus me-2"></i>Add Employee
              </button>
            </div>
          </div>
        </div>
      </template>

      <template if:true={loadError}>
        <div
          class="alert alert-danger d-flex align-items-center justify-content-between gap-3"
          role="alert"
        >
          <span>{loadError}</span>
          <button
            type="button"
            class="btn btn-white"
            onclick={handleRetryDirectory}
            disabled={isLoading}
          >
            Retry
          </button>
        </div>
      </template>
      <template if:true={metricsError}>
        <div class="alert alert-warning" role="status">{metricsError}</div>
      </template>

      <!-- DETAIL VIEW BREADCRUMB -->
      <template if:true={isDetailView}>
        <div
          class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3"
        >
          <div class="my-auto mb-2">
            <h6 class="fw-medium d-inline-flex align-items-center mb-3 mb-sm-0">
              <a
                href="javascript:void(0);"
                onclick={handleBackToList}
                class="text-dark d-inline-flex align-items-center text-decoration-none"
              >
                <i class="fa-solid fa-arrow-left me-2"></i>Employee Details
              </a>
            </h6>
          </div>
          <div
            class="d-flex my-xl-auto right-content align-items-center flex-wrap"
          >
            <div class="mb-2">
              <button
                type="button"
                class="btn btn-primary d-flex align-items-center"
                onclick={handleOpenAddModal}
              >
                <i class="fa-solid fa-circle-plus me-2"></i>Bank &amp; Statutory
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- TOP METRIC CARDS (Shown on List & Grid Views)                             -->
      <!-- ========================================================================= -->
      <template if:false={isDetailView}>
        <div class="row mb-3">
          <!-- Total Employee -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div
                class="card-body d-flex align-items-center justify-content-between p-3"
              >
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span
                      class="avatar avatar-lg bg-dark text-white rounded-circle d-flex align-items-center justify-content-center"
                      style="width: 48px; height: 48px"
                    >
                      <i class="fa-solid fa-users fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">
                      Total Employee
                    </p>
                    <h4 class="mb-0 fw-bold">{metrics.total}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-purple badge-sm fw-normal">
                    Current
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Active -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div
                class="card-body d-flex align-items-center justify-content-between p-3"
              >
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span
                      class="avatar avatar-lg bg-success text-white rounded-circle d-flex align-items-center justify-content-center"
                      style="width: 48px; height: 48px"
                    >
                      <i class="fa-solid fa-user-check fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">
                      Active
                    </p>
                    <h4 class="mb-0 fw-bold text-success">{metrics.active}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-primary badge-sm fw-normal">
                    Current
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- InActive -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div
                class="card-body d-flex align-items-center justify-content-between p-3"
              >
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span
                      class="avatar avatar-lg bg-danger text-white rounded-circle d-flex align-items-center justify-content-center"
                      style="width: 48px; height: 48px"
                    >
                      <i class="fa-solid fa-user-xmark fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">
                      InActive
                    </p>
                    <h4 class="mb-0 fw-bold text-danger">{metrics.inactive}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-dark badge-sm fw-normal">
                    Current
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- New Joiners -->
          <div class="col-lg-3 col-md-6 d-flex">
            <div class="card flex-fill shadow-sm border-0">
              <div
                class="card-body d-flex align-items-center justify-content-between p-3"
              >
                <div class="d-flex align-items-center overflow-hidden">
                  <div>
                    <span
                      class="avatar avatar-lg bg-info text-white rounded-circle d-flex align-items-center justify-content-center"
                      style="width: 48px; height: 48px"
                    >
                      <i class="fa-solid fa-user-plus fs-5"></i>
                    </span>
                  </div>
                  <div class="ms-3 overflow-hidden">
                    <p class="fs-12 fw-medium mb-1 text-muted text-truncate">
                      New Joiners
                    </p>
                    <h4 class="mb-0 fw-bold text-info">{metrics.newJoiners}</h4>
                  </div>
                </div>
                <div>
                  <span class="badge badge-soft-secondary badge-sm fw-normal">
                    Last 30 days
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- VIEW 1: EMPLOYEE LIST VIEW (Images 1 & 2)                                 -->
      <!-- ========================================================================= -->
      <template if:true={isListView}>
        <div class="card shadow-sm border-0">
          <!-- Filter Header -->
          <div
            class="card-header bg-white d-flex align-items-center justify-content-between flex-wrap row-gap-3 py-3 border-bottom"
          >
            <h5 class="mb-0 fw-bold">Employees List</h5>
            <div
              class="d-flex my-xl-auto right-content align-items-center flex-wrap row-gap-2"
            >
              <span class="text-muted fs-13 me-3">{totalCount} employees</span>
              <!-- Designation Filter -->
              <div class="me-3">
                <select
                  class="form-select form-select-sm"
                  onchange={handleDesignationChange}
                  data-filter="selectedDesignation"
                  aria-label="Designation"
                  style="width: 150px"
                >
                  <template for:each={designationOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>
                      {opt.label}
                    </option>
                  </template>
                </select>
              </div>
              <!-- Status Filter -->
              <div class="me-3">
                <select
                  class="form-select form-select-sm"
                  onchange={handleStatusChange}
                  data-filter="selectedStatus"
                  aria-label="Employee status"
                  style="width: 140px"
                >
                  <template for:each={statusOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>
                      {opt.label}
                    </option>
                  </template>
                </select>
              </div>
              <!-- Sort Filter -->
              <div>
                <select
                  class="form-select form-select-sm"
                  onchange={handleSortChange}
                  data-filter="sortBy"
                  aria-label="Sort employees"
                  style="width: 160px"
                >
                  <template for:each={sortOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>
                      Sort By : {opt.label}
                    </option>
                  </template>
                </select>
              </div>
            </div>
          </div>

          <!-- Table Controls: Rows per page & Live Search -->
          <div class="card-body p-0">
            <div
              class="p-3 border-bottom d-flex align-items-center justify-content-between flex-wrap gap-2"
            >
              <div class="d-flex align-items-center gap-2">
                <label class="mb-0 fs-13 text-muted">Row Per Page</label>
                <select
                  class="form-select form-select-sm"
                  style="width: 80px"
                  onchange={handlePageSizeChange}
                  data-filter="pageSize"
                  aria-label="Rows per page"
                >
                  <template for:each={pageSizeOptions} for:item="opt">
                    <option key={opt.value} value={opt.value}>
                      {opt.label}
                    </option>
                  </template>
                </select>
                <span class="fs-13 text-muted">Entries</span>
              </div>
              <div style="width: 250px">
                <input
                  type="search"
                  class="form-control form-control-sm"
                  placeholder="Search..."
                  aria-label="Search employees"
                  value={searchTerm}
                  oninput={handleSearch}
                />
              </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
              <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </template>

            <!-- Table -->
            <template if:false={isLoading}>
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 datatable">
                  <thead class="thead-light bg-light">
                    <tr>
                      <th style="width: 40px" class="ps-3">
                        <div class="form-check form-check-md">
                          <input
                            class="form-check-input"
                            type="checkbox"
                            onchange={handleSelectAll}
                            checked={selectAllChecked}
                          />
                        </div>
                      </th>
                      <th>Emp ID</th>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Phone</th>
                      <th>Designation</th>
                      <th>Joining Date</th>
                      <th>Status</th>
                      <th class="text-end pe-3">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={displayedEmployees} for:item="emp">
                      <tr
                        key={emp.id}
                        class="cursor-pointer"
                        data-id={emp.id}
                        onclick={handleSelectEmployee}
                      >
                        <td class="ps-3" onclick={handleStopPropagation}>
                          <div class="form-check form-check-md">
                            <input
                              class="form-check-input"
                              type="checkbox"
                              data-id={emp.id}
                              onchange={handleSelectRow}
                            />
                          </div>
                        </td>
                        <td>
                          <a
                            href="javascript:void(0);"
                            data-id={emp.id}
                            onclick={handleSelectEmployee}
                            class="fw-medium text-primary text-decoration-none"
                          >
                            {emp.empId}
                          </a>
                        </td>
                        <td>
                          <div class="d-flex align-items-center">
                            <a
                              href="javascript:void(0);"
                              data-id={emp.id}
                              onclick={handleSelectEmployee}
                              class="avatar avatar-md me-2 flex-shrink-0"
                            >
                              <img
                                src={emp.avatarUrl}
                                class="img-fluid rounded-circle"
                                alt="img"
                                style="
                                  width: 38px;
                                  height: 38px;
                                  object-fit: cover;
                                "
                                onerror={handleImageError}
                              />
                            </a>
                            <div>
                              <p class="text-dark fw-medium mb-0">
                                <a
                                  href="javascript:void(0);"
                                  data-id={emp.id}
                                  onclick={handleSelectEmployee}
                                  class="text-dark text-decoration-none"
                                >
                                  {emp.name}
                                </a>
                              </p>
                              <span class="fs-12 text-muted"
                                >{emp.department}</span
                              >
                            </div>
                          </div>
                        </td>
                        <td class="text-muted">{emp.email}</td>
                        <td class="text-muted">{emp.phone}</td>
                        <td>
                          <span
                            class="badge bg-light text-dark border px-2 py-1"
                            >{emp.title}</span
                          >
                        </td>
                        <td class="text-muted">{emp.joiningDate}</td>
                        <td>
                          <span class={emp.statusClass}>
                            <i class="ti ti-point-filled me-1"></i>{emp.status}
                          </span>
                        </td>
                        <td
                          class="text-end pe-3"
                          onclick={handleStopPropagation}
                        >
                          <div class="action-icon d-inline-flex gap-2">
                            <button
                              type="button"
                              class="btn btn-sm btn-icon btn-light text-primary"
                              data-id={emp.id}
                              onclick={handleSelectEmployee}
                              title="View Details"
                            >
                              <i class="fa-solid fa-eye"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-sm btn-icon btn-light text-secondary"
                              data-id={emp.id}
                              onclick={handleOpenEditModal}
                              title="Edit"
                            >
                              <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-sm btn-icon btn-light text-danger"
                              data-id={emp.id}
                              onclick={handleOpenDeleteModal}
                              title="Delete"
                            >
                              <i class="fa-solid fa-trash-can"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    </template>
                    <template if:true={showEmptyEmployees}>
                      <tr>
                        <td colspan="9" class="text-center py-5 text-muted">
                          <i
                            class="ti ti-users fs-32 d-block mb-2 text-muted directory-empty-icon"
                          ></i>
                          No employees found matching the criteria.
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <!-- Pagination footer -->
              <div
                class="p-3 border-top d-flex align-items-center justify-content-between flex-wrap gap-2"
              >
                <div class="text-muted fs-13">
                  Showing {pageInfo} of {totalCount} entries
                </div>
                <nav aria-label="Page navigation">
                  <ul class="pagination pagination-sm mb-0">
                    <li class="page-item">
                      <button
                        type="button"
                        class="page-link"
                        onclick={handlePrevPage}
                        disabled={isPrevDisabled}
                      >
                        <i class="fa-solid fa-chevron-left"></i>
                      </button>
                    </li>
                    <template for:each={paginationPages} for:item="p">
                      <li key={p.number} class={p.className}>
                        <button
                          type="button"
                          class="page-link"
                          data-page={p.number}
                          onclick={handleGoToPage}
                        >
                          {p.number}
                        </button>
                      </li>
                    </template>
                    <li class="page-item">
                      <button
                        type="button"
                        class="page-link"
                        onclick={handleNextPage}
                        disabled={isNextDisabled}
                      >
                        <i class="fa-solid fa-chevron-right"></i>
                      </button>
                    </li>
                  </ul>
                </nav>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- VIEW 2: EMPLOYEE GRID VIEW (Images 3 & 4)                                 -->
      <!-- ========================================================================= -->
      <template if:true={isGridView}>
        <!-- Grid Header Filter Card -->
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-3">
            <div
              class="d-flex align-items-center justify-content-between flex-wrap row-gap-3"
            >
              <h5 class="mb-0 fw-bold">Employees Grid</h5>
              <div class="d-flex align-items-center flex-wrap gap-3">
                <div style="width: 220px">
                  <input
                    type="search"
                    class="form-control form-control-sm"
                    placeholder="Search employees..."
                    aria-label="Search employees"
                    value={searchTerm}
                    oninput={handleSearch}
                  />
                </div>
                <div style="width: 150px">
                  <select
                    class="form-select form-select-sm"
                    onchange={handleDesignationChange}
                    data-filter="selectedDesignation"
                    aria-label="Designation"
                  >
                    <template for:each={designationOptions} for:item="opt">
                      <option key={opt.value} value={opt.value}>
                        {opt.label}
                      </option>
                    </template>
                  </select>
                </div>
                <div style="width: 170px">
                  <select
                    class="form-select form-select-sm"
                    onchange={handleSortChange}
                    data-filter="sortBy"
                    aria-label="Sort employees"
                  >
                    <template for:each={sortOptions} for:item="opt">
                      <option key={opt.value} value={opt.value}>
                        Sort By : {opt.label}
                      </option>
                    </template>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </template>

        <!-- Grid of Employee Cards -->
        <template if:false={isLoading}>
          <div class="row">
            <template for:each={displayedEmployees} for:item="emp">
              <div
                key={emp.id}
                class="col-12 col-md-6 col-xl-4 col-xxl-3 d-flex"
              >
                <article class="card flex-fill employee-grid-card">
                  <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-3">
                      <c-pwchrono-avatar
                        name={emp.name}
                        image-url={emp.avatarUrl}
                        alt-text={emp.name}
                        container-class="avatar avatar-lg flex-shrink-0"
                        image-class="rounded"
                        title-class="avatar-title rounded"
                      ></c-pwchrono-avatar>
                      <div class="employee-identity">
                        <h6 class="mb-1">
                          <button
                            type="button"
                            class="employee-name"
                            data-id={emp.id}
                            onclick={handleSelectEmployee}
                          >
                            {emp.name}
                          </button>
                        </h6>
                        <p class="mb-0 text-truncate" title={emp.email}>
                          {emp.email}
                        </p>
                      </div>
                    </div>
                    <dl class="bg-light rounded p-2 mb-3">
                      <div class="d-flex justify-content-between gap-2 mb-2">
                        <dt class="fw-normal">Designation</dt>
                        <dd class="text-dark fw-medium text-end mb-0">
                          {emp.title}
                        </dd>
                      </div>
                      <div class="d-flex justify-content-between gap-2 mb-2">
                        <dt class="fw-normal">Department</dt>
                        <dd class="text-dark fw-medium text-end mb-0">
                          {emp.department}
                        </dd>
                      </div>
                      <div class="d-flex justify-content-between gap-2">
                        <dt class="fw-normal">Employee ID</dt>
                        <dd class="text-dark fw-medium mb-0">{emp.empId}</dd>
                      </div>
                    </dl>
                    <button
                      type="button"
                      class="btn btn-white w-100"
                      data-id={emp.id}
                      onclick={handleSelectEmployee}
                    >
                      View profile
                    </button>
                  </div>
                </article>
              </div>
            </template>
          </div>

          <!-- Empty Grid state -->
          <template if:true={showEmptyEmployees}>
            <div class="card p-5 text-center shadow-sm border-0 mt-3">
              <i class="fa-solid fa-users-slash fs-1 text-secondary mb-2"></i>
              <h5 class="text-muted">No employees found</h5>
              <p class="text-muted fs-13">Try clearing search or filters.</p>
            </div>
          </template>

          <!-- Grid Pagination footer -->
          <div
            class="p-3 mt-4 border bg-white rounded d-flex align-items-center justify-content-between flex-wrap gap-2"
          >
            <div class="text-muted fs-13">
              Showing {pageInfo} of {totalCount} entries
            </div>
            <nav aria-label="Page navigation">
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item">
                  <button
                    type="button"
                    class="page-link"
                    onclick={handlePrevPage}
                    disabled={isPrevDisabled}
                  >
                    <i class="fa-solid fa-chevron-left"></i>
                  </button>
                </li>
                <template for:each={paginationPages} for:item="p">
                  <li key={p.number} class={p.className}>
                    <button
                      type="button"
                      class="page-link"
                      data-page={p.number}
                      onclick={handleGoToPage}
                    >
                      {p.number}
                    </button>
                  </li>
                </template>
                <li class="page-item">
                  <button
                    type="button"
                    class="page-link"
                    onclick={handleNextPage}
                    disabled={isNextDisabled}
                  >
                    <i class="fa-solid fa-chevron-right"></i>
                  </button>
                </li>
              </ul>
            </nav>
          </div>
        </template>
      </template>

      <!-- ========================================================================= -->
      <!-- VIEW 3: EMPLOYEE DETAIL VIEW (Image 5)                                    -->
      <!-- ========================================================================= -->
      <template if:true={isDetailView}>
        <div if:true={selectedEmployee} class="row g-4">
          <!-- LEFT COLUMN: Profile & Personal Cards (col-xl-4) -->
          <div class="col-xl-4 col-lg-5">
            <!-- Main Profile Card -->
            <div class="card shadow-sm border-0 mb-4 overflow-hidden">
              <div class="card-body p-0">
                <!-- Warm Gradient Top Header Banner -->
                <div
                  class="p-4 text-center text-white"
                  style="
                    background: linear-gradient(
                      135deg,
                      #f97316 0%,
                      #ea580c 50%,
                      #c2410c 100%
                    );
                  "
                >
                  <span
                    class="avatar avatar-xl rounded-circle border border-3 border-white mx-auto d-inline-block shadow mb-2"
                    style="width: 80px; height: 80px"
                  >
                    <img
                      src={selectedEmployee.avatarUrl}
                      class="img-fluid rounded-circle"
                      alt="Img"

                      <div class="row g-3">
                        <div class="col-sm-6 col-md-3">
                          <span class="text-muted fs-12 d-block">Brand / Model</span>
                          <strong class="text-dark fs-13"
                            >{selectedEmployee.assetInfo.brand} {selectedEmployee.assetInfo.model}</strong
                          >
                        </div>
                        <div class="col-sm-6 col-md-3">
                          <span class="text-muted fs-12 d-block">Processor</span>
                          <strong class="text-dark fs-13"
                            >{selectedEmployee.assetInfo.processorType}</strong
                          >
                        </div>
                        <div class="col-sm-6 col-md-3">
                          <span class="text-muted fs-12 d-block">RAM & Storage</span>
                          <strong class="text-dark fs-13"
                            >{selectedEmployee.assetInfo.ram} / {selectedEmployee.assetInfo.storage}</strong
                          >
                        </div>
                        <div class="col-sm-6 col-md-3">
                          <span class="text-muted fs-12 d-block">Screen Size</span>
                          <strong class="text-dark fs-13"
                            >{selectedEmployee.assetInfo.screenSize}</strong
                          >
                        </div>
                      </div>
                    </div>
                  </template>
                  <template
                    if:false={selectedEmployee.assetInfo.hasAssetInformation}
                  >
                    <div class="text-center py-4 text-muted" role="status">
                      <div
                        class="avatar avatar-xl bg-light text-muted rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center"
                        style="width: 56px; height: 56px"
                      >
                        <i class="fa-solid fa-laptop fs-24 text-secondary"></i>
                      </div>
                      <h6 class="fw-semibold text-dark mb-1">
                        No Assets Assigned
                      </h6>
                      <p class="text-muted fs-13 mb-0">
                        No assigned asset information is available.
                      </p>
                    </div>
                  </template>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- ADD / EDIT EMPLOYEE MODAL                                                 -->
      <!-- ========================================================================= -->
      <template if:true={isAddEditModalOpen}>
        <div
          class="modal fade show d-block"
          tabindex="-1"
          style="background-color: rgba(0, 0, 0, 0.5)"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h5 class="modal-title fw-bold">{modalTitle}</h5>
                <button
                  type="button"
                  class="btn-close"
                  onclick={handleCloseAddEditModal}
                ></button>
              </div>
              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium">First Name</label>
                    <input
                      type="text"
                      class="form-control"
                      name="FirstName"
                      value={employeeForm.FirstName}
                      oninput={handleFormFieldChange}
                    />
                  </div>
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium"
                      >Last Name <span class="text-danger">*</span></label
                    >
                    <input
                      type="text"
                      class="form-control"
                      name="LastName"
                      value={employeeForm.LastName}
                      oninput={handleFormFieldChange}
                      required
                    />
                  </div>
                  <div class="col-12">
                    <label class="form-label fs-13 fw-medium">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      name="Email"
                      value={employeeForm.Email}
                      oninput={handleFormFieldChange}
                    />
                  </div>
                  <div class="col-12">
                    <label class="form-label fs-13 fw-medium">Phone</label>
                    <input
                      type="tel"
                      class="form-control"
                      name="Phone"
                      value={employeeForm.Phone}
                      oninput={handleFormFieldChange}
                    />
                  </div>
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium"
                      >Designation / Title</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      name="Title"
                      value={employeeForm.Title}
                      oninput={handleFormFieldChange}
                      placeholder="e.g. Software Developer"
                    />
                  </div>
                  <div class="col-6">
                    <label class="form-label fs-13 fw-medium">Department</label>
                    <input
                      type="text"
                      class="form-control"
                      name="Department"
                      value={employeeForm.Department}
                      oninput={handleFormFieldChange}
                      placeholder="e.g. Engineering"
                    />
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-white"
                  onclick={handleCloseAddEditModal}
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  onclick={handleSaveEmployee}
                >
                  Save Employee
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- EDIT ABOUT EMPLOYEE MODAL                                                -->
      <!-- ========================================================================= -->
      <template if:true={isAboutModalOpen}>
        <div
          class="modal fade show d-block"
          tabindex="-1"
          style="background-color: rgba(0, 0, 0, 0.5)"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
              <div class="modal-header">
                <h5 class="modal-title fw-bold">Edit About Employee</h5>
                <button
                  type="button"
                  class="btn-close"
                  onclick={handleCloseAboutModal}
                ></button>
              </div>
              <div class="modal-body">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label fs-13 fw-medium">About Employee / Bio</label>
                    <textarea
                      class="form-control"
                      rows="5"
                      value={aboutEmployeeText}
                      oninput={handleAboutTextChange}
                      placeholder="Enter a brief summary or bio about the employee..."
                    ></textarea>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-white"
                  onclick={handleCloseAboutModal}
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-primary"
                  onclick={handleSaveAboutEmployee}
                >
                  Save Changes
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ========================================================================= -->
      <!-- DELETE CONFIRMATION MODAL                                                 -->
      <!-- ========================================================================= -->
      <template if:true={isDeleteModalOpen}>
        <div
          class="modal fade show d-block"
          tabindex="-1"
          style="background-color: rgba(0, 0, 0, 0.5)"
        >
          <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content shadow text-center p-4">
              <div class="text-danger mb-3">
                <i class="fa-solid fa-trash-can fs-1"></i>
              </div>
              <h5 class="fw-bold mb-2">Delete Employee</h5>
              <p class="text-muted fs-13 mb-4">
                Are you sure you want to delete
                <strong>{employeeToDelete.name}</strong>? This action cannot be
                undone.
              </p>
              <div class="d-flex justify-content-center gap-2">
                <button
                  type="button"
                  class="btn btn-white px-3"
                  onclick={handleCloseDeleteModal}
                >
                  Cancel
                </button>
                <button
                  type="button"
                  class="btn btn-danger px-3"
                  onclick={handleConfirmDelete}
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
