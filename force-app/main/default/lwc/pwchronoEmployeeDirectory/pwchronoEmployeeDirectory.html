<template>
  <div class="page-wrapper">
    <div class="content container-fluid">

      <!-- Page Header -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">Employee Directory</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item active">Employee Directory</li>
            </ol>
          </nav>
        </div>
        <div class="d-flex my-xl-auto right-content align-items-center gap-2">
          <div class="input-group input-group-sm" style="width: 260px;">
            <span class="input-group-text bg-white">
              <i class="ti ti-search text-muted"></i>
            </span>
            <lightning-input
              type="search"
              placeholder="Search employees..."
              onchange={handleSearch}
              variant="label-hidden"
              class="flex-fill"
            ></lightning-input>
          </div>
        </div>
      </div>

      <!-- Loading -->
      <template if:true={isLoading}>
        <div class="d-flex align-items-center justify-content-center p-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </template>

      <!-- Error -->
      <template if:true={loadError}>
        <div class="alert alert-danger d-flex align-items-center gap-3" role="alert">
          <i class="ti ti-alert-circle fs-4 flex-shrink-0"></i>
          <div>
            <strong>Error loading employees</strong>
            <p class="mb-0 small">{loadError}</p>
          </div>
        </div>
      </template>

      <template if:true={employees}>
        <template if:true={employees.length}>

          <!-- Results info + page size -->
          <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
            <p class="mb-0 text-muted small">
              Showing <strong>{pageInfo}</strong> of <strong>{totalCount}</strong> employees
            </p>
            <lightning-combobox
              value={pageSize}
              options={pageSizeOptions}
              onchange={handlePageSizeChange}
              variant="label-hidden"
            ></lightning-combobox>
          </div>

          <!-- Employee Grid -->
          <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
            <template for:each={employees} for:item="emp">
              <div key={emp.Id} class="col">
                <div class="card h-100 employee-card">
                  <button
                    type="button"
                    class="emp-card-overlay"
                    onclick={handleNavigate}
                    data-id={emp.Id}
                  >
                    <span class="visually-hidden">View {emp.Name}</span>
                  </button>

                  <!-- Card header / avatar section -->
                  <div class="card-header text-center pb-3 pt-4 bg-light border-bottom">
                    <span class="avatar avatar-xl avatar-rounded bg-primary mx-auto mb-2">
                      <span class="fw-bold fs-4">{emp.initials}</span>
                    </span>
                    <h6 class="mb-0 text-truncate" title={emp.Name}>{emp.Name}</h6>
                    <span class="badge bg-soft-primary text-primary mt-1">{emp.Designation__c}</span>
                  </div>

                  <!-- Card body / details -->
                  <div class="card-body p-3">
                    <ul class="list-unstyled mb-0 small">
                      <li class="d-flex align-items-start gap-2 mb-2">
                        <i class="ti ti-building text-muted mt-1 flex-shrink-0"></i>
                        <div>
                          <span class="text-muted d-block" style="font-size: 10px; text-transform: uppercase; letter-spacing: .5px;">Department</span>
                          <span class="text-truncate d-block" title={emp.Department__c}>{emp.Department__c}</span>
                        </div>
                      </li>
                      <li class="d-flex align-items-start gap-2 mb-2">
                        <i class="ti ti-mail text-muted mt-1 flex-shrink-0"></i>
                        <div class="min-w-0">
                          <span class="text-muted d-block" style="font-size: 10px; text-transform: uppercase; letter-spacing: .5px;">Email</span>
                          <lightning-formatted-email value={emp.Email__c}></lightning-formatted-email>
                        </div>
                      </li>
                      <li class="d-flex align-items-start gap-2 mb-2">
                        <i class="ti ti-phone text-muted mt-1 flex-shrink-0"></i>
                        <div>
                          <span class="text-muted d-block" style="font-size: 10px; text-transform: uppercase; letter-spacing: .5px;">Phone</span>
                          <lightning-formatted-phone value={emp.Phone__c}></lightning-formatted-phone>
                        </div>
                      </li>
                      <template if:true={emp.managerName}>
                        <li class="d-flex align-items-start gap-2">
                          <i class="ti ti-user text-muted mt-1 flex-shrink-0"></i>
                          <div>
                            <span class="text-muted d-block" style="font-size: 10px; text-transform: uppercase; letter-spacing: .5px;">Manager</span>
                            <span class="text-truncate d-block" title={emp.managerName}>{emp.managerName}</span>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Pagination -->
          <div class="d-flex align-items-center justify-content-between mt-4 py-3 border-top flex-wrap gap-2">
            <span class="text-muted small">{pageInfo} of {totalCount}</span>
            <div class="d-flex gap-2">
              <button
                class="btn btn-sm btn-outline-secondary"
                onclick={handlePrevPage}
                disabled={isPrevDisabled}
              >
                <i class="ti ti-chevron-left me-1"></i>Previous
              </button>
              <button
                class="btn btn-sm btn-outline-secondary"
                onclick={handleNextPage}
                disabled={isNextDisabled}
              >
                Next<i class="ti ti-chevron-right ms-1"></i>
              </button>
            </div>
          </div>

        </template>

        <!-- Empty state -->
        <template if:false={employees.length}>
          <div class="card">
            <div class="card-body text-center py-5">
              <i class="ti ti-users-off fs-1 text-muted d-block mb-2"></i>
              <h6 class="text-muted mb-1">No employees found</h6>
              <p class="text-muted small mb-0">Try adjusting your search criteria</p>
            </div>
          </div>
        </template>
      </template>

    </div>
  </div>
</template>
