<template
  ><div class="page-wrapper">
    <div class="content container-fluid p-4">
      <div class="d-flex justify-content-between gap-3 mb-4">
        <div>
          <h2>Leave Settings</h2>
          <p class="text-muted">Manage leave types and their limits.</p>
        </div>
        <button
          type="button"
          class="btn btn-primary"
          onclick={handleAddLeaveType}
          disabled={isLoading}
        >
          Add Leave Type
        </button>
      </div>
      <template if:true={errorMessage}
        ><div class="alert alert-danger" role="alert">
          {errorMessage}
        </div></template
      ><template if:true={successMessage}
        ><div class="alert alert-success" role="status">
          {successMessage}
        </div></template
      ><template if:true={isLoading}><p role="status">Loading…</p></template>
      <div class="row">
        <template for:each={leaveTypes} for:item="type"
          ><div key={type.Id} class="col-md-6 col-xl-4">
            <section class="card">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <h4>{type.Name}</h4>
                  <span>{type.statusLabel}</span>
                </div>
                <p>Maximum days: {type.Max_Days_Allowed__c}</p>
                <p>Carry-forward limit: {type.carryForwardLimit}</p>
                <button
                  type="button"
                  class="btn btn-white"
                  data-id={type.Id}
                  onclick={handleSettings}
                  disabled={isLoading}
                >
                  Edit settings
                </button>
              </div>
            </section>
          </div></template
        >
      </div>
      <template if:true={showCreateModal}
        ><section
          class="settings-overlay"
          role="dialog"
          aria-modal="true"
          aria-label="Add leave type"
        >
          <div class="card settings-dialog">
            <div class="card-header"><h3>Add leave type</h3></div>
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label me-2" for="showCreateModal-Name"
                  >Leave type name</label
                ><input
                  id="showCreateModal-Name"
                  class="form-control"
                  type="text"
                  data-field="Name"
                  value={newLeaveType.Name}
                  required
                  onchange={handleCreateChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showCreateModal-Max_Days_Allowed__c"
                  >Maximum days</label
                ><input
                  id="showCreateModal-Max_Days_Allowed__c"
                  class="form-control"
                  type="number"
                  data-field="Max_Days_Allowed__c"
                  value={newLeaveType.Max_Days_Allowed__c}
                  required
                  min="0"
                  step="0.5"
                  onchange={handleCreateChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showCreateModal-Max_Carry_Forward_Days__c"
                  >Maximum carry-forward days</label
                ><input
                  id="showCreateModal-Max_Carry_Forward_Days__c"
                  class="form-control"
                  type="number"
                  data-field="Max_Carry_Forward_Days__c"
                  value={newLeaveType.Max_Carry_Forward_Days__c}
                  required
                  min="0"
                  step="0.5"
                  onchange={handleCreateChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showCreateModal-Is_Carry_Forward__c"
                  >Allow carry forward</label
                ><input
                  id="showCreateModal-Is_Carry_Forward__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Is_Carry_Forward__c"
                  checked={newLeaveType.Is_Carry_Forward__c}
                  onchange={handleCreateChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showCreateModal-Requires_Approval__c"
                  >Requires approval</label
                ><input
                  id="showCreateModal-Requires_Approval__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Requires_Approval__c"
                  checked={newLeaveType.Requires_Approval__c}
                  onchange={handleCreateChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showCreateModal-Requires_Certificate__c"
                  >Requires certificate</label
                ><input
                  id="showCreateModal-Requires_Certificate__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Requires_Certificate__c"
                  checked={newLeaveType.Requires_Certificate__c}
                  onchange={handleCreateChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showCreateModal-Is_Active__c"
                  >Active</label
                ><input
                  id="showCreateModal-Is_Active__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Is_Active__c"
                  checked={newLeaveType.Is_Active__c}
                  onchange={handleCreateChange}
                  disabled={isLoading}
                />
              </div>
              <template if:true={errorMessage}
                ><p class="text-danger" role="alert">
                  {errorMessage}
                </p></template
              >
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-white"
                onclick={closeCreateModal}
                disabled={isLoading}
              >
                Cancel</button
              ><button
                type="button"
                class="btn btn-primary"
                onclick={createLeaveType}
                disabled={isLoading}
              >
                Save
              </button>
            </div>
          </div>
        </section></template
      ><template if:true={showSettingsModal}
        ><section
          class="settings-overlay"
          role="dialog"
          aria-modal="true"
          aria-label="Edit leave type"
        >
          <div class="card settings-dialog">
            <div class="card-header"><h3>Edit leave type</h3></div>
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label me-2" for="showSettingsModal-Name"
                  >Leave type name</label
                ><input
                  id="showSettingsModal-Name"
                  class="form-control"
                  type="text"
                  data-field="Name"
                  value={selectedLeaveType.Name}
                  required
                  onchange={handleSettingChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showSettingsModal-Max_Days_Allowed__c"
                  >Maximum days</label
                ><input
                  id="showSettingsModal-Max_Days_Allowed__c"
                  class="form-control"
                  type="number"
                  data-field="Max_Days_Allowed__c"
                  value={selectedLeaveType.Max_Days_Allowed__c}
                  required
                  min="0"
                  step="0.5"
                  onchange={handleSettingChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showSettingsModal-Max_Carry_Forward_Days__c"
                  >Maximum carry-forward days</label
                ><input
                  id="showSettingsModal-Max_Carry_Forward_Days__c"
                  class="form-control"
                  type="number"
                  data-field="Max_Carry_Forward_Days__c"
                  value={selectedLeaveType.Max_Carry_Forward_Days__c}
                  required
                  min="0"
                  step="0.5"
                  onchange={handleSettingChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showSettingsModal-Is_Carry_Forward__c"
                  >Allow carry forward</label
                ><input
                  id="showSettingsModal-Is_Carry_Forward__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Is_Carry_Forward__c"
                  checked={selectedLeaveType.Is_Carry_Forward__c}
                  onchange={handleSettingChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showSettingsModal-Requires_Approval__c"
                  >Requires approval</label
                ><input
                  id="showSettingsModal-Requires_Approval__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Requires_Approval__c"
                  checked={selectedLeaveType.Requires_Approval__c}
                  onchange={handleSettingChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showSettingsModal-Requires_Certificate__c"
                  >Requires certificate</label
                ><input
                  id="showSettingsModal-Requires_Certificate__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Requires_Certificate__c"
                  checked={selectedLeaveType.Requires_Certificate__c}
                  onchange={handleSettingChange}
                  disabled={isLoading}
                />
              </div>
              <div class="mb-3">
                <label
                  class="form-label me-2"
                  for="showSettingsModal-Is_Active__c"
                  >Active</label
                ><input
                  id="showSettingsModal-Is_Active__c"
                  class="form-check-input"
                  type="checkbox"
                  data-field="Is_Active__c"
                  checked={selectedLeaveType.Is_Active__c}
                  onchange={handleSettingChange}
                  disabled={isLoading}
                />
              </div>
              <template if:true={errorMessage}
                ><p class="text-danger" role="alert">
                  {errorMessage}
                </p></template
              >
            </div>
            <div class="card-footer d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-white"
                onclick={closeSettingsModal}
                disabled={isLoading}
              >
                Cancel</button
              ><button
                type="button"
                class="btn btn-primary"
                onclick={saveSettings}
                disabled={isLoading}
              >
                Save
              </button>
            </div>
          </div>
        </section></template
      >
    </div>
  </div></template
>
