<template lwc:render-mode="light">
  <div class="recruitment-pipeline-container">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h5 class="mb-0 fw-bold text-dark">Candidate Pipeline</h5>
        <small class="text-muted">Drag and drop candidates across hiring stages</small>
      </div>
      <button class="btn btn-sm btn-outline-primary d-flex align-items-center gap-2" onclick={handleRefresh}>
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>

      <!-- Access Denied -->
      <template if:false={hasAccess}>
        <div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
          <div class="card text-center" style="max-width: 420px; width: 100%;">
            <div class="card-body p-5">
              <div class="avatar avatar-xl bg-soft-danger mx-auto mb-3">
                <i class="ti ti-lock fs-1 text-danger"></i>
              </div>
              <h4 class="mb-2">Access Denied</h4>
              <p class="text-muted mb-0">
                You do not have permission to view the Recruitment Pipeline.
              </p>
            </div>
          </div>
        </div>
      </template>

      <template if:true={hasAccess}>
        <div class="card">
          <div class="card-body">

            <!-- Loading -->
            <template if:true={isLoading}>
              <div class="d-flex align-items-center justify-content-center p-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </template>

            <!-- Error -->
            <template if:true={error}>
              <div class="alert alert-danger d-flex align-items-center gap-3" role="alert">
                <i class="ti ti-alert-circle fs-4 flex-shrink-0"></i>
                <div>
                  <strong>Error loading recruitment pipeline</strong>
                  <p class="mb-0 small">{error}</p>
                </div>
              </div>
            </template>

            <!-- Kanban Board -->
            <template if:false={isLoading}>
              <div class="kanban-wrapper">
                <template for:each={columns} for:item="column">
                  <div
                    key={column.value}
                    class="kanban-column-wrap"
                    data-status={column.value}
                    ondragover={handleDragOver}
                    ondragleave={handleDragLeave}
                    ondrop={handleDrop}
                  >
                    <!-- Column Header -->
                    <div class="kanban-col-header d-flex align-items-center justify-content-between mb-2 px-1">
                      <span class="fw-semibold text-dark">{column.label}</span>
                      <span class="badge bg-primary rounded-pill">{column.count}</span>
                    </div>
                    <!-- Column Cards -->
                    <ul
                      class="kanban-col-body list-unstyled m-0 p-0"
                      data-status={column.value}
                      aria-label={column.label}
                      ondragover={handleDragOver}
                      ondragleave={handleDragLeave}
                      ondrop={handleDrop}
                    >
                      <template for:each={column.applicants} for:item="applicant">
                        <li key={applicant.Id} class="kanban-card-item">
                          <button
                            type="button"
                            class="kanban-card w-100 text-start"
                            draggable="true"
                            data-id={applicant.Id}
                            data-status={column.value}
                            ondragstart={handleDragStart}
                            ondragend={handleDragEnd}
                            ondragover={handleDragOver}
                            ondragleave={handleDragLeave}
                            ondrop={handleDrop}
                          >
                            <h6 class="mb-1 text-dark fw-bold">{applicant.applicantName}</h6>
                            <p class="mb-1 text-muted small">{applicant.jobTitle}</p>
                            <p class="mb-2 text-muted small">
                              <i class="fa-solid fa-calendar me-1"></i>{applicant.formattedDate}
                            </p>
                            <div class="d-flex align-items-center justify-content-between">
                              <span class="badge bg-soft-info text-info">{applicant.Status__c}</span>
                            </div>
                          </button>
                        </li>
                      </template>
                      <!-- Drop target for empty columns -->
                      <li>
                        <button
                          type="button"
                          class="kanban-drop-target w-100 bg-transparent border-0 p-2"
                          data-status={column.value}
                          ondragover={handleDragOver}
                          ondragleave={handleDragLeave}
                          ondrop={handleDrop}
                        >
                          <span class="visually-hidden">Drop here</span>
                        </button>
                      </li>
                    </ul>
                  </div>
                </template>
              </div>
            </template>

          </div>
        </div>
      </template>
  </div>
</template>
