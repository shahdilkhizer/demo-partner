<template>
  <div class="page-wrapper">
    <div class="content container-fluid">

      <!-- Page Header -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">Apply for Leave</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item">Leave Management</li>
              <li class="breadcrumb-item active">Apply for Leave</li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h5 class="card-title mb-0">
            <i class="ti ti-calendar-plus me-2 text-primary"></i>New Leave Request
          </h5>
        </div>
        <div class="card-body">

          <!-- Loading -->
          <template if:true={isLoading}>
            <div class="d-flex align-items-center justify-content-center p-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </template>

          <div class="row g-3">

            <!-- Leave Type -->
            <div class="col-12 col-md-6">
              <lightning-combobox
                name="leaveType"
                label="Leave Type"
                value={leaveRecord.Leave_Type__c}
                placeholder="Select Leave Type"
                options={leaveTypeOptions}
                onchange={handleLeaveTypeChange}
                required
              ></lightning-combobox>
            </div>

            <!-- Balance Display -->
            <div class="col-12 col-md-6 d-flex align-items-end">
              <template if:true={selectedLeaveBalance}>
                <div class="alert alert-success w-100 mb-0 py-2 px-3">
                  <i class="ti ti-info-circle me-1"></i>
                  <strong>Available Balance:</strong> {selectedLeaveBalance} days
                </div>
              </template>
            </div>

            <!-- From Date -->
            <div class="col-12 col-md-6">
              <lightning-input
                type="date"
                name="fromDate"
                label="From Date"
                value={leaveRecord.From_Date__c}
                onchange={handleDateChange}
                required
              ></lightning-input>
            </div>

            <!-- To Date -->
            <div class="col-12 col-md-6">
              <lightning-input
                type="date"
                name="toDate"
                label="To Date"
                value={leaveRecord.To_Date__c}
                onchange={handleDateChange}
                required
              ></lightning-input>
            </div>

            <!-- Half Day -->
            <div class="col-12">
              <lightning-input
                type="checkbox"
                label="Half Day"
                checked={leaveRecord.Half_Day__c}
                onchange={handleHalfDayChange}
              ></lightning-input>
            </div>

            <!-- Notice -->
            <div class="col-12">
              <p class="text-muted small mb-0">
                <i class="ti ti-info-circle me-1"></i>
                Total days will be calculated upon submission based on working days and holidays.
              </p>
            </div>

            <!-- Reason -->
            <div class="col-12">
              <lightning-textarea
                name="reason"
                label="Reason"
                value={leaveRecord.Reason__c}
                onchange={handleReasonChange}
                required
              ></lightning-textarea>
            </div>

          </div>

          <!-- Actions -->
          <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <button class="btn btn-light" onclick={handleCancel}>
              <i class="ti ti-x me-1"></i>Cancel
            </button>
            <button
              class="btn btn-primary"
              onclick={handleSubmit}
              disabled={isSubmitDisabled}
            >
              <i class="ti ti-send me-1"></i>Submit Application
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</template>
