<template>
  <div class="page-wrapper" style="margin-left: 0 !important; padding-top: 20px !important; padding-left: 20px !important; padding-right: 20px !important; min-height: 732px;">
    <!-- Start Content -->
    <div class="content" style="padding: 0 !important;">

      <!-- Breadcrumb -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">Probation Management</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item">
                HRM
              </li>
              <li class="breadcrumb-item active" aria-current="page">Probation Management</li>
            </ol>
          </nav>
        </div>
        <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
          <div class="mb-2 me-2 position-relative">
            <button type="button" class="btn btn-white d-inline-flex align-items-center border" onclick={toggleExportDropdown}>
              <i class="ti ti-file-export me-1"></i>Export
            </button>
            <template if:true={isExportOpen}>
              <ul class="dropdown-menu dropdown-menu-end p-2 show sort-menu-custom">
                <li>
                  <a href="javascript:void(0);" class="dropdown-item rounded-1" onclick={exportPDF}><i class="ti ti-file-type-pdf me-1"></i>Export as PDF</a>
                </li>
                <li>
                  <a href="javascript:void(0);" class="dropdown-item rounded-1" onclick={exportExcel}><i class="ti ti-file-type-xls me-1"></i>Export as Excel</a>
                </li>
              </ul>
            </template>
          </div>
          <div class="mb-2">
            <button type="button" class="btn btn-primary d-flex align-items-center" onclick={openAddModal}>
              <i class="ti ti-circle-plus me-2"></i>Add New Employee
            </button>
          </div>
          <div class="head-icons ms-2">
            <a href="javascript:void(0);" class="btn-collapse" onclick={toggleCollapse} title="Collapse">
              <i class={collapseIcon}></i>
            </a>
          </div>
        </div>
      </div>
      <!-- /Breadcrumb -->

      <template if:false={isCollapsed}>
        <!-- Card -->
        <div class="card">
          <div class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3">
            <h5>Probation Management</h5>
            <div class="d-flex my-xl-auto right-content align-items-center flex-wrap row-gap-3">
              <div class="me-3">
                <div class="input-icon position-relative">
                  <span class="input-icon-addon">
                    <i class="ti ti-calendar text-gray-9"></i>
                  </span>
                  <input type="text" class="form-control" placeholder="Search by name, ID..." value={searchKeyword} oninput={handleSearch}>
                </div>
              </div>
              <div class="position-relative me-3">
                <button type="button" class="btn btn-white d-inline-flex align-items-center border" onclick={toggleDesigDropdown}>
                  {selectedDesignationLabel} <i class="ti ti-chevron-down ms-1"></i>
                </button>
                <template if:true={isDesigOpen}>
                  <ul class="dropdown-menu dropdown-menu-end p-2 show sort-menu-custom" style="max-height: 250px; overflow-y: auto;">
                    <li>
                      <a href="javascript:void(0);" class="dropdown-item rounded-1" data-desig="" onclick={selectDesignation}>All Designations</a>
                    </li>
                    <template for:each={designationOptions} for:item="opt">
                      <li key={opt}>
                        <a href="javascript:void(0);" class="dropdown-item rounded-1" data-desig={opt} onclick={selectDesignation}>{opt}</a>
                      </li>
                    </template>
                  </ul>
                </template>
              </div>
              <div class="position-relative">
                <button type="button" class="btn btn-white d-inline-flex align-items-center border" onclick={toggleSortDropdown}>
                  Sort By : {currentSort} <i class="ti ti-chevron-down ms-1"></i>
                </button>
                <template if:true={isSortOpen}>
                  <ul class="dropdown-menu dropdown-menu-end p-2 show sort-menu-custom">
                    <li><a href="javascript:void(0);" class="dropdown-item rounded-1" data-sort="Recently Added" onclick={selectSort}>Recently Added</a></li>
                    <li><a href="javascript:void(0);" class="dropdown-item rounded-1" data-sort="Ascending" onclick={selectSort}>Ascending</a></li>
                    <li><a href="javascript:void(0);" class="dropdown-item rounded-1" data-sort="Descending" onclick={selectSort}>Descending</a></li>
                    <li><a href="javascript:void(0);" class="dropdown-item rounded-1" data-sort="Last Month" onclick={selectSort}>Last Month</a></li>
                    <li><a href="javascript:void(0);" class="dropdown-item rounded-1" data-sort="Last 7 Days" onclick={selectSort}>Last 7 Days</a></li>
                  </ul>
                </template>
              </div>
            </div>
          </div>

          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table datatable">
                <thead class="thead-light">
                  <tr>
                    <th class="no-sort" style="width: 40px;">
                      <div class="form-check form-check-md">
                        <input class="form-check-input" type="checkbox" checked={isAllSelected} onchange={handleSelectAll}>
                      </div>
                    </th>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Designation</th>
                    <th>Joining Date</th>
                    <th>Probation End Date</th>
                    <th>Reviewer</th>
                    <th>Status</th>
                    <th style="text-align: right;">Action</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={displayedRecords} for:item="row">
                    <tr key={row.id}>
                      <td>
                        <div class="form-check form-check-md">
                          <input class="form-check-input" type="checkbox" checked={row.selected} data-id={row.id} onchange={handleSelectRow}>
                        </div>
                      </td>
                      <td>
                        <a href="javascript:void(0);" class="fw-medium text-primary" data-id={row.id} onclick={openDetails}>{row.empId}</a>
                      </td>
                      <td>
                        <div class="d-flex align-items-center file-name-icon">
                          <a href="javascript:void(0);" class="avatar avatar-md border avatar-rounded me-2" data-id={row.id} onclick={openDetails}>
                            <img src={row.avatarUrl} class="img-fluid rounded-circle" alt="img" style="width: 38px; height: 38px; object-fit: cover;">
                          </a>
                          <div>
                            <a href="javascript:void(0);" class="fw-medium fs-14 text-dark" data-id={row.id} onclick={openDetails}>{row.name}</a>
                          </div>
                        </div>
                      </td>
                      <td>{row.designation}</td>
                      <td>{row.joiningDate}</td>
                      <td>{row.endDate}</td>
                      <td>
                        <div class="d-flex align-items-center file-name-icon">
                          <div class="avatar avatar-md border avatar-rounded me-2">
                            <img src={row.reviewerAvatarUrl} class="img-fluid rounded-circle" alt="img" style="width: 38px; height: 38px; object-fit: cover;">
                          </div>
                          <div>
                            <span class="fw-medium fs-14 text-dark">{row.reviewerName}</span>
                          </div>
                        </div>
                      </td>
                      <td>
                        <span class={row.badgeClass}>
                          <i class="ti ti-point-filled me-1"></i>{row.status}
                        </span>
                      </td>
                      <td style="text-align: right;">
                        <div class="action-icon d-inline-flex gap-1">
                          <a href="javascript:void(0);" class="action-btn" data-id={row.id} onclick={openDetails} title="View Details">
                            <i class="ti ti-eye"></i>
                          </a>
                          <a href="javascript:void(0);" class="action-btn" data-id={row.id} onclick={openEditModal} title="Edit">
                            <i class="ti ti-edit"></i>
                          </a>
                          <a href="javascript:void(0);" class="action-btn text-danger" data-id={row.id} onclick={openDeleteModal} title="Delete">
                            <i class="ti ti-trash"></i>
                          </a>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            
            <div class="d-flex justify-content-between align-items-center p-3 border-top">
              <span class="fs-13 text-muted">Showing 1 to {displayedCount} of {displayedCount} entries</span>
              <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-white border disabled">&lt;</button>
                <button type="button" class="btn btn-primary">1</button>
                <button type="button" class="btn btn-white border disabled">&gt;</button>
              </div>
            </div>
          </div>
        </div>
      </template>

    </div>
  </div>

  <!-- Offcanvas Details -->
  <template if:true={isDetailsOpen}>
    <div class="modal-backdrop-custom" onclick={closeDetails}></div>
    <div class="offcanvas-custom">
      <div class="offcanvas-header border-bottom d-flex align-items-center justify-content-between p-3">
        <h4 class="mb-0 fs-16 fw-semibold">Employee Details</h4>
        <button type="button" class="custom-btn-close" onclick={closeDetails}>
          <i class="ti ti-x"></i>
        </button>
      </div>
      <div class="offcanvas-body p-3" if:true={activeRecord}>
        <div class="card bg-light border-0 mb-4">
          <div class="card-body p-3">
            <div class="d-flex align-items-center">
              <span class="avatar avatar-lg rounded-circle me-3">
                <img src={activeRecord.avatarUrl} class="rounded-circle" style="width: 50px; height: 50px; object-fit: cover;" alt="Img">
              </span>
              <div>
                <p class="mb-0 text-dark fw-semibold fs-15">{activeRecord.name}</p>
                <span class="badge badge-soft-dark text-dark d-inline-flex align-items-center badge-xs mt-1">
                  <i class="ti ti-point-filled me-1"></i>{activeRecord.designation}
                </span>
              </div>
            </div>
          </div>
        </div>

        <div class="mb-4 pb-3 border-bottom">
          <div class="fs-14 fw-semibold text-dark mb-3">Basic Information</div>
          <div class="d-flex align-items-center justify-content-between mb-3">
            <span class="text-muted"><i class="ti ti-id me-1"></i>Employee ID</span>
            <p class="fs-13 text-dark mb-0 fw-medium">{activeRecord.empId}</p>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-3">
            <span class="text-muted"><i class="ti ti-star me-1"></i>Team</span>
            <p class="fs-13 text-dark mb-0 fw-medium">{activeRecord.team}</p>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-0">
            <span class="text-muted"><i class="ti ti-calendar-check me-1"></i>Date of Join</span>
            <p class="fs-13 text-dark mb-0 fw-medium">{activeRecord.joiningDate}</p>
          </div>
        </div>

        <div>
          <div class="fs-14 fw-semibold text-dark mb-3">Probation Period</div>
          <div class="d-flex align-items-center justify-content-between mb-3">
            <span class="text-muted"><i class="ti ti-calendar me-1"></i>Probation Start Date</span>
            <p class="fs-13 text-dark mb-0 fw-medium">{activeRecord.joiningDate}</p>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-3">
            <span class="text-muted"><i class="ti ti-calendar me-1"></i>Probation End Date</span>
            <p class="fs-13 text-dark mb-0 fw-medium">{activeRecord.endDate}</p>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-3">
            <span class="text-muted"><i class="ti ti-calendar-stats me-1"></i>Reviewer</span>
            <p class="fs-13 text-dark mb-0 fw-medium">{activeRecord.reviewerName}</p>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-0">
            <span class="text-muted"><i class="ti ti-user-edit me-1"></i>Probation Status</span>
            <span class={activeRecord.badgeClass}>{activeRecord.status}</span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Add Modal -->
  <template if:true={isAddModalOpen}>
    <div class="modal-backdrop-custom">
      <div class="modal-dialog modal-dialog-centered modal-md" style="margin: 3rem auto; max-width: 600px;">
        <div class="modal-content shadow-lg border-0 rounded-3 bg-white">
          <div class="modal-header border-bottom p-3 d-flex justify-content-between align-items-center">
            <h4 class="modal-title fs-16 fw-semibold">Add Employee</h4>
            <button type="button" class="custom-btn-close" onclick={closeAddModal}><i class="ti ti-x"></i></button>
          </div>
          <div class="modal-body p-3">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label">Employee Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" data-field="name" value={addForm.name} oninput={handleAddFormChange} placeholder="e.g. John Doe">
              </div>
              <div class="col-md-12">
                <label class="form-label">Designation <span class="text-danger">*</span></label>
                <select class="form-select" data-field="designation" onchange={handleAddFormChange}>
                  <option value="">Select</option>
                  <template for:each={designationOptions} for:item="d">
                    <option key={d} value={d}>{d}</option>
                  </template>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Joining Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" data-field="joiningDate" oninput={handleAddFormChange}>
              </div>
              <div class="col-md-6">
                <label class="form-label">Probation End Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" data-field="endDate" oninput={handleAddFormChange}>
              </div>
              <div class="col-md-12">
                <label class="form-label">Reviewer <span class="text-danger">*</span></label>
                <select class="form-select" data-field="reviewerName" onchange={handleAddFormChange}>
                  <option value="">Select</option>
                  <template for:each={reviewerOptions} for:item="r">
                    <option key={r} value={r}>{r}</option>
                  </template>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Status</label>
                <select class="form-select" data-field="status" onchange={handleAddFormChange}>
                  <option value="Pending">Pending</option>
                  <option value="In Review">In Review</option>
                  <option value="Completed">Completed</option>
                  <option value="Extended">Extended</option>
                  <option value="Failed">Failed</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top p-3 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light" onclick={closeAddModal}>Cancel</button>
            <button type="button" class="btn btn-primary" onclick={saveNewEmployee}>Add Employee</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Edit Modal -->
  <template if:true={isEditModalOpen}>
    <div class="modal-backdrop-custom">
      <div class="modal-dialog modal-dialog-centered modal-md" style="margin: 3rem auto; max-width: 600px;">
        <div class="modal-content shadow-lg border-0 rounded-3 bg-white">
          <div class="modal-header border-bottom p-3 d-flex justify-content-between align-items-center">
            <h4 class="modal-title fs-16 fw-semibold">Edit Employee</h4>
            <button type="button" class="custom-btn-close" onclick={closeEditModal}><i class="ti ti-x"></i></button>
          </div>
          <div class="modal-body p-3">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label">Employee Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" data-field="name" value={editForm.name} oninput={handleEditFormChange}>
              </div>
              <div class="col-md-12">
                <label class="form-label">Designation <span class="text-danger">*</span></label>
                <select class="form-select" data-field="designation" onchange={handleEditFormChange}>
                  <template for:each={designationOptions} for:item="d">
                    <option key={d} value={d}>{d}</option>
                  </template>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Joining Date <span class="text-danger">*</span></label>
                <input type="text" class="form-control" data-field="joiningDate" value={editForm.joiningDate} oninput={handleEditFormChange}>
              </div>
              <div class="col-md-6">
                <label class="form-label">Probation End Date <span class="text-danger">*</span></label>
                <input type="text" class="form-control" data-field="endDate" value={editForm.endDate} oninput={handleEditFormChange}>
              </div>
              <div class="col-md-12">
                <label class="form-label">Reviewer <span class="text-danger">*</span></label>
                <select class="form-select" data-field="reviewerName" onchange={handleEditFormChange}>
                  <template for:each={reviewerOptions} for:item="r">
                    <option key={r} value={r}>{r}</option>
                  </template>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label">Status</label>
                <select class="form-select" data-field="status" onchange={handleEditFormChange}>
                  <option value="Pending">Pending</option>
                  <option value="In Review">In Review</option>
                  <option value="Completed">Completed</option>
                  <option value="Extended">Extended</option>
                  <option value="Failed">Failed</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top p-3 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light" onclick={closeEditModal}>Cancel</button>
            <button type="button" class="btn btn-primary" onclick={saveEditEmployee}>Save Changes</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Delete Modal -->
  <template if:true={isDeleteModalOpen}>
    <div class="modal-backdrop-custom d-flex align-items-center justify-content-center">
      <div class="modal-dialog modal-dialog-centered" style="max-width: 450px; width: 100%;">
        <div class="modal-content shadow-lg border-0 rounded-3 bg-white p-4 text-center">
          <div class="modal-body text-center p-0">
            <span class="avatar avatar-xl bg-transparent-danger text-danger mb-3 d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 60px; height: 60px; background: rgba(239, 68, 68, 0.1);">
              <i class="ti ti-trash-x fs-36 text-danger" style="font-size: 32px;"></i>
            </span>
            <h4 class="mb-2 fs-18 fw-bold">Confirm Delete</h4>
            <p class="mb-4 text-muted fs-14">You want to delete all the marked items, this cant be undone once you delete.</p>
            <div class="d-flex justify-content-center gap-3">
              <button type="button" class="btn btn-light px-4" onclick={closeDeleteModal}>Cancel</button>
              <button type="button" class="btn btn-danger px-4" onclick={confirmDelete}>Yes, Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
