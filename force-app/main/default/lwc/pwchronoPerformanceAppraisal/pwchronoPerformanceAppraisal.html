<template>
  <div class="page-wrapper">
    <div class="content container-fluid">

      <!-- Page Header -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">{pageTitle}</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="javascript:void(0);"><i class="ti ti-smart-home"></i></a>
              </li>
              <li class="breadcrumb-item">{breadcrumbParent}</li>
              <li class="breadcrumb-item active">{breadcrumbActive}</li>
            </ol>
          </nav>
        </div>
        <div class="d-flex my-xl-auto right-content align-items-center flex-wrap gap-2">
          <button
            class="btn btn-primary d-flex align-items-center gap-2"
            data-action="openAdd"
            onclick={handleActionClick}
          >
            <i class="ti ti-circle-plus"></i>{addBtnLabel}
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
          <h5 class="card-title mb-0">{listTitle}</h5>
          <div class="d-flex align-items-center gap-2">
            <div class="dropdown">
              <button class="btn btn-white dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="ti ti-sort-ascending me-1"></i>{sortByLabel}
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="javascript:void(0);">Recently Added</a></li>
                <li><a class="dropdown-item" href="javascript:void(0);">Last 7 Days</a></li>
                <li><a class="dropdown-item" href="javascript:void(0);">Last Month</a></li>
              </ul>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th style="width: 36px;">
                    <input type="checkbox" class="form-check-input" />
                  </th>
                  <th>{colName}</th>
                  <th>{colDesignation}</th>
                  <th>{colDepartment}</th>
                  <th>{colAppraisalDate}</th>
                  <th>{colStatus}</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={appraisalData} for:item="row">
                  <tr key={row.id}>
                    <td><input type="checkbox" class="form-check-input" /></td>
                    <td>
                      <div class="d-flex align-items-center gap-2">
                        <span class="avatar avatar-md avatar-rounded bg-primary flex-shrink-0">
                          <span class="fw-semibold text-white">{row.initials}</span>
                        </span>
                        <h6 class="fw-medium mb-0">{row.name}</h6>
                      </div>
                    </td>
                    <td class="text-muted">{row.designation}</td>
                    <td class="text-muted">{row.department}</td>
                    <td class="text-muted">{row.appraisalDate}</td>
                    <td>
                      <span class={row.statusClass}>
                        <i class="ti ti-point-filled me-1"></i>{row.status}
                      </span>
                    </td>
                    <td class="text-end">
                      <div class="d-inline-flex gap-2">
                        <button
                          class="btn btn-sm btn-outline-secondary"
                          data-id={row.id}
                          data-action="edit"
                          onclick={handleActionClick}
                          title="Edit"
                        >
                          <i class="ti ti-edit"></i>
                        </button>
                        <button
                          class="btn btn-sm btn-outline-danger"
                          data-id={row.id}
                          data-action="delete"
                          onclick={handleActionClick}
                          title="Delete"
                        >
                          <i class="ti ti-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                </template>
                <template if:false={hasData}>
                  <tr>
                    <td colspan="7" class="text-center py-5 text-muted">
                      <i class="ti ti-file-off fs-1 d-block mb-2"></i>
                      No appraisal records found
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Add / Edit Modal -->
  <template lwc:if={isModalOpen}>
    <div
      class="modal custom-modal fade show d-block"
      role="dialog"
      style="background: rgba(0, 0, 0, 0.6); z-index: 1050;"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">
              <i class="ti ti-trending-up me-2"></i>{addBtnLabel}
            </h4>
            <button
              type="button"
              class="btn-close"
              data-action="closeModal"
              onclick={handleActionClick}
            ></button>
          </div>
          <div class="modal-body">

            <!-- Basic Info -->
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label class="form-label fw-medium">Employee <span class="text-danger">*</span></label>
                <select class="form-select" name="employee" onchange={handleFieldChange}>
                  <option value="">Select Employee</option>
                  <template for:each={appraisalData} for:item="emp">
                    <option key={emp.id} value={emp.id}>{emp.name}</option>
                  </template>
                </select>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label fw-medium">Appraisal Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" name="appraisalDate" onchange={handleFieldChange} />
              </div>
            </div>

            <!-- Technical Competencies -->
            <div class="mb-4">
              <h6 class="fw-semibold mb-3 d-flex align-items-center gap-2">
                <i class="ti ti-code text-primary"></i>Technical Competencies
              </h6>
              <div class="table-responsive">
                <table class="table table-bordered align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Competency</th>
                      <th style="width: 160px;">Expected Level</th>
                      <th style="width: 180px;">Assessed Level</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={technicalCompetencies} for:item="comp">
                      <tr key={comp.key}>
                        <td class="fw-medium">{comp.label}</td>
                        <td>
                          <span class="badge bg-soft-primary text-primary">{comp.expected}</span>
                        </td>
                        <td>
                          <select class="form-select form-select-sm" data-key={comp.key} onchange={handleRatingChange}>
                            <option value="">Select</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Expert">Expert</option>
                            <option value="Leader">Leader</option>
                          </select>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Organisational Competencies -->
            <div class="mb-2">
              <h6 class="fw-semibold mb-3 d-flex align-items-center gap-2">
                <i class="ti ti-users text-success"></i>Organisational Competencies
              </h6>
              <div class="table-responsive">
                <table class="table table-bordered align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Competency</th>
                      <th style="width: 160px;">Expected Level</th>
                      <th style="width: 180px;">Assessed Level</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template for:each={organisationalCompetencies} for:item="comp">
                      <tr key={comp.key}>
                        <td class="fw-medium">{comp.label}</td>
                        <td>
                          <span class="badge bg-soft-success text-success">{comp.expected}</span>
                        </td>
                        <td>
                          <select class="form-select form-select-sm" data-key={comp.key} onchange={handleRatingChange}>
                            <option value="">Select</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Expert">Expert</option>
                            <option value="Leader">Leader</option>
                          </select>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

          </div>
          <div class="modal-footer">
            <button
              class="btn btn-light"
              data-action="closeModal"
              onclick={handleActionClick}
            >
              <i class="ti ti-x me-1"></i>Cancel
            </button>
            <button
              class="btn btn-primary"
              data-action="saveModal"
              onclick={handleActionClick}
              disabled={isSaving}
            >
              <i class="ti ti-device-floppy me-1"></i>
              <template if:true={isSaving}>Saving...</template>
              <template if:false={isSaving}>Save Appraisal</template>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
