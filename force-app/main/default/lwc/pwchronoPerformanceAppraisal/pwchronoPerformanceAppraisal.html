                      <option value="Inactive" selected={isEditInactive}>Inactive</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light me-2" onclick={closeEditModal}>Cancel</button>
              <button type="button" class="btn btn-primary" onclick={saveEditIndicator}>Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    </template>
    <!-- /Edit Indicator Modal -->

    <!-- Delete Modal -->
    <template if:true={isDeleteModalOpen}>
      <div class="modal fade show d-block modal-backdrop-custom" role="dialog" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content shadow">
            <div class="modal-body text-center p-4">
              <span class="avatar avatar-xl text-danger mb-3 d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 65px; height: 65px; background: rgba(235, 87, 87, 0.12); margin: 0 auto;">
                <i class="ti ti-trash-x" style="font-size: 36px; color: #e03131;"></i>
              </span>
              <h4 class="mb-1 fw-bold">Confirm Delete</h4>
              <p class="mb-4 text-muted">You want to delete all the marked items, this cant be undone once you delete.</p>
              <div class="d-flex justify-content-center">
                <button type="button" class="btn btn-light me-3 px-4" onclick={closeDeleteModal}>Cancel</button>
                <button type="button" class="btn btn-danger px-4" onclick={confirmDelete}>Yes, Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
    <!-- /Delete Modal -->

  </div>
</template>
