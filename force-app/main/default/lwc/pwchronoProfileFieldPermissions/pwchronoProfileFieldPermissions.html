<template lwc:render-mode="light">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="section-heading">
        <div>
          <h2>Field permissions</h2>
          <p class="text-muted mb-0">
            Use field restrictions for sensitive exceptions only.
          </p>
        </div>
        <lightning-button
          variant="brand-outline"
          label="Save Field Permissions"
          onclick={handleSave}
          disabled={isSaveDisabled}
        ></lightning-button>
      </div>
      <div class="mt-3 mb-3">
        <lightning-input
          type="search"
          label="Search fields"
          placeholder="Search object or field name"
          value={searchTerm}
          onchange={handleSearch}
        ></lightning-input>
      </div>
      <template lwc:if={errorMessage}>
        <div class="alert alert-danger" role="alert">{errorMessage}</div>
      </template>
      <template lwc:if={isLoading}>
        <div class="loading-panel" role="status">
          <lightning-spinner
            alternative-text="Loading field permissions"
          ></lightning-spinner>
        </div>
      </template>
      <template lwc:else>
        <template lwc:if={hasPermissions}>
          <div class="table-responsive">
            <table class="table table-center table-hover mb-0">
              <thead class="thead-light">
                <tr>
                  <th>Object</th>
                  <th>Field</th>
                  <th>Restrict</th>
                  <th>View</th>
                  <th>Edit</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={filteredPermissions} for:item="permission">
                  <tr key={permission.fieldId}>
                    <td>{permission.objectName}</td>
                    <td>
                      <span class="field-name">{permission.fieldApiName}</span
                      ><template lwc:if={permission.isSystemField}
                        ><span class="system-label">System</span></template
                      >
                    </td>
                    <td>
                      <lightning-input
                        type="toggle"
                        label="Restrict field"
                        variant="label-hidden"
                        checked={permission.isAssigned}
                        data-id={permission.fieldId}
                        data-field="isAssigned"
                        onchange={handleChange}
                      ></lightning-input>
                    </td>
                    <td>
                      <lightning-input
                        type="checkbox"
                        label="Can view"
                        variant="label-hidden"
                        checked={permission.canView}
                        disabled={permission.disabled}
                        data-id={permission.fieldId}
                        data-field="canView"
                        onchange={handleChange}
                      ></lightning-input>
                    </td>
                    <td>
                      <lightning-input
                        type="checkbox"
                        label="Can edit"
                        variant="label-hidden"
                        checked={permission.canEdit}
                        disabled={permission.disabled}
                        data-id={permission.fieldId}
                        data-field="canEdit"
                        onchange={handleChange}
                      ></lightning-input>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template lwc:else
          ><div class="empty-state">
            No registered portal fields found.
          </div></template
        >
      </template>
    </div>
  </div>
</template>
