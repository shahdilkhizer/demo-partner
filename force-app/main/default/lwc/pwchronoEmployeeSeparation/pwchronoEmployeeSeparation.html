<template lwc:render-mode="light">
  <div class="page-wrapper pwchrono-lifecycle-page">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- Page header -->
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"
      >
        <div>
          <h4 class="fw-bold mb-1">
            <i
              class="fa-solid fa-person-walking-arrow-right fa-fw me-2 text-primary"
            ></i
            >Employee Separation
          </h4>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="#" onclick={handleHome}>Home</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Employee Separation
              </li>
            </ol>
          </nav>
        </div>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            onclick={handleExport}
            disabled={isLoading}
            data-action="export"
          >
            <i class="fa-solid fa-file-csv fa-fw me-1"></i>Export CSV
          </button>
          <template lwc:if={canCreate}>
            <button
              type="button"
              class="btn btn-primary btn-sm"
              onclick={handleCreate}
              data-action="create"
            >
              <i class="fa-solid fa-plus fa-fw me-1"></i>New Separation
            </button>
          </template>
        </div>
      </div>

      <!-- Load error -->
      <template lwc:if={loadError}>
        <div
          class="alert alert-danger d-flex align-items-center justify-content-between mb-3"
          role="alert"
          data-id="load-error"
        >
          <div>
            <i class="fa-solid fa-circle-exclamation fa-fw me-2"></i>{loadError}
          </div>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            onclick={handleRetry}
          >
            <i class="fa-solid fa-rotate-right fa-fw me-1"></i>Retry
          </button>
        </div>
      </template>

      <!-- Metric cards -->
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-primary" data-metric="total">
                {totalCount}
              </div>
              <div class="text-muted small">Total</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-secondary" data-metric="pending">
                {pendingCount}
              </div>
              <div class="text-muted small">Pending</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-warning" data-metric="in-process">
                {inProcessCount}
              </div>
              <div class="text-muted small">In Process</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body text-center">
              <div class="fs-2 fw-bold text-success" data-metric="completed">
                {completedCount}
              </div>
              <div class="text-muted small">Completed</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-auto">
              <label
                class="form-label mb-0 fw-semibold small"
                for="separation-status-filter"
                >Status</label
              >
            </div>
            <div class="col-auto">
              <select
                id="separation-status-filter"
                class="form-select form-select-sm"
                onchange={handleFilterChange}
              >
                <template for:each={statusOptions} for:item="opt">
                  <option
                    key={opt.value}
                    value={opt.value}
                    selected={opt.selected}
                  >
                    {opt.label}
                  </option>
                </template>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading -->
      <template lwc:if={isLoading}>
        <div class="text-center py-5" data-id="loading">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </template>

      <!-- Table -->
      <template lwc:if={showTable}>
        <div class="card border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Separation #</th>
                  <th>Employee</th>
                  <th>Resignation Date</th>
                  <th>Relieving Date</th>
                  <th>Department</th>
                  <th>Designation</th>
                  <th>Checklist</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <template lwc:if={hasRecords}>
                  <template for:each={enrichedRecords} for:item="row">
                    <tr key={row.Id} data-row={row.Id}>
                      <td class="text-muted small">{row.Name}</td>
                      <td class="fw-semibold">{row.employeeName}</td>
                      <td>{row.resignationDateFormatted}</td>
                      <td>{row.relievingDateFormatted}</td>
                      <td>{row.deptName}</td>
                      <td>{row.desigName}</td>
                      <td class="small">
                        <template lwc:if={row.checklistReady}>
                          <span class="text-success"
                            ><i class="fa-solid fa-circle-check fa-fw me-1"></i
                            >{row.checklistSummary}</span
                          >
                        </template>
                        <template lwc:else>
                          <span class="text-warning"
                            ><i
                              class="fa-solid fa-hourglass-half fa-fw me-1"
                            ></i
                            >{row.checklistSummary}</span
                          >
                        </template>
                      </td>
                      <td>
                        <span class={row.statusBadgeClass}
                          >{row.Status__c}</span
                        >
                      </td>
                      <td class="text-end text-nowrap">
                        <template lwc:if={row.canEdit}>
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-primary me-1"
                            data-id={row.Id}
                            data-action="edit"
                            onclick={handleEdit}
                            title="Edit"
                            aria-label="Edit separation"
                            disabled={row.isBusy}
                          >
                            <i class="fa-solid fa-pen-to-square fa-fw"></i>
                          </button>
                        </template>
                        <template lwc:if={row.canView}>
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-secondary me-1"
                            data-id={row.Id}
                            data-action="view"
                            onclick={handleView}
                            title="View"
                            aria-label="View separation"
                          >
                            <i class="fa-solid fa-eye fa-fw"></i>
                          </button>
                        </template>
                        <button
                          type="button"
                          class="btn btn-sm btn-outline-info me-1"
                          data-id={row.Id}
                          data-action="checklist"
                          onclick={handleViewChecklist}
                          title="Checklist"
                          aria-label="Exit checklist"
                        >
                          <i class="fa-solid fa-list-check fa-fw"></i>
                        </button>
                        <template lwc:if={row.canStart}>
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-warning me-1"
                            data-id={row.Id}
                            data-status="In Process"
                            data-action="start"
                            onclick={handleStatusAction}
                            title="Start processing"
                            aria-label="Start processing"
                            disabled={row.isBusy}
                          >
                            <i class="fa-solid fa-play fa-fw"></i>
                          </button>
                        </template>
                        <template lwc:if={row.canComplete}>
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-success me-1"
                            data-id={row.Id}
                            data-status="Completed"
                            data-action="complete"
                            onclick={handleStatusAction}
                            title="Complete separation"
                            aria-label="Complete separation"
                            disabled={row.isBusy}
                          >
                            <i class="fa-solid fa-circle-check fa-fw"></i>
                          </button>
                        </template>
                        <template lwc:if={row.canCancel}>
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-secondary me-1"
                            data-id={row.Id}
                            data-status="Cancelled"
                            data-action="cancel"
                            onclick={handleStatusAction}
                            title="Cancel separation"
                            aria-label="Cancel separation"
                            disabled={row.isBusy}
                          >
                            <i class="fa-solid fa-ban fa-fw"></i>
                          </button>
                        </template>
                        <template lwc:if={row.canDelete}>
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-danger"
                            data-id={row.Id}
                            data-action="delete"
                            onclick={handleDelete}
                            title="Delete"
                            aria-label="Delete separation"
                            disabled={row.isBusy}
                          >
                            <i class="fa-solid fa-trash fa-fw"></i>
                          </button>
                        </template>
                      </td>
                    </tr>
                  </template>
                </template>
                <template lwc:else>
                  <tr>
                    <td
                      colspan="9"
                      class="text-center text-muted py-4"
                      data-id="empty"
                    >
                      <i class="fa-solid fa-inbox fa-fw me-2"></i>No separation
                      records found.
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <!-- Create / Edit / View Modal -->
      <template lwc:if={showModal}>
        <div
          class="modal d-block"
          tabindex="-1"
          role="dialog"
          aria-modal="true"
          style="background: rgba(0, 0, 0, 0.5)"
        >
          <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-semibold">
                  <i
                    class="fa-solid fa-person-walking-arrow-right fa-fw me-2 text-primary"
                  ></i>
                  {modalTitle}
                  <template lwc:if={isEditMode}>
                    <span class={modalStatusBadgeClass}
                      >{editRecord.Status__c}</span
                    >
                  </template>
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  aria-label="Close"
                  onclick={handleModalClose}
                ></button>
              </div>
              <div class="modal-body">
                <!-- Validation / server error -->
                <template lwc:if={validationError}>
                  <div
                    class="alert alert-warning d-flex align-items-center mb-3"
                    data-id="validation-error"
                  >
                    <i class="fa-solid fa-triangle-exclamation fa-fw me-2"></i>
                    {validationError}
                  </div>
                </template>

                <div class="row g-3">
                  <!-- Employee -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Employee <span class="text-danger">*</span></label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="Employee__c"
                      onchange={handleFieldChange}
                      disabled={employeeLocked}
                    >
                      <option value="">-- Select Employee --</option>
                      <template for:each={employeeOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selected}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>
                  <!-- Employee Name -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Employee Name</label
                    >
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      data-field="Employee_Name__c"
                      value={editRecord.Employee_Name__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>
                  <!-- Company -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small">Company</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      data-field="Company__c"
                      value={editRecord.Company__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>
                  <!-- Department -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Department</label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="Department__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="">-- Select --</option>
                      <template for:each={departmentOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selected}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>
                  <!-- Designation -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Designation</label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="Designation__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="">-- Select --</option>
                      <template for:each={designationOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selected}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>
                  <!-- Separation Template -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Separation Template</label
                    >
                    <select
                      class="form-select form-select-sm"
                      data-field="Separation_Template__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
                      <option value="">-- None --</option>
                      <template for:each={templateOptions} for:item="opt">
                        <option
                          key={opt.value}
                          value={opt.value}
                          selected={opt.selected}
                        >
                          {opt.label}
                        </option>
                      </template>
                    </select>
                  </div>
                  <!-- Resignation Letter Date -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Resignation Letter Date
                      <span class="text-danger">*</span></label
                    >
                    <input
                      type="date"
                      class="form-control form-control-sm"
                      data-field="Resignation_Letter_Date__c"
                      value={editRecord.Resignation_Letter_Date__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                  </div>
                  <!-- Relieving Date -->
                  <div class="col-md-4">
                    <label class="form-label fw-semibold small"
                      >Relieving Date</label
                    >
                    <input
                      type="date"
                      class="form-control form-control-sm"
                      data-field="Relieving_Date__c"
                      value={editRecord.Relieving_Date__c}
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    />
                    <div class="form-text">
                      The separation can be completed on or after this date.
                    </div>
                  </div>

                  <!-- Reason for Leaving -->
                  <div class="col-12">
                    <hr class="my-1" />
                    <label class="form-label fw-semibold small"
                      >Reason for Leaving</label
                    >
                    <textarea
                      class="form-control form-control-sm"
                      rows="3"
                      data-field="Reason_for_Leaving__c"
                      onchange={handleFieldChange}
                      disabled={isReadOnly}
                    >
{editRecord.Reason_for_Leaving__c}</textarea
                    >
                  </div>

                  <!-- Exit Checklist -->
                  <div class="col-12">
                    <hr class="my-1" />
                    <div
                      class="d-flex justify-content-between align-items-center mb-2"
                    >
                      <p
                        class="fw-semibold small mb-0 text-muted text-uppercase"
                      >
                        Exit Checklist
                      </p>
                      <template lwc:if={isEditable}>
                        <button
                          type="button"
                          class="btn btn-outline-secondary btn-sm"
                          onclick={handleAddChecklistRow}
                          disabled={checklistLocked}
                          data-action="add-checklist-row"
                        >
                          <i class="fa-solid fa-plus fa-fw me-1"></i>Add Item
                        </button>
                      </template>
                    </div>
                    <template lwc:if={showTemplateNotice}>
                      <div
                        class="alert alert-info small py-2 mb-2"
                        data-id="template-notice"
                      >
                        <i class="fa-solid fa-circle-info fa-fw me-1"></i>
                        No checklist items entered: the exit checklist will be
                        generated from the "{selectedTemplateName}" template
                        when you save.
                      </div>
                    </template>
                    <template lwc:if={showChecklistStatusHint}>
                      <div
                        class="form-text mb-2"
                        data-id="checklist-status-hint"
                      >
                        Update item progress from the Checklist view.
                        <template lwc:if={showChecklistPermissionHint}>
                          Only HR administrators can remove existing items or
                          change whether they are required.
                        </template>
                      </div>
                    </template>
                    <template lwc:if={checklistLoadError}>
                      <div
                        class="alert alert-warning small py-2 mb-2"
                        data-id="checklist-load-error"
                      >
                        <i
                          class="fa-solid fa-triangle-exclamation fa-fw me-1"
                        ></i>
                        {checklistLoadError} Saving will keep the existing
                        checklist unchanged.
                      </div>
                    </template>
                    <template lwc:if={checklistLoading}>
                      <div class="text-center py-2">
                        <div
                          class="spinner-border spinner-border-sm text-primary"
                          role="status"
                        >
                          <span class="visually-hidden"
                            >Loading checklist...</span
                          >
                        </div>
                      </div>
                    </template>
                    <div class="table-responsive">
                      <table
                        class="table table-sm table-bordered align-middle mb-0"
                      >
                        <thead class="table-light">
                          <tr>
                            <th>Activity Name</th>
                            <th>Assigned To</th>
                            <th>Status</th>
                            <th>Required</th>
                            <th>Notes</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          <template lwc:if={hasChecklistRows}>
                            <template
                              for:each={checklistRowsView}
                              for:item="row"
                            >
                              <tr key={row._key} data-checklist-row={row._key}>
                                <td>
                                  <input
                                    type="text"
                                    class="form-control form-control-sm"
                                    data-key={row._key}
                                    data-field="Name"
                                    value={row.Name}
                                    onchange={handleChecklistChange}
                                    disabled={checklistLocked}
                                  />
                                </td>
                                <td>
                                  <select
                                    class="form-select form-select-sm"
                                    data-key={row._key}
                                    data-field="Assigned_To__c"
                                    onchange={handleChecklistChange}
                                    disabled={checklistLocked}
                                  >
                                    <option value="">-- None --</option>
                                    <template
                                      for:each={row.assigneeOptions}
                                      for:item="opt"
                                    >
                                      <option
                                        key={opt.value}
                                        value={opt.value}
                                        selected={opt.selected}
                                      >
                                        {opt.label}
                                      </option>
                                    </template>
                                  </select>
                                </td>
                                <td>
                                  <span
                                    class={row.statusBadge}
                                    data-checklist-status={row._key}
                                    >{row.Status__c}</span
                                  >
                                </td>
                                <td class="text-center">
                                  <input
                                    type="checkbox"
                                    class="form-check-input"
                                    data-key={row._key}
                                    data-field="Is_Required__c"
                                    checked={row.Is_Required__c}
                                    onchange={handleChecklistChange}
                                    disabled={row.requiredLocked}
                                  />
                                </td>
                                <td>
                                  <input
                                    type="text"
                                    class="form-control form-control-sm"
                                    data-key={row._key}
                                    data-field="Notes__c"
                                    value={row.Notes__c}
                                    onchange={handleChecklistChange}
                                    disabled={checklistLocked}
                                  />
                                </td>
                                <td>
                                  <template lwc:if={row.canRemove}>
                                    <button
                                      type="button"
                                      class="btn btn-sm btn-outline-danger"
                                      data-key={row._key}
                                      data-action="remove-checklist-row"
                                      onclick={handleRemoveChecklistRow}
                                      disabled={checklistLocked}
                                      aria-label="Remove checklist item"
                                    >
                                      <i class="fa-solid fa-xmark fa-fw"></i>
                                    </button>
                                  </template>
                                </td>
                              </tr>
                            </template>
                          </template>
                          <template lwc:else>
                            <tr>
                              <td
                                colspan="6"
                                class="text-muted text-center small py-2"
                              >
                                No checklist items.
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary btn-sm"
                  onclick={handleModalClose}
                >
                  {closeLabel}
                </button>
                <template lwc:if={isEditable}>
                  <button
                    type="button"
                    class="btn btn-primary btn-sm"
                    onclick={handleSave}
                    disabled={saveDisabled}
                    data-action="save"
                  >
                    <template lwc:if={isSaving}>
                      <span
                        class="spinner-border spinner-border-sm me-1"
                        role="status"
                      ></span>
                    </template>
                    <i class="fa-solid fa-floppy-disk fa-fw me-1"></i>Save
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- Checklist progress modal -->
      <template lwc:if={showChecklistModal}>
        <div
          class="modal d-block"
          tabindex="-1"
          role="dialog"
          aria-modal="true"
          style="background: rgba(0, 0, 0, 0.5)"
        >
          <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-semibold">
                  <i class="fa-solid fa-list-check fa-fw me-2 text-info"></i>
                  {checklistModalTitle}
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  aria-label="Close"
                  onclick={handleChecklistModalClose}
                ></button>
              </div>
              <div class="modal-body">
                <template lwc:if={isChecklistLoading}>
                  <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                  </div>
                </template>
                <template lwc:else>
                  <template lwc:if={hasViewChecklistItems}>
                    <p
                      class="small text-muted mb-2"
                      data-id="checklist-progress"
                    >
                      {checklistProgress}
                    </p>
                    <ul class="list-group">
                      <template for:each={viewChecklistItems} for:item="item">
                        <li
                          key={item.Id}
                          class="list-group-item d-flex justify-content-between align-items-start gap-3"
                        >
                          <div>
                            <div class="fw-semibold">
                              {item.Name}
                              <template lwc:if={item.Is_Required__c}>
                                <span class="badge bg-danger ms-1 small"
                                  >Required</span
                                >
                              </template>
                            </div>
                            <small class="text-muted"
                              >{item.assignedToName}</small
                            >
                            <template lwc:if={item.Notes__c}>
                              <div class="text-muted small mt-1">
                                {item.Notes__c}
                              </div>
                            </template>
                          </div>
                          <template lwc:if={checklistCanUpdate}>
                            <select
                              class="form-select form-select-sm w-auto"
                              data-id={item.Id}
                              onchange={handleChecklistItemStatus}
                              aria-label="Checklist item status"
                            >
                              <template
                                for:each={item.statusOptions}
                                for:item="opt"
                              >
                                <option
                                  key={opt.value}
                                  value={opt.value}
                                  selected={opt.selected}
                                >
                                  {opt.label}
                                </option>
                              </template>
                            </select>
                          </template>
                          <template lwc:else>
                            <span class={item.checklistBadge}
                              >{item.Status__c}</span
                            >
                          </template>
                        </li>
                      </template>
                    </ul>
                  </template>
                  <template lwc:else>
                    <p class="text-muted text-center py-3">
                      No checklist items for this separation.
                    </p>
                  </template>
                </template>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary btn-sm"
                  onclick={handleChecklistModalClose}
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</template>
