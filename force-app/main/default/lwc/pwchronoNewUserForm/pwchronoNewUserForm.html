<template>
  <lightning-modal header="Create New Portal User" onclose={closeModal}>
    <div class="p-6 space-y-4">
      <lightning-input
        label="Full Name"
        value={newUser.Name}
        onchange={handleInputChange}
        data-field="Name"
        required
      ></lightning-input>
      <lightning-input
        label="Email"
        type="email"
        value={newUser.Email__c}
        onchange={handleInputChange}
        data-field="Email__c"
        required
      ></lightning-input>
      <lightning-input
        label="Role"
        value={newUser.Role__c}
        onchange={handleInputChange}
        data-field="Role__c"
      ></lightning-input>
      <lightning-input
        label="Designation"
        value={newUser.Designation__c}
        onchange={handleInputChange}
        data-field="Designation__c"
      ></lightning-input>
      <lightning-input
        label="Department"
        value={newUser.Department__c}
        onchange={handleInputChange}
        data-field="Department__c"
      ></lightning-input>

      <div class="pt-4 border-t border-gray-200">
        <h3 class="text-base font-semibold text-gray-800 mb-4">
          Initial Feature Access
        </h3>
        <div class="space-y-3">
          <template for:each={features} for:item="feature">
            <lightning-input
              key={feature.name}
              type="toggle"
              label={feature.name}
              checked={feature.hasAccess}
              onchange={handleFeatureToggle}
              data-name={feature.name}
            >
            </lightning-input>
          </template>
        </div>
      </div>
    </div>
    <div slot="footer">
      <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
      <lightning-button
        label="Save"
        variant="brand"
        onclick={handleSave}
        disabled={isSaving}
      ></lightning-button>
    </div>
  </lightning-modal>
</template>
