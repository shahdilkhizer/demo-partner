<template>
  <section
    class="modal-layer"
    role="dialog"
    tabindex="-1"
    aria-modal="true"
    aria-labelledby="new-user-title"
    onkeydown={handleKeyDown}
  >
    <div class="modal-backdrop" aria-label="Close dialog" onclick={closeModal}></div>
    <div class="modal-card" onclick={handleModalCardClick}>
      <!-- Modal Header -->
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="new-user-title">
          <i class="ti ti-user-plus me-2 text-primary"></i>Create New Portal User
        </h5>
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          onclick={closeModal}
        ></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body p-4">
        <div class="row g-3">
          <div class="col-md-6">
            <lightning-input
              label="Full Name"
              value={newUser.Name}
              onchange={handleInputChange}
              data-field="Name"
              required
            ></lightning-input>
          </div>
          <div class="col-md-6">
            <lightning-input
              label="Email"
              type="email"
              value={newUser.Email__c}
              onchange={handleInputChange}
              data-field="Email__c"
              required
            ></lightning-input>
          </div>
          <div class="col-md-6">
            <lightning-combobox
              name="role"
              data-id="role"
              label="Role"
              value={newUser.Role__c}
              options={roleOptions}
              onchange={handleRoleChange}
              required
            ></lightning-combobox>
          </div>
          <div class="col-md-6">
            <lightning-combobox
              name="reportingManager"
              data-id="reportingManager"
              label="Reports To"
              value={newUser.Reports_To__c}
              options={managerOptions}
              onchange={handleManagerChange}
              field-level-help="Used for approval routing and manager team access. Leave blank only for top-level users."
            ></lightning-combobox>
          </div>
          <div class="col-md-6">
            <lightning-input
              label="Designation"
              value={newUser.Designation__c}
              onchange={handleInputChange}
              data-field="Designation__c"
            ></lightning-input>
          </div>
          <div class="col-md-6">
            <lightning-input
              label="Department"
              value={newUser.Department__c}
              onchange={handleInputChange}
              data-field="Department__c"
            ></lightning-input>
          </div>
        </div>

        <div class="border-top mt-4 pt-3">
          <h6 class="fw-semibold mb-1">Portal User Profile</h6>
          <p class="text-muted small mb-3">
            The new user inherits object and field access from this profile.
          </p>
          <template if:true={isLoadingProfiles}>
            <div class="d-flex align-items-center gap-2 py-2">
              <lightning-spinner
                alternative-text="Loading Portal User Profiles"
                size="small"
              ></lightning-spinner>
              <span class="text-muted small">Loading profiles...</span>
            </div>
          </template>
          <template if:false={isLoadingProfiles}>
            <template if:true={profileLoadError}>
              <div class="alert alert-danger mb-0" role="alert">
                {profileLoadError}
              </div>
            </template>
            <template if:false={profileLoadError}>
              <lightning-combobox
                name="portalProfile"
                data-id="portalProfile"
                label="Portal User Profile"
                value={selectedProfileId}
                options={profileOptions}
                onchange={handleProfileChange}
                required
              ></lightning-combobox>
            </template>
          </template>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer d-flex align-items-center justify-content-end gap-2 p-3 bg-light">
        <button
          type="button"
          class="btn btn-light"
          onclick={closeModal}
        >
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          onclick={handleSave}
          disabled={isSaving}
        >
          <template if:true={isSaving}>
            <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          </template>
          Create User
        </button>
      </div>
    </div>
  </section>
</template>
