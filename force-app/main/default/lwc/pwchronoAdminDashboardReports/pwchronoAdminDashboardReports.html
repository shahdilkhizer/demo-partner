<template>
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">
      <!-- Header -->
      <div class="page-header">
        <div class="row align-items-center">
          <div class="col">
            <h3 class="page-title">Reports Dashboard</h3>
            <ul class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="index.html">Dashboard</a>
              </li>
              <li class="breadcrumb-item active">Reports</li>
            </ul>
          </div>
          <div class="col-auto float-end ms-auto">
            <button class="btn add-btn" onclick={handleRefresh}>
              <lightning-icon
                icon-name="utility:refresh"
                size="x-small"
                variant="inverse"
                class="me-2"
              ></lightning-icon>
              Refresh
            </button>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <template if:true={error}>
        <div
          class="alert alert-danger alert-dismissible fade show"
          role="alert"
        >
          <strong>Error!</strong> {error}
          <button
            type="button"
            class="btn-close"
            onclick={handleClearError}
          ></button>
        </div>
      </template>

      <!-- Loading State -->
      <template if:true={isLoading}>
        <div class="text-center p-5">
          <lightning-spinner
            alternative-text="Loading dashboard data..."
            size="large"
          ></lightning-spinner>
        </div>
      </template>

      <!-- Dashboard Content -->
      <template if:false={isLoading}>
        <!-- Top Row: Summary Cards -->
        <div class="row">
          <!-- Employees Card -->
          <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3 d-flex">
            <div class="card flex-fill">
              <div class="card-body">
                <span class="avatar rounded-circle bg-primary mb-2">
                  <lightning-icon
                    icon-name="utility:people"
                    size="small"
                    variant="inverse"
                  ></lightning-icon>
                </span>
                <div class="dash-widget-info">
                  <h6 class="fs-13 fw-medium text-default mb-1">
                    Total Employees
                  </h6>
                  <h3 class="mb-3">{employeeTotal}</h3>
                </div>
              </div>
            </div>
          </div>

          <!-- Leave Requests Card -->
          <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3 d-flex">
            <div class="card flex-fill">
              <div class="card-body">
                <span class="avatar rounded-circle bg-secondary mb-2">
                  <lightning-icon
                    icon-name="utility:date_input"
                    size="small"
                    variant="inverse"
                  ></lightning-icon>
                </span>
                <div class="dash-widget-info">
                  <h6 class="fs-13 fw-medium text-default mb-1">
                    Leave Requests
                  </h6>
                  <h3 class="mb-3">{leaveTotal}</h3>
                </div>
              </div>
            </div>
          </div>

          <!-- Attendance Card -->
          <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3 d-flex">
            <div class="card flex-fill">
              <div class="card-body">
                <span class="avatar rounded-circle bg-info mb-2">
                  <lightning-icon
                    icon-name="utility:clock"
                    size="small"
                    variant="inverse"
                  ></lightning-icon>
                </span>
                <div class="dash-widget-info">
                  <h6 class="fs-13 fw-medium text-default mb-1">
                    Attendance Records
                  </h6>
                  <h3 class="mb-3">{attendanceTotal}</h3>
                </div>
              </div>
            </div>
          </div>

          <!-- Goals Card -->
          <div class="col-md-6 col-sm-6 col-lg-6 col-xl-3 d-flex">
            <div class="card flex-fill">
              <div class="card-body">
                <span class="avatar rounded-circle bg-pink mb-2">
                  <lightning-icon
                    icon-name="utility:target"
                    size="small"
                    variant="inverse"
                  ></lightning-icon>
                </span>
                <div class="dash-widget-info">
                  <h6 class="fs-13 fw-medium text-default mb-1">
                    Performance Goals
                  </h6>
                  <h3 class="mb-3">{goalsTotal}</h3>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Middle Row: Detailed Metrics -->
        <div class="row">
          <!-- Leave Breakdown -->
          <div class="col-lg-4 col-md-12">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title mb-0">Leave Status</h4>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table mb-0">
                    <tbody>
                      <tr>
                        <td>Approved</td>
                        <td class="text-end">{leaveApproved}</td>
                      </tr>
                      <tr>
                        <td>Pending</td>
                        <td class="text-end">{leavePending}</td>
                      </tr>
                      <tr>
                        <td>Rejected</td>
                        <td class="text-end">{leaveRejected}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Attendance Breakdown -->
          <div class="col-lg-4 col-md-12">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title mb-0">Attendance Overview</h4>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table mb-0">
                    <tbody>
                      <tr>
                        <td>On Time</td>
                        <td class="text-end">{attendanceOnTime}</td>
                      </tr>
                      <tr>
                        <td>Late</td>
                        <td class="text-end">{attendanceLate}</td>
                      </tr>
                      <tr>
                        <td>Absent</td>
                        <td class="text-end">{attendanceAbsent}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="mt-3">
                  <p class="mb-1">
                    Attendance Rate
                    <span class="float-end">{attendanceRateFormatted}</span>
                  </p>
                  <div class="progress" style="height: 5px">
                    <div
                      class="progress-bar bg-success"
                      role="progressbar"
                      style="width: 0%"
                      data-id="attendance-bar"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Performance Goals -->
          <div class="col-lg-4 col-md-12">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title mb-0">Goals Progress</h4>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table mb-0">
                    <tbody>
                      <tr>
                        <td>Completed</td>
                        <td class="text-end">{goalsCompleted}</td>
                      </tr>
                      <tr>
                        <td>In Progress</td>
                        <td class="text-end">{goalsInProgress}</td>
                      </tr>
                      <tr>
                        <td>Not Started</td>
                        <td class="text-end">{goalsNotStarted}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="mt-3">
                  <p class="mb-1">
                    Average Progress
                    <span class="float-end">{avgProgressFormatted}</span>
                  </p>
                  <div class="progress" style="height: 5px">
                    <div
                      class="progress-bar bg-primary"
                      role="progressbar"
                      style="width: 0%"
                      data-id="goals-bar"
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom Row: Additional Metrics -->
        <div class="row">
          <!-- Expenses -->
          <div class="col-lg-4 col-md-12">
            <div class="card">
              <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                  <div>
                    <span class="d-block">Expense Claims</span>
                  </div>
                </div>
                <h3 class="mb-3">{expenseTotal}</h3>
                <div class="progress mb-2" style="height: 5px">
                  <div
                    class="progress-bar bg-primary"
                    role="progressbar"
                    style="width: 70%"
                    aria-valuenow="40"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
                <p class="mb-0">
                  Total Amount
                  <span class="text-muted">{expenseTotalAmount}</span>
                </p>
              </div>
            </div>
          </div>

          <!-- Training -->
          <div class="col-lg-4 col-md-12">
            <div class="card">
              <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                  <div>
                    <span class="d-block">Training Programs</span>
                  </div>
                </div>
                <h3 class="mb-3">{trainingTotal}</h3>
                <div class="progress mb-2" style="height: 5px">
                  <div
                    class="progress-bar bg-primary"
                    role="progressbar"
                    style="width: 70%"
                    aria-valuenow="40"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
                <p class="mb-0">
                  Active <span class="text-muted">{trainingActive}</span>
                </p>
              </div>
            </div>
          </div>

          <!-- Recruitment -->
          <div class="col-lg-4 col-md-12">
            <div class="card">
              <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                  <div>
                    <span class="d-block">Recruitment</span>
                  </div>
                </div>
                <h3 class="mb-3">{recruitmentTotal}</h3>
                <div class="progress mb-2" style="height: 5px">
                  <div
                    class="progress-bar bg-primary"
                    role="progressbar"
                    style="width: 70%"
                    aria-valuenow="40"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
                <p class="mb-0">
                  Applicants
                  <span class="text-muted">{recruitmentApplicants}</span>
                </p>
              </div>
            </div>
          </div>
        </div>

        <!-- Employees by Department -->
        <template if:true={employeesByDepartment.length}>
          <div class="row">
            <div class="col-md-12">
              <div class="card">
                <div class="card-header">
                  <h4 class="card-title mb-0">Employees by Department</h4>
                </div>
                <div class="card-body">
                  <div class="row">
                    <template for:each={employeesByDepartment} for:item="dept">
                      <div key={dept.key} class="col-md-3 text-center">
                        <div class="stats-box mb-4">
                          <p>{dept.department}</p>
                          <h3>{dept.count}</h3>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </template>
    </div>
  </div>
</template>
