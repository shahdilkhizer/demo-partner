<!--
  @description Staffing Plan — list view, detail view, and create/edit modal
  @author      PWChrono Team
-->
<template lwc:render-mode="light">
  <div class="page-wrapper">
    <div class="content container-fluid pt-2 ps-2 pe-3 pb-0">

      <!-- Page Header -->
      <div class="d-md-flex d-block align-items-center justify-content-between page-breadcrumb mb-3">
        <div class="my-auto mb-2">
          <h2 class="mb-1">Staffing Plans</h2>
          <nav>
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <button type="button" class="btn btn-link p-0 text-decoration-none" onclick={handleNoop}>
                  <i class="fa-solid fa-house"></i>
                </button>
              </li>
              <li class="breadcrumb-item">Recruitment</li>
              <li class="breadcrumb-item active" aria-current="page">Staffing Plans</li>
            </ol>
          </nav>
        </div>
        <div class="d-flex my-xl-auto right-content align-items-center flex-wrap">
          <!-- Status Filter -->
          <div class="me-2 mb-2">
            <select class="form-select form-select-sm" aria-label="Filter by status" onchange={handleStatusFilter}>
              <option value="All">All Status</option>
              <option value="Draft">Draft</option>
              <option value="Submitted">Submitted</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
          <div class="mb-2">
            <button type="button" class="btn btn-primary d-flex align-items-center" onclick={handleNewPlan}>
              <i class="fa-solid fa-circle-plus me-2"></i>New Staffing Plan
            </button>
          </div>
        </div>
      </div>
      <!-- /Page Header -->

      <!-- Metric Cards -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-xl-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-primary-subtle rounded-circle flex-shrink-0">
                <i class="fa-solid fa-list-check fa-lg text-primary"></i>
              </span>
              <div>
                <p class="text-muted small mb-0">Total Plans</p>
                <h4 class="mb-0">{totalCount}</h4>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-warning-subtle rounded-circle flex-shrink-0">
                <i class="fa-solid fa-pen-to-square fa-lg text-warning"></i>
              </span>
              <div>
                <p class="text-muted small mb-0">Draft</p>
                <h4 class="mb-0">{draftCount}</h4>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-success-subtle rounded-circle flex-shrink-0">
                <i class="fa-solid fa-paper-plane fa-lg text-success"></i>
              </span>
              <div>
                <p class="text-muted small mb-0">Submitted</p>
                <h4 class="mb-0">{submittedCount}</h4>
              </div>
            </div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body d-flex align-items-center gap-3">
              <span class="avatar avatar-lg bg-secondary-subtle rounded-circle flex-shrink-0">
                <i class="fa-solid fa-lock fa-lg text-secondary"></i>
              </span>
              <div>
                <p class="text-muted small mb-0">Closed</p>
                <h4 class="mb-0">{closedCount}</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- /Metric Cards -->

      <!-- Loading Spinner -->
      <template if:true={isLoading}>
        <div class="d-flex justify-content-center p-5">
          <div class="spinner-border text-primary" aria-label="Loading">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </template>

      <!-- Plans Table -->
      <template if:false={isLoading}>
        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th scope="col">Plan Name</th>
                    <th scope="col">Department</th>
                    <th scope="col">From Date</th>
                    <th scope="col">To Date</th>
                    <th scope="col">Status</th>
                    <th scope="col">Total Est. Cost</th>
                    <th scope="col">Requested By</th>
                    <th scope="col" class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <template if:true={hasPlans}>
                    <template for:each={filteredPlans} for:item="plan">
                      <tr key={plan.Id}>
                        <td>
                          <button type="button" class="fw-semibold text-dark btn btn-link p-0 text-decoration-none"
                            data-id={plan.Id} onclick={handleViewDetail}>
                            {plan.Name}
                          </button>
                        </td>
                        <td>{plan.departmentName}</td>
                        <td>{plan.formattedFromDate}</td>
                        <td>{plan.formattedToDate}</td>
                        <td>
                          <span class={plan.statusBadgeClass}>{plan.Status__c}</span>
                        </td>
                        <td>{plan.formattedCost}</td>
                        <td>{plan.requestedByName}</td>
                        <td class="text-end">
                          <div class="d-flex justify-content-end gap-1">
                            <button type="button" class="btn btn-sm btn-outline-primary"
                              data-id={plan.Id} onclick={handleEdit}
                              title="Edit">
                              <i class="fa-solid fa-pen"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-success"
                              data-id={plan.Id} data-status="Submitted" onclick={handleStatusChange}
                              title="Submit" disabled={plan.isSubmitted}>
                              <i class="fa-solid fa-paper-plane"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                              data-id={plan.Id} onclick={handleDelete}
                              title="Delete">
                              <i class="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </template>
                  <template if:false={hasPlans}>
                    <tr>
                      <td colspan="8" class="text-center text-muted py-5">
                        <i class="fa-solid fa-folder-open fa-2x mb-2 d-block"></i>
                        No staffing plans found. Click <strong>New Staffing Plan</strong> to create one.
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </template>
      <!-- /Plans Table -->

    </div>
  </div>

  <!-- ===== Create / Edit Modal ===== -->
  <template if:true={isModalOpen}>
    <div class="modal fade show d-block" tabindex="-1" aria-modal="true"
         aria-labelledby="staffingPlanModalTitle">
      <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title" id="staffingPlanModalTitle">{modalTitle}</h5>
            <button type="button" class="btn-close" onclick={handleCloseModal} aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <!-- Header Fields -->
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="spName">Plan Name <span class="text-danger">*</span></label>
                <input type="text" id="spName" class="form-control" name="Name"
                  value={editRecord.Name} onchange={handleFieldChange}
                  placeholder="e.g. Q3 2026 Hiring Plan" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="spCompany">Company</label>
                <input type="text" id="spCompany" class="form-control" name="Company__c"
                  value={editRecord.Company__c} onchange={handleFieldChange}
                  placeholder="Company name" />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="spDept">Department</label>
                <select id="spDept" class="form-select" name="Department__c" onchange={handleFieldChange}>
                  <option value="">-- Select Department --</option>
                  <template for:each={departmentOptions} for:item="opt">
                    <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                  </template>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold" for="spFromDate">From Date <span class="text-danger">*</span></label>
                <input type="date" id="spFromDate" class="form-control" name="From_Date__c"
                  value={editRecord.From_Date__c} onchange={handleFieldChange} />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold" for="spToDate">To Date <span class="text-danger">*</span></label>
                <input type="date" id="spToDate" class="form-control" name="To_Date__c"
                  value={editRecord.To_Date__c} onchange={handleFieldChange} />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold" for="spStatus">Status</label>
                <select id="spStatus" class="form-select" name="Status__c" onchange={handleFieldChange}>
                  <option value="Draft" selected={isDraft}>Draft</option>
                  <option value="Submitted" selected={isSubmitted}>Submitted</option>
                  <option value="Closed" selected={isClosed}>Closed</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label fw-semibold" for="spNotes">Notes</label>
                <textarea id="spNotes" class="form-control" name="Notes__c" rows="2"
                  onchange={handleFieldChange}
                  placeholder="Optional notes...">{editRecord.Notes__c}</textarea>
              </div>
            </div>

            <!-- Detail Rows Section -->
            <div class="d-flex align-items-center justify-content-between mb-2">
              <h6 class="fw-semibold mb-0">
                <i class="fa-solid fa-table-list me-1 text-primary"></i>
                Position Details
              </h6>
              <button type="button" class="btn btn-sm btn-outline-primary" onclick={handleAddDetailRow}>
                <i class="fa-solid fa-plus me-1"></i>Add Row
              </button>
            </div>

            <div class="table-responsive">
              <table class="table table-bordered align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Designation</th>
                    <th style="width:100px">Vacancies</th>
                    <th style="width:160px">Cost Per Position</th>
                    <th style="width:160px">Positions</th>
                    <th style="width:160px">Total Cost</th>
                    <th style="width:50px"></th>
                  </tr>
                </thead>
                <tbody>
                  <template if:true={hasDetailRows}>
                    <template for:each={editDetails} for:item="row" for:index="idx">
                      <tr key={row._key}>
                        <td>
                          <select class="form-select form-select-sm" aria-label="Designation"
                            data-idx={idx} name="Designation__c" onchange={handleDetailChange}>
                            <option value="">-- Select --</option>
                            <template for:each={designationOptions} for:item="opt">
                              <option key={opt.value} value={opt.value}
                                selected={opt.selected}>{opt.label}</option>
                            </template>
                          </select>
                        </td>
                        <td>
                          <input type="number" class="form-control form-control-sm" aria-label="Vacancies" min="0"
                            data-idx={idx} name="Vacancies__c"
                            value={row.Vacancies__c} onchange={handleDetailChange} />
                        </td>
                        <td>
                          <input type="number" class="form-control form-control-sm" aria-label="Estimated cost per position" min="0"
                            data-idx={idx} name="Estimated_Cost_Per_Position__c"
                            value={row.Estimated_Cost_Per_Position__c} onchange={handleDetailChange} />
                        </td>
                        <td>
                          <input type="number" class="form-control form-control-sm" aria-label="Number of positions" min="0"
                            data-idx={idx} name="Number_of_Positions__c"
                            value={row.Number_of_Positions__c} onchange={handleDetailChange} />
                        </td>
                        <td class="fw-semibold text-end">{row.rowTotalFormatted}</td>
                        <td class="text-center">
                          <button type="button" class="btn btn-sm btn-outline-danger p-1 px-2"
                            data-idx={idx} onclick={handleRemoveDetailRow}>
                            <i class="fa-solid fa-xmark"></i>
                          </button>
                        </td>
                      </tr>
                    </template>
                  </template>
                  <template if:false={hasDetailRows}>
                    <tr>
                      <td colspan="6" class="text-center text-muted py-3">
                        No position rows yet. Click <strong>Add Row</strong> to begin.
                      </td>
                    </tr>
                  </template>
                </tbody>
                <template if:true={hasDetailRows}>
                  <tfoot class="table-light">
                    <tr>
                      <td colspan="4" class="text-end fw-semibold">Grand Total Est. Cost</td>
                      <td class="fw-bold text-end">{grandTotalFormatted}</td>
                      <td></td>
                    </tr>
                  </tfoot>
                </template>
              </table>
            </div>

          </div><!-- /modal-body -->

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" onclick={handleCloseModal}>
              Cancel
            </button>
            <button type="button" class="btn btn-primary" onclick={handleSave} disabled={isSaving}>
              <template if:true={isSaving}>
                <span class="spinner-border spinner-border-sm me-1" aria-label="Loading"></span>
              </template>
              <template if:false={isSaving}>
                <i class="fa-solid fa-floppy-disk me-1"></i>
              </template>
              Save
            </button>
          </div>

        </div>
      </div>
    </div>
    <div class="modal-backdrop fade show"></div>
  </template>
  <!-- ===== /Modal ===== -->

</template>
