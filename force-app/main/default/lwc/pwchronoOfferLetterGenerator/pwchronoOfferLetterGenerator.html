<template lwc:render-mode="light">
  <div class="offer-letter-generator-container">
    <div class="card border shadow-sm mb-4">
      <div class="card-header bg-white border-bottom py-3">
        <h5 class="mb-0 fw-bold text-dark">Offer Letter Generator</h5>
        <small class="text-muted">Create and preview job offers for selected candidates</small>
      </div>

      <div class="card-body p-4">
        <template if:true={isLoading}>
          <div class="d-flex justify-content-center align-items-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading offer details...</span>
            </div>
          </div>
        </template>

        <template if:false={isLoading}>
          <!-- Success Confirmation Banner -->
          <template if:true={successMessage}>
            <div class="alert alert-success d-flex align-items-center justify-content-between p-3 mb-4 rounded shadow-sm border border-success" role="alert">
              <div class="d-flex align-items-center gap-3">
                <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center flex-shrink-0" style="width: 38px; height: 38px;">
                  <i class="fa-solid fa-circle-check fs-5"></i>
                </div>
                <div>
                  <h6 class="fw-bold mb-1 text-success">Offer Letter Generated Successfully!</h6>
                  <p class="mb-0 text-dark small">{successMessage}</p>
                </div>
              </div>
              <button type="button" class="btn-close ms-auto" onclick={dismissSuccessMessage} aria-label="Close"></button>
            </div>
          </template>

          <div class="row g-4">
            <!-- Form Column -->
            <div class="col-12 col-lg-5">
              <div class="card border bg-light h-100">
                <div class="card-body p-4">
                  <h6 class="fw-bold text-dark mb-3">Offer Details</h6>

                  <div class="mb-3">
                    <lightning-combobox
                      name="Job_Applicant__c"
                      label="Select Applicant"
                      value={selectedApplicantId}
                      placeholder="Search applicant..."
                      options={applicantOptions}
                      onchange={handleApplicantChange}
                      required
                    ></lightning-combobox>
                  </div>

                  <div class="mb-3">
                    <lightning-combobox
                      name="Designation__c"
                      label="Designation"
                      value={offerDetails.Designation__c}
                      options={designationOptions}
                      onchange={handleInputChange}
                      required
                    ></lightning-combobox>
                  </div>

                  <div class="mb-3">
                    <lightning-input
                      type="number"
                      label="Offered CTC (Annual)"
                      name="Offered_CTC__c"
                      value={offerDetails.Offered_CTC__c}
                      formatter="currency"
                      step="0.01"
                      onchange={handleInputChange}
                      required
                    ></lightning-input>
                  </div>

                  <div class="row g-2 mb-3">
                    <div class="col-12 col-md-6">
                      <lightning-input
                        type="date"
                        label="Joining Date"
                        name="Joining_Date__c"
                        value={offerDetails.Joining_Date__c}
                        onchange={handleInputChange}
                        required
                      ></lightning-input>
                    </div>
                    <div class="col-12 col-md-6">
                      <lightning-input
                        type="date"
                        label="Offer Expiry Date"
                        name="Expiry_Date__c"
                        value={offerDetails.Expiry_Date__c}
                        onchange={handleInputChange}
                        required
                      ></lightning-input>
                    </div>
                  </div>

                  <div class="pt-3 border-top">
                    <button
                      type="button"
                      class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
                      onclick={handleGenerateOffer}
                      disabled={isGenerateDisabled}
                    >
                      <i class="fa-solid fa-paper-plane"></i> Generate &amp; Send Offer
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Preview Column -->
            <div class="col-12 col-lg-7">
              <div class="card border shadow-none">
                <div class="card-body p-4 bg-white">
                  <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
                    <h6 class="fw-bold text-dark mb-0">Letter Preview</h6>
                    <span class="badge bg-secondary-subtle text-secondary">Document Preview</span>
                  </div>

                  <div class="p-4 border rounded bg-white shadow-sm" style="font-family: serif; min-height: 400px; color: #1e293b;">
                    <div class="text-center pb-3 border-bottom mb-4">
                      <h4 class="fw-bold text-dark mb-1" style="font-family: sans-serif;">{companyName}</h4>
                      <small class="text-muted">Human Resources Department</small>
                    </div>

                    <div class="mb-3">
                      <p class="mb-1"><strong>Date:</strong> {todayDate}</p>
                      <p class="mb-1"><strong>To:</strong> {selectedApplicantName}</p>
                      <p class="mb-3 fw-bold text-decoration-underline">Subject: Offer of Employment</p>
                    </div>

                    <p class="mb-3">Dear {selectedApplicantName},</p>

                    <p class="mb-3">
                      We are delighted to offer you the position of <strong>{selectedDesignationName}</strong> at <strong>{companyName}</strong>.
                    </p>

                    <p class="mb-3">
                      Your annual Cost to Company (CTC) will be
                      <strong>
                        <lightning-formatted-number
                          value={offerDetails.Offered_CTC__c}
                          format-style="currency"
                          currency-code={currencyCode}
                        ></lightning-formatted-number>
                      </strong>.
                    </p>

                    <p class="mb-3">
                      Your anticipated date of joining will be
                      <strong>
                        <lightning-formatted-date-time
                          value={offerDetails.Joining_Date__c}
                        ></lightning-formatted-date-time>
                      </strong>.
                    </p>

                    <p class="mb-4">
                      Please note this offer is valid until
                      <strong>
                        <lightning-formatted-date-time
                          value={offerDetails.Expiry_Date__c}
                        ></lightning-formatted-date-time>
                      </strong>.
                    </p>

                    <div class="pt-4 border-top">
                      <p class="mb-1">Sincerely,</p>
                      <p class="mb-0 fw-bold">HR Operations</p>
                      <p class="text-muted small">{companyName}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
